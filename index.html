<script>/* js/core/inventory.js */
/* ABYSSAL LEGENDS - 装備：生成・強化・売却・ロック・装着・自動整理 */
(function (G) {
  'use strict';
  var AL = G.AL = G.AL || {};
  var C = AL.CONFIG, D = AL.DATA, U = AL.U;
  var Inv = AL.Inv = {};

  var PREFIX = ['古びた', '頑丈な', '魔鋼の', '黒曜の', '英雄の', '神話の'];

  Inv.name = function (it) {
    var b = D.EQUIP_BASES[it.base];
    if (!b) return '不明な装備';
    return (it.set ? D.SETS[it.set].name + 'の' : PREFIX[it.rarity]) + b.name;
  };

  Inv.rollRarity = function (floor, opts) {
    opts = opts || {};
    var w = C.EQUIP.RARITY_WEIGHTS.slice();
    var f = Math.min(Math.max(1, floor), 600);
    var bonus = 1 + (opts.bonus || 0);
    for (var i = 1; i < w.length; i++) w[i] *= (1 + C.EQUIP.RARITY_FLOOR_SHIFT * f * i) * (i >= 3 ? bonus : 1);
    var min = opts.minRarity || 0;
    for (var j = 0; j < min; j++) w[j] = 0;
    return U.weightedIndex(w);
  };

  Inv.rollSub = function (stat, ilvl, rarity) {
    var sd = D.SUBSTATS[stat], R = D.EQUIP_RARITY[rarity];
    var v = U.randRange(sd.min, sd.max) * R.subMult;
    if (sd.flat) v *= AL.Scale.gear(ilvl);
    return U.safe(v);
  };

  // 装備生成。opts: {ilvl, rarity, minRarity, slot, base, setSource, setChance, set}
  Inv.generate = function (opts) {
    opts = opts || {};
    var ilvl = Math.max(1, Math.floor(opts.ilvl || 1));
    var rarity = opts.rarity != null ? opts.rarity : Inv.rollRarity(ilvl, { minRarity: opts.minRarity, bonus: opts.rarityBonus });
    var R = D.EQUIP_RARITY[rarity];
    var base;
    if (opts.base) base = D.EQUIP_BASES[opts.base];
    else {
      var cands = D.EQUIP_BASE_LIST.filter(function (b) { return !opts.slot || b.slot === opts.slot; });
      base = U.pick(cands);
    }
    var flat = !!D.FLAT_STATS[base.main];
    var mainVal = flat ? base.mainBase * AL.Scale.gear(ilvl) * R.mult : base.mainBase * (1 + (R.mult - 1) * 0.6);
    mainVal *= U.randRange(0.92, 1.08);
    var item = { uid: U.uid('i'), base: base.id, rarity: rarity, ilvl: ilvl, enh: 0,
      main: { stat: base.main, value: U.safe(mainVal) }, subs: [], set: null, locked: false };
    // サブ能力（重複なし、主能力とも重複しない）
    var pool = Object.keys(D.SUBSTATS).filter(function (k) { return k !== base.main; });
    for (var i = 0; i < R.subs && pool.length; i++) {
      var weights = pool.map(function (k) { return D.SUBSTATS[k].w * (base.bias.indexOf(k) >= 0 ? 2.2 : 1); });
      var idx = U.weightedIndex(weights);
      var st = pool.splice(idx, 1)[0];
      item.subs.push({ stat: st, value: Inv.rollSub(st, ilvl, rarity), rolls: 1 });
    }
    // セット
    if (opts.set && D.SETS[opts.set]) item.set = opts.set;
    else if (rarity >= 3 || opts.forceSet) {
      var src = opts.setSource || 'tower';
      var sets = D.SET_ORDER.filter(function (s) { return D.SETS[s].sources.indexOf(src) >= 0; });
      var ch = opts.setChance != null ? opts.setChance : C.EQUIP.SET_CHANCE;
      if (sets.length && (opts.forceSet || U.chance(ch))) item.set = U.pick(sets);
    }
    return item;
  };

  Inv.sellValue = function (it) {
    var R = D.EQUIP_RARITY[it.rarity];
    return U.safe(Math.floor(8 * AL.Scale.reward(it.ilvl) * R.sell * (1 + it.enh * 0.25)) + 1);
  };
  Inv.sellStones = function (it) { return Math.floor(it.enh * (1 + it.rarity) * 0.5); };

  Inv.equippedBy = function (state, uid) {
    var ids = Object.keys(state.heroes);
    for (var i = 0; i < ids.length; i++) {
      var eq = state.heroes[ids[i]].equip;
      for (var s in eq) if (eq[s] === uid) return ids[i];
    }
    return null;
  };
  Inv.equippedSet = function (state) {
    var m = {};
    Object.keys(state.heroes).forEach(function (id) {
      var eq = state.heroes[id].equip;
      Object.keys(eq).forEach(function (s) { if (eq[s]) m[eq[s]] = id; });
    });
    return m;
  };

  Inv.find = function (state, uid) { return AL.Stats.itemMap(state)[uid] || null; };

  function touch(state) { AL.Stats.invalidate(); AL.Events.emit('inventory'); }

  // 図鑑登録
  Inv.registerCodex = function (state, it) {
    var cur = state.codex.equips[it.base];
    if (cur == null || it.rarity > cur) state.codex.equips[it.base] = it.rarity;
    if (it.set) state.codex.sets[it.set] = true;
    if (it.rarity === 5) state.stats.mythicFound++;
  };

  // 入手処理（自動売却・所持上限を考慮）。戻り値 {kept:bool, gold, reason}
  Inv.add = function (state, it, opts) {
    opts = opts || {};
    Inv.registerCodex(state, it);
    var auto = state.settings.autoSell;
    if (!opts.noAutoSell && auto >= 0 && it.rarity <= auto && !it.set) {
      var g = Inv.sellValue(it);
      state.currency.gold = U.safe(state.currency.gold + g);
      return { kept: false, gold: g, reason: 'auto' };
    }
    if (state.items.length >= C.EQUIP.INVENTORY_CAP) {
      var g2 = Inv.sellValue(it);
      state.currency.gold = U.safe(state.currency.gold + g2);
      return { kept: false, gold: g2, reason: 'full' };
    }
    state.items.push(it);
    touch(state);
    return { kept: true, gold: 0 };
  };

  Inv.sell = function (state, uid) {
    var it = Inv.find(state, uid);
    if (!it) return { ok: false, msg: '装備が見つかりません' };
    if (it.locked) return { ok: false, msg: 'ロック中の装備は売却できません' };
    if (Inv.equippedBy(state, uid)) return { ok: false, msg: '装備中の装備は売却できません' };
    var g = Inv.sellValue(it), st = Inv.sellStones(it);
    state.items = state.items.filter(function (x) { return x.uid !== uid; });
    state.currency.gold = U.safe(state.currency.gold + g);
    state.currency.stones += st;
    touch(state);
    return { ok: true, gold: g, stones: st };
  };

  // 一括売却：レアリティ maxRarity 以下、未装備・未ロック。onlySet=false ならセット装備も含む
  Inv.sellableList = function (state, maxRarity, includeSets) {
    var eq = Inv.equippedSet(state);
    return state.items.filter(function (it) {
      return it.rarity <= maxRarity && !it.locked && !eq[it.uid] && (includeSets || !it.set);
    });
  };
  // uids を渡すと、その中で今も売却できるものだけを売る（確認中に入手した装備を売らないため）
  Inv.sellBulk = function (state, maxRarity, includeSets, uids) {
    var list = Inv.sellableList(state, maxRarity, includeSets);
    if (uids) list = list.filter(function (it) { return uids.indexOf(it.uid) >= 0; });
    var gold = 0, stones = 0, ids = {};
    list.forEach(function (it) { gold += Inv.sellValue(it); stones += Inv.sellStones(it); ids[it.uid] = true; });
    state.items = state.items.filter(function (it) { return !ids[it.uid]; });
    state.currency.gold = U.safe(state.currency.gold + gold);
    state.currency.stones += stones;
    touch(state);
    return { count: list.length, gold: gold, stones: stones };
  };

  // ---- 一括操作：画面ではまず内訳（preview）を数えて確認を出し、実行時に1つずつ条件を確かめ直す ----
  // 装備中かどうかは、編成に関係なく所持しているすべての仲間の装備（Inv.equippedSet）で判定する。
  // 一括売却の内訳：レアリティ maxRarity 以下の装備のうち、売却できるもの（通常・セットとも）と、売却しない理由ごとの数
  Inv.bulkSellPreview = function (state, maxRarity) {
    var eq = Inv.equippedSet(state), out = { list: [], normal: 0, set: 0, gold: 0, stones: 0, equipped: 0, locked: 0 };
    state.items.forEach(function (it) {
      if (it.rarity > maxRarity) return;
      if (eq[it.uid]) { out.equipped++; return; }
      if (it.locked) { out.locked++; return; }
      out.list.push(it);
      if (it.set) out.set++; else out.normal++;
      out.gold += Inv.sellValue(it); out.stones += Inv.sellStones(it);
    });
    return out;
  };
  // 装備中を一括ロック：だれかが装備している、ロックしていない装備が対象（already＝装備中でロック済み）
  Inv.lockEquippedPreview = function (state) {
    var eq = Inv.equippedSet(state), out = { list: [], normal: 0, set: 0, already: 0 };
    state.items.forEach(function (it) {
      if (!eq[it.uid]) return;
      if (it.locked) { out.already++; return; }
      out.list.push(it);
      if (it.set) out.set++; else out.normal++;
    });
    return out;
  };
  // uids を渡すと、その中で今も対象のものだけをロックする（確認中に装備が変わった場合に備える）
  Inv.lockEquipped = function (state, uids) {
    var eq = Inv.equippedSet(state), res = { count: 0, normal: 0, set: 0 };
    state.items.forEach(function (it) {
      if (uids && uids.indexOf(it.uid) < 0) return;
      if (!eq[it.uid] || it.locked) return;
      it.locked = true;
      res.count++;
      if (it.set) res.set++; else res.normal++;
    });
    if (res.count) touch(state);
    return res;
  };
  // 未装備を一括ロック解除：だれも装備していない、ロック中の装備が対象（equipped＝ロック中だが装備中のため対象外）
  Inv.unlockFreePreview = function (state) {
    var eq = Inv.equippedSet(state), out = { list: [], normal: 0, set: 0, equipped: 0 };
    state.items.forEach(function (it) {
      if (!it.locked) return;
      if (eq[it.uid]) { out.equipped++; return; }
      out.list.push(it);
      if (it.set) out.set++; else out.normal++;
    });
    return out;
  };
  Inv.unlockFree = function (state, uids) {
    var eq = Inv.equippedSet(state), res = { count: 0, normal: 0, set: 0 };
    state.items.forEach(function (it) {
      if (uids && uids.indexOf(it.uid) < 0) return;
      if (!it.locked || eq[it.uid]) return;
      it.locked = false;
      res.count++;
      if (it.set) res.set++; else res.normal++;
    });
    if (res.count) touch(state);
    return res;
  };

  Inv.toggleLock = function (state, uid) {
    var it = Inv.find(state, uid);
    if (!it) return false;
    it.locked = !it.locked;
    touch(state);
    return it.locked;
  };

  Inv.enhanceCost = function (it) {
    return {
      gold: U.safe(Math.floor(25 * AL.Scale.reward(it.ilvl) * (it.enh + 1) * (1 + it.rarity * 0.5))),
      stones: (it.enh + 1) * (1 + it.rarity)
    };
  };
  Inv.enhance = function (state, uid) {
    var it = Inv.find(state, uid);
    if (!it) return { ok: false, msg: '装備が見つかりません' };
    var R = D.EQUIP_RARITY[it.rarity];
    if (it.enh >= R.maxEnh) return { ok: false, msg: '強化上限です' };
    var cost = Inv.enhanceCost(it);
    if (state.currency.gold < cost.gold) return { ok: false, msg: 'ゴールドが足りません' };
    if (state.currency.stones < cost.stones) return { ok: false, msg: '強化石が足りません' };
    state.currency.gold -= cost.gold;
    state.currency.stones -= cost.stones;
    it.enh++;
    var upgraded = null;
    if (it.enh % C.EQUIP.SUB_UPGRADE_EVERY === 0 && it.subs.length) {
      var sb = U.pick(it.subs);
      sb.value = U.safe(sb.value + Inv.rollSub(sb.stat, it.ilvl, it.rarity));
      sb.rolls = (sb.rolls || 1) + 1;
      upgraded = sb.stat;
    }
    state.stats.enhances++;
    state.stats.maxEnh = Math.max(state.stats.maxEnh || 0, it.enh);   // クエスト用：これまでの最高強化値
    touch(state);
    return { ok: true, enh: it.enh, upgraded: upgraded };
  };

  Inv.equip = function (state, heroId, uid) {
    var it = Inv.find(state, uid), h = state.heroes[heroId];
    if (!it || !h) return false;
    var slot = D.EQUIP_BASES[it.base].slot;
    var owner = Inv.equippedBy(state, uid);
    if (owner) state.heroes[owner].equip[slot] = null;
    h.equip[slot] = uid;
    touch(state);
    AL.Events.emit('loadout');
    return true;
  };
  Inv.unequip = function (state, heroId, slot) {
    var h = state.heroes[heroId];
    if (!h) return false;
    h.equip[slot] = null;
    touch(state);
    AL.Events.emit('loadout');
    return true;
  };

  // 最適装備（他の仲間が装備中のものは奪わない）
  Inv.autoEquip = function (state, heroId) {
    var h = state.heroes[heroId], hd = D.HEROES[heroId];
    if (!h) return 0;
    var eq = Inv.equippedSet(state), changed = 0;
    D.SLOTS.forEach(function (sl) {
      var cur = Inv.find(state, h.equip[sl]);
      var best = cur, bestScore = cur ? AL.Stats.itemScore(cur, hd.role) : -1;
      state.items.forEach(function (it) {
        if (D.EQUIP_BASES[it.base].slot !== sl) return;
        if (eq[it.uid] && eq[it.uid] !== heroId) return;
        var sc = AL.Stats.itemScore(it, hd.role);
        if (sc > bestScore) { best = it; bestScore = sc; }
      });
      if (best && best !== cur) { h.equip[sl] = best.uid; changed++; }
    });
    if (changed) { touch(state); AL.Events.emit('loadout'); }
    return changed;
  };

  Inv.sortItems = function (list, mode) {
    var f = {
      rarity: function (a, b) { return b.rarity - a.rarity || b.ilvl - a.ilvl || b.enh - a.enh; },
      ilvl: function (a, b) { return b.ilvl - a.ilvl || b.rarity - a.rarity; },
      score: function (a, b) { return AL.Stats.itemScore(b) - AL.Stats.itemScore(a); },
      slot: function (a, b) { return D.SLOTS.indexOf(D.EQUIP_BASES[a.base].slot) - D.SLOTS.indexOf(D.EQUIP_BASES[b.base].slot) || b.rarity - a.rarity; },
      newest: function () { return 0; }
    }[mode] || null;
    var arr = list.slice();
    if (mode === 'newest') arr.reverse();
    else if (f) arr.sort(f);
    return arr;
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>/* js/core/heroes.js */
/* ABYSSAL LEGENDS - 仲間：獲得・重複処理・レベルアップ・限界突破・編成 */
(function (G) {
  'use strict';
  var AL = G.AL = G.AL || {};
  var C = AL.CONFIG, D = AL.DATA, U = AL.U;
  var Heroes = AL.Heroes = {};

  Heroes.expToNext = function (lv) {
    return U.safe(Math.floor(C.HERO.EXP_BASE * Math.pow(C.HERO.EXP_GROWTH, lv - 1) + 8 * lv));
  };

  // 仲間を獲得。重複は限界突破（上限まで）→ 上限後は欠片に変換
  Heroes.add = function (state, id) {
    var hd = D.HEROES[id];
    if (!hd) return null;
    state.codex.heroes[id] = true;
    var h = state.heroes[id];
    if (!h) {
      state.heroes[id] = AL.State.newHero();
      state.stats.heroesOwned = Object.keys(state.heroes).length;
      // 編成に空きがあれば自動で加える
      var empty = state.party.indexOf(null);
      if (empty >= 0) { state.party[empty] = id; AL.Events.emit('loadout'); }
      return { id: id, isNew: true, lb: 0, shards: 0 };
    }
    if (h.lb < C.HERO.MAX_LB) {
      h.lb++;
      state.stats.maxLB = Math.max(state.stats.maxLB, h.lb);
      AL.Events.emit('loadout');
      return { id: id, isNew: false, lb: h.lb, shards: 0 };
    }
    var sh = C.HERO.DUPE_SHARDS[hd.rarity];
    state.currency.shards += sh;
    return { id: id, isNew: false, lb: h.lb, shards: sh };
  };

  Heroes.levelUp = function (state, id, n) {
    var h = state.heroes[id];
    if (!h) return 0;
    var cap = AL.Stats.levelCap(state, id), gained = 0;
    n = n || 1;
    while (gained < n && h.lv < cap) {
      var cost = Heroes.expToNext(h.lv);
      if (state.currency.exp < cost) break;
      state.currency.exp -= cost;
      h.lv++; gained++;
    }
    // クエスト用の記録（レベルアップの累計・これまでの最高レベル。転生でレベルが戻っても減らない）
    state.stats.levelUps += gained;
    state.stats.maxHeroLv = Math.max(state.stats.maxHeroLv || 0, h.lv);
    if (gained) AL.Events.emit('loadout');
    return gained;
  };
  Heroes.costFor = function (state, id, n) {
    var h = state.heroes[id], cap = AL.Stats.levelCap(state, id), total = 0, lv = h.lv, k = 0;
    while (k < n && lv < cap) { total += Heroes.expToNext(lv); lv++; k++; }
    return { exp: total, levels: k };
  };

  // 編成中の仲間を、レベルの低い順に自動でレベルアップ
  Heroes.autoLevelParty = function (state) {
    var ids = state.party.filter(Boolean), total = 0, guard = 0;
    while (guard++ < 500) {
      var best = null;
      ids.forEach(function (id) {
        var h = state.heroes[id];
        if (h.lv >= AL.Stats.levelCap(state, id)) return;
        if (!best || h.lv < state.heroes[best].lv) best = id;
      });
      if (!best) break;
      if (state.currency.exp < Heroes.expToNext(state.heroes[best].lv)) break;
      total += Heroes.levelUp(state, best, 1);
    }
    return total;
  };

  Heroes.shardLbCost = function (id) { return C.HERO.SHARD_LB_COST[D.HEROES[id].rarity]; };
  Heroes.limitBreakWithShards = function (state, id) {
    var h = state.heroes[id];
    if (!h) return { ok: false, msg: '未所持です' };
    if (h.lb >= C.HERO.MAX_LB) return { ok: false, msg: '限界突破は最大です' };
    var cost = Heroes.shardLbCost(id);
    if (state.currency.shards < cost) return { ok: false, msg: '英雄の欠片が足りません' };
    state.currency.shards -= cost;
    h.lb++;
    state.stats.maxLB = Math.max(state.stats.maxLB, h.lb);
    AL.Events.emit('loadout');
    return { ok: true, lb: h.lb };
  };

  // ---- 編成 ----
  Heroes.setSlot = function (state, slot, id) {
    if (slot < 0 || slot >= C.HERO.PARTY_SIZE) return false;
    if (id && !state.heroes[id]) return false;
    var cur = state.party.indexOf(id);
    if (id && cur >= 0) { state.party[cur] = state.party[slot]; } // 入れ替え
    state.party[slot] = id || null;
    if (!state.party.some(Boolean)) { state.party[slot] = id || Object.keys(state.heroes)[0]; }
    AL.Events.emit('loadout');
    return true;
  };
  Heroes.removeSlot = function (state, slot) {
    if (state.party.filter(Boolean).length <= 1) return false;
    state.party[slot] = null;
    AL.Events.emit('loadout');
    return true;
  };

  // おまかせ編成：役割バランス（タンク1・ヒーラー1・残りは戦闘力順）
  Heroes.autoParty = function (state) {
    var ids = Object.keys(state.heroes);
    var power = {};
    ids.forEach(function (id) { power[id] = AL.Stats.hero(state, id).power; });
    var byRole = function (role) { return ids.filter(function (id) { return D.HEROES[id].role === role; }).sort(function (a, b) { return power[b] - power[a]; }); };
    var pick = [];
    var tank = byRole('tank')[0], healer = byRole('healer')[0];
    if (tank) pick.push(tank);
    var rest = ids.filter(function (id) { return id !== tank && id !== healer && D.HEROES[id].role !== 'tank'; })
      .sort(function (a, b) { return power[b] - power[a]; });
    var dps = rest.slice(0, healer ? 3 : 4);
    pick = pick.concat(dps);
    if (healer) pick.push(healer);
    // 不足分を補充
    ids.sort(function (a, b) { return power[b] - power[a]; }).forEach(function (id) { if (pick.length < C.HERO.PARTY_SIZE && pick.indexOf(id) < 0) pick.push(id); });
    // 前衛にタンク・物理を配置
    var order = { tank: 0, phys: 1, support: 2, mage: 3, healer: 4 };
    pick.sort(function (a, b) { return order[D.HEROES[a].role] - order[D.HEROES[b].role]; });
    state.party = [null, null, null, null, null].map(function (_, i) { return pick[i] || null; });
    AL.Events.emit('loadout');
  };

  Heroes.sortedIds = function (state, mode, filter) {
    filter = filter || {};
    var ids = Object.keys(state.heroes).filter(function (id) {
      var hd = D.HEROES[id];
      if (filter.role && hd.role !== filter.role) return false;
      if (filter.element && hd.element !== filter.element) return false;
      return true;
    });
    var cache = {};
    function pw(id) { return cache[id] || (cache[id] = AL.Stats.hero(state, id).power); }
    var fns = {
      power: function (a, b) { return pw(b) - pw(a); },
      rarity: function (a, b) { return D.HEROES[b].rarity - D.HEROES[a].rarity || pw(b) - pw(a); },
      level: function (a, b) { return state.heroes[b].lv - state.heroes[a].lv || pw(b) - pw(a); },
      id: function (a, b) { return a < b ? -1 : 1; }
    };
    return ids.sort(fns[mode] || fns.power);
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>/* js/core/gacha.js */
/* ABYSSAL LEGENDS - ガチャ
 * 表示する排出率と抽選は、どちらも rateTable() の同じ表を使います（表示と実処理の一致を保証）。 */
(function (G) {
  'use strict';
  var AL = G.AL = G.AL || {};
  var C = AL.CONFIG, D = AL.DATA, U = AL.U;
  var Gacha = AL.Gacha = {};

  Gacha.currentPickup = function (now) {
    var rot = D.PICKUP_ROTATION;
    if (!rot.length) return null;
    var wk = U.weekIndex(now);
    var p = rot[((wk % rot.length) + rot.length) % rot.length];
    var base = Date.UTC(2024, 0, 1) + (wk + 1) * 7 * 86400000;
    return Object.assign({ type: 'pickup', desc: 'ピックアップ対象の★5・★4の排出率が上昇中！', endsAt: base }, p);
  };

  Gacha.banners = function (now) {
    var list = [Object.assign({}, D.BANNERS.standard)];
    var pu = Gacha.currentPickup(now);
    if (pu) list.push(pu);
    return list;
  };
  Gacha.banner = function (id, now) {
    return Gacha.banners(now).filter(function (b) { return b.id === id; })[0] || null;
  };

  // 排出率表：[{id, rarity, rate, pickup}]。合計は1。
  Gacha.rateTable = function (banner) {
    var out = [];
    [5, 4, 3].forEach(function (r) {
      var share = C.GACHA.RATES[r];
      var pool = D.HERO_LIST.filter(function (h) { return h.rarity === r; }).map(function (h) { return h.id; });
      var pu = banner && banner.type === 'pickup' ? (r === 5 ? banner.pickup : (r === 4 ? banner.pickup4 : null)) : null;
      pu = (pu || []).filter(function (id) { return pool.indexOf(id) >= 0; });
      if (pu.length && pu.length < pool.length) {
        var puShare = share * C.GACHA.PICKUP_SHARE, rest = pool.filter(function (id) { return pu.indexOf(id) < 0; });
        pu.forEach(function (id) { out.push({ id: id, rarity: r, rate: puShare / pu.length, pickup: true }); });
        rest.forEach(function (id) { out.push({ id: id, rarity: r, rate: (share - puShare) / rest.length, pickup: false }); });
      } else {
        pool.forEach(function (id) { out.push({ id: id, rarity: r, rate: share / pool.length, pickup: false }); });
      }
    });
    return out;
  };

  function drawFrom(table) {
    var idx = U.weightedIndex(table.map(function (e) { return e.rate; }));
    return table[idx];
  }

  // 1回分の抽選。pityCount は抽選前の天井カウント。
  Gacha.drawOne = function (banner, pityCount, guarantee4) {
    var table = Gacha.rateTable(banner), entry, byPity = false;
    if (pityCount + 1 >= C.GACHA.PITY) {
      // 天井：★5確定（ピックアップではピックアップ対象から）
      var five = table.filter(function (e) { return e.rarity === 5 && (banner.type !== 'pickup' || e.pickup); });
      if (!five.length) five = table.filter(function (e) { return e.rarity === 5; });
      entry = drawFrom(five.map(function (e) { return { id: e.id, rarity: 5, rate: 1 }; }));
      byPity = true;
    } else {
      entry = drawFrom(table);
      if (guarantee4 && entry.rarity < C.GACHA.TEN_GUARANTEE) {
        // ★4以上確定枠：★4以上の排出率の比率を保ったまま再抽選
        entry = drawFrom(table.filter(function (e) { return e.rarity >= C.GACHA.TEN_GUARANTEE; }));
      }
    }
    return { id: entry.id, rarity: entry.rarity, pity: byPity };
  };

  Gacha.cost = function (count) { return count >= 10 ? C.GACHA.COST_TEN : C.GACHA.COST_SINGLE * count; };

  Gacha.pull = function (state, bannerId, count, now) {
    var banner = Gacha.banner(bannerId, now);
    if (!banner) return { ok: false, msg: 'ガチャが見つかりません' };
    count = count >= 10 ? 10 : 1;
    var cost = Gacha.cost(count);
    if (state.currency.crystals < cost) return { ok: false, msg: '魂晶が足りません（必要: ' + cost + '）' };
    state.currency.crystals -= cost;
    var results = [];
    for (var i = 0; i < count; i++) {
      var pity = state.gacha.pity[banner.type] || 0;
      var guarantee = count === 10 && i === 9 && !results.some(function (r) { return r.rarity >= C.GACHA.TEN_GUARANTEE; });
      var r = Gacha.drawOne(banner, pity, guarantee);
      state.gacha.pity[banner.type] = r.rarity === 5 ? 0 : pity + 1;
      var add = AL.Heroes.add(state, r.id);
      r.isNew = add.isNew; r.lb = add.lb; r.shards = add.shards;
      results.push(r);
      state.gacha.history.unshift({ t: now || Date.now(), id: r.id, rarity: r.rarity, banner: banner.name, pity: r.pity });
    }
    if (state.gacha.history.length > C.GACHA.HISTORY_MAX) state.gacha.history.length = C.GACHA.HISTORY_MAX;
    state.gacha.total += count;
    state.stats.gachaPulls += count;
    AL.Events.emit('gacha', results);
    return { ok: true, results: results, banner: banner };
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>/* js/core/progress.js */
/* ABYSSAL LEGENDS - 進行管理（無限階層・ダンジョン・報酬・ドロップ）
 * Runner が戦闘エンジンを駆動し、ウェーブ・階層・ダンジョンの遷移と報酬付与を担当します。 */
(function (G) {
  'use strict';
  var AL = G.AL = G.AL || {};
  var C = AL.CONFIG, D = AL.DATA, U = AL.U;
  var Progress = AL.Progress = {};

  // ---- 階層情報 ----
  Progress.isBossFloor = function (f) { return f % C.TOWER.BOSS_INTERVAL === 0; };
  Progress.biome = function (f) {
    var i = Math.floor((Math.max(1, f) - 1) / C.TOWER.BIOME_LENGTH) % D.BIOMES.length;
    return D.BIOMES[i];
  };
  Progress.cycle = function (f) { return Math.floor((Math.max(1, f) - 1) / (C.TOWER.BIOME_LENGTH * D.BIOMES.length)); };
  Progress.bossFor = function (f) {
    var k = Math.max(1, Math.floor(f / C.TOWER.BOSS_INTERVAL));
    return D.BOSS_ORDER[(k - 1) % D.BOSS_ORDER.length];
  };
  Progress.wavesFor = function (f) { return Progress.isBossFloor(f) ? 1 : C.TOWER.WAVES_PER_FLOOR; };
  Progress.nextBossIn = function (f) { return Progress.isBossFloor(f) ? 0 : C.TOWER.BOSS_INTERVAL - (f % C.TOWER.BOSS_INTERVAL); };

  // ---- 敵の生成 ----
  Progress.enemySpec = function (id, floor, opts) {
    opts = opts || {};
    var ed = D.ENEMIES[id] || D.BOSSES[id];
    if (!ed) return null;
    var E = AL.Scale.E(floor), b = C.ENEMY_BASE, m = ed.mult, bm = ed.isBoss ? C.BOSS_MULT : { hp: 1, atk: 1, def: 1, res: 1 };
    var am = { hp: 1, atk: 1, def: 1, res: 1, spd: 1 };
    (opts.affixes || []).forEach(function (a) { var af = D.AFFIXES[a]; if (af && af.mult) Object.keys(af.mult).forEach(function (k) { am[k] *= af.mult[k]; }); });
    var big = (opts.bigBoss ? 1.5 : 1);
    var cyc = Progress.cycle(floor);
    return {
      refId: id, name: (cyc > 0 && !ed.isBoss ? '深層の' : '') + ed.name, element: ed.element, ai: ed.ai, isBoss: !!ed.isBoss,
      stats: {
        hp: U.safe(b.hp * E * m.hp * bm.hp * am.hp * big), atk: U.safe(b.atk * E * m.atk * bm.atk * am.atk * (opts.bigBoss ? 1.15 : 1)),
        def: U.safe(b.def * E * m.def * bm.def * am.def), res: U.safe(b.res * E * m.res * bm.res * am.res),
        spd: b.spd * m.spd * am.spd, crit: ed.isBoss ? 0.1 : 0.05, critDmg: 0.5
      },
      skill: ed.skill, basic: { name: '攻撃', type: (ed.ai === 'caster' ? 'mag' : 'phys'), p: 1, ranged: ed.ai === 'caster' },
      abilities: ed.abilities || [], sprite: { kind: 'enemy', id: id, shape: ed.shape, pal: ed.pal, boss: !!ed.isBoss, crown: ed.crown, wings: ed.wings, twin: ed.twin, big: ed.big }
    };
  };

  Progress.makeWave = function (floor, opts) {
    opts = opts || {};
    if (opts.boss || (opts.tower && Progress.isBossFloor(floor))) {
      var bid = opts.bossId || Progress.bossFor(floor);
      return [Progress.enemySpec(bid, floor, { affixes: opts.affixes, bigBoss: floor % C.TOWER.BIOME_LENGTH === 0 && opts.tower })];
    }
    var biome = Progress.biome(floor);
    var n = floor < 4 ? U.randInt(1, 2) : (floor < 15 ? U.randInt(2, 3) : U.randInt(2, C.BATTLE.MAX_ENEMIES - (U.chance(0.6) ? 1 : 0)));
    var out = [];
    for (var i = 0; i < n; i++) out.push(Progress.enemySpec(U.pick(biome.pool), floor, { affixes: opts.affixes }));
    return out;
  };

  // ---- 味方の生成 ----
  Progress.heroSpecs = function (state) {
    var syn = AL.Stats.synergies(state.party);
    var out = [];
    state.party.forEach(function (id, slot) {
      if (!id || !state.heroes[id]) return;
      var hd = D.HEROES[id];
      var st = AL.Stats.hero(state, id, { synergy: AL.Stats.synergyBonusFor(id, syn) });
      out.push({ refId: id, name: hd.name, element: hd.element, role: hd.role, stats: st, skill: hd.skill, basic: hd.basic,
        passives: st.passives, slot: slot, sprite: { kind: 'hero', id: id } });
    });
    return out;
  };

  // ---- 報酬 ----
  Progress.killReward = function (state, unit, floor) {
    var eff = AL.Stats.rebirthEff(state), R = AL.Scale.reward(floor), cr = C.REWARD;
    var mult = unit.isBoss ? cr.BOSS_MULT : 1;
    var r = {
      gold: U.safe(cr.GOLD * R * mult * (1 + eff.goldMul)),
      exp: U.safe(cr.EXP * R * mult * (1 + eff.expMul)),
      crystals: 0, stones: 0
    };
    if (unit.isBoss) {
      r.crystals = Math.floor(Math.min(cr.CRYSTAL_BOSS_MAX, cr.CRYSTAL_BOSS + cr.CRYSTAL_BOSS_PER10 * Math.floor(floor / 10)) * (1 + eff.crystalMul));
      r.stones = 3 + Math.floor(floor / 20);
    } else if (U.chance(cr.STONE_CHANCE)) r.stones = 1;
    return r;
  };

  Progress.applyReward = function (state, r, session) {
    state.currency.gold = U.safe(state.currency.gold + r.gold);
    state.currency.exp = U.safe(state.currency.exp + r.exp);
    state.currency.crystals = U.safe(state.currency.crystals + (r.crystals || 0));
    state.currency.stones = U.safe(state.currency.stones + (r.stones || 0));
    state.stats.goldEarned = U.safe(state.stats.goldEarned + r.gold);
    state.stats.expEarned = U.safe(state.stats.expEarned + r.exp);
    if (session) {
      session.gold = U.safe(session.gold + r.gold); session.exp = U.safe(session.exp + r.exp);
      session.crystals += r.crystals || 0; session.stones += r.stones || 0;
    }
  };

  // 装備ドロップ
  Progress.rollDrops = function (state, unit, floor, opts) {
    opts = opts || {};
    var eff = AL.Stats.rebirthEff(state), out = [];
    var dropMul = 1 + eff.dropMul;
    var rb = state.rebirth.count * 0.05;
    if (unit.isBoss) {
      out.push(AL.Inv.generate({ ilvl: floor, minRarity: 2, rarityBonus: rb, setSource: opts.setSource || 'tower' }));
      if (U.chance(C.REWARD.BOSS_EXTRA_DROP * dropMul)) out.push(AL.Inv.generate({ ilvl: floor, minRarity: 1, rarityBonus: rb, setSource: opts.setSource || 'tower' }));
    } else if (U.chance(C.REWARD.DROP_CHANCE * dropMul)) {
      out.push(AL.Inv.generate({ ilvl: floor, rarityBonus: rb, setSource: opts.setSource || 'tower' }));
    }
    return out;
  };

  // ================= Runner =================
  function Runner(state) {
    this.state = state;
    this.mode = 'tower';      // tower | dungeon | tutorial（導入の専用戦闘）
    this.run = null;          // ダンジョン挑戦中の情報
    this.acc = 0;
    this.transition = 0;      // ウェーブ間の移動時間（ゲーム内秒）
    this.gameTime = 0;
    this.session = Runner.newSession();
    this.killLog = [];        // 撃破のゲーム内時刻（放置効率の計測）
    this.lastResult = null;
    this.retryTimer = 0;
    var self = this;
    this.battle = new AL.Battle({
      spawnFactory: function (eid) { return Progress.enemySpec(eid, self.currentFloor(), { affixes: self.run && self.run.affixes }); },
      onDeath: function (u) { self.onDeath(u); }
    });
    this.battle.logEnabled = state.settings.showLog !== false;
  }
  Runner.newSession = function () { return { kills: 0, gold: 0, exp: 0, crystals: 0, stones: 0, items: 0, sold: 0, bosses: 0, started: Date.now() }; };
  AL.Runner = Runner;
  var RP = Runner.prototype;

  RP.currentFloor = function () {
    if (this.mode === 'dungeon' && this.run) return this.run.floor;
    if (this.mode === 'tutorial') return 1;
    return this.state.tower.floor;
  };

  RP.rebuildAllies = function (keepHp) {
    this.battle.setAllies(Progress.heroSpecs(this.state), keepHp);
  };

  RP.start = function () {
    this.rebuildAllies(false);
    this.startTowerWave();
  };

  RP.startTowerWave = function () {
    var t = this.state.tower;
    if (t.wave >= Progress.wavesFor(t.floor)) t.wave = 0;
    var boss = Progress.isBossFloor(t.floor);
    this.battle.startWave(Progress.makeWave(t.floor, { tower: true }), { timeLimit: boss ? C.BATTLE.BOSS_TIME_LIMIT : 0 });
    this.registerSeen();
    if (boss) this.battle.addLog('第' + t.floor + '層　ボス「' + this.battle.enemies[0].name + '」が現れた！', 'boss');
    AL.Events.emit('wave', { floor: t.floor, wave: t.wave, boss: boss });
  };

  RP.registerSeen = function () {
    var cx = this.state.codex.enemies;
    this.battle.enemies.forEach(function (e) { if (!cx[e.refId]) cx[e.refId] = { kills: 0 }; });
  };

  RP.onDeath = function (u) {
    if (u.side !== 'enemy') return;
    var st = this.state, floor = this.currentFloor();
    st.stats.kills++;
    if (u.isBoss) st.stats.bossKills++;
    var cx = st.codex.enemies[u.refId] || (st.codex.enemies[u.refId] = { kills: 0 });
    cx.kills++;
    this.session.kills++;
    if (u.isBoss) this.session.bosses++;
    if (this.mode === 'tower') this.killLog.push(this.gameTime);
    var r = Progress.killReward(st, u, floor);
    if (this.mode === 'dungeon' && this.run && this.run.type === 'bossrush') r.crystals = 0; // ボスラッシュは終了時にまとめて付与
    Progress.applyReward(st, r, this.session);
    if (this.run) { this.run.gold += r.gold; this.run.exp += r.exp; }
    if (this.mode === 'tower') {
      var drops = Progress.rollDrops(st, u, floor);
      var self = this;
      drops.forEach(function (it) { self.gainItem(it); });
    }
    AL.Events.emit('kill', { unit: u, reward: r });
  };

  RP.gainItem = function (it, noAuto) {
    var res = AL.Inv.add(this.state, it, { noAutoSell: noAuto });
    if (res.kept) {
      this.session.items++;
      if (this.state.settings.autoEquipDrops) {
        var self = this;
        this.state.party.forEach(function (id) { if (id) AL.Inv.autoEquip(self.state, id); });
      }
    } else this.session.sold++;
    AL.Events.emit('drop', { item: it, kept: res.kept, gold: res.gold, reason: res.reason });
    return res;
  };

  // ---- 時間を進める（dt はゲーム内秒：速度倍率適用済み） ----
  RP.update = function (dt) {
    this.acc += dt;
    var tick = C.BATTLE.TICK, steps = 0;
    while (this.acc >= tick && steps < 20000) {
      this.acc -= tick; steps++;
      this.gameTime += tick;
      this.stepOnce(tick);
    }
  };

  RP.stepOnce = function (tick) {
    if (this.transition > 0) {
      this.transition -= tick;
      if (this.transition <= 0) this.nextWave();
      return;
    }
    var b = this.battle;
    if (b.status === 'fight') b.step(tick);
    if (b.status === 'cleared') this.onCleared();
    else if (b.status === 'wiped' || b.status === 'timeout') this.onFailed(b.status);
  };

  RP.onCleared = function () {
    this.battle.status = 'idle';
    if (this.mode === 'dungeon') { this.dungeonWaveCleared(); return; }
    if (this.mode === 'tutorial') { this.finishTutorial(); return; }
    var t = this.state.tower, st = this.state;
    t.wave++;
    var floorDone = t.wave >= Progress.wavesFor(t.floor);
    if (floorDone) {
      t.wave = 0;
      var cleared = t.floor;
      if (t.blockedFloor && cleared >= t.blockedFloor) t.blockedFloor = 0;
      var next = cleared + 1;
      if (next > t.maxFloor) t.maxFloor = next;
      if (next > st.stats.maxFloorEver) st.stats.maxFloorEver = next;
      if (t.blockedFloor && !st.settings.autoBoss) {
        // 自動再挑戦がオフ：手前の階層を周回
      } else if (t.autoAdvance || t.blockedFloor) {
        t.floor = t.blockedFloor ? t.blockedFloor : next;
      }
      this.battle.healAllies(true);
      this.battle.addLog('第' + cleared + '層を突破！', 'floor');
      AL.Events.emit('floor', { cleared: cleared, floor: t.floor });
    } else {
      // ウェーブ間で少し回復
      this.battle.allies.forEach(function (u) { if (u.alive) u.hp = Math.min(u.maxHp, u.hp + u.maxHp * 0.1); });
    }
    this.transition = C.BATTLE.WAVE_TRANSITION;
    AL.Events.emit('waveClear', { floorDone: floorDone });
  };

  RP.nextWave = function () {
    this.transition = 0;
    if (this.mode === 'dungeon') this.startDungeonWave();
    else if (this.mode === 'tutorial') this.startTutorialWave();
    else this.startTowerWave();
  };

  RP.onFailed = function (why) {
    this.battle.status = 'idle';
    if (this.mode === 'dungeon') { this.finishDungeon(false, why); return; }
    if (this.mode === 'tutorial') {
      // 導入の戦闘は、負けても回復してやり直す
      this.battle.healAllies(true);
      this.battle.addLog('態勢を立て直して、もう一度挑みます', 'down');
      this.transition = C.BATTLE.WAVE_TRANSITION;
      return;
    }
    var t = this.state.tower;
    var failed = t.floor;
    t.blockedFloor = failed;
    t.floor = Math.max(1, failed - 1);
    t.wave = 0;
    this.battle.healAllies(true);
    this.battle.addLog('第' + failed + '層で敗北…第' + t.floor + '層で態勢を立て直します', 'down');
    AL.Events.emit('defeat', { floor: failed, why: why });
    this.transition = C.BATTLE.WAVE_TRANSITION * 1.5;
  };

  // 手動でボス・停滞階層に挑戦
  RP.challenge = function () {
    var t = this.state.tower;
    if (this.mode !== 'tower') return false;
    var target = t.blockedFloor || Math.min(t.maxFloor, t.floor + 1);
    t.floor = target; t.wave = 0;
    this.battle.healAllies(true);
    this.battle.status = 'idle';
    this.transition = 0.3;
    return true;
  };
  RP.setAutoAdvance = function (on) {
    this.state.tower.autoAdvance = !!on;
  };
  RP.gotoFloor = function (f) {
    if (this.mode === 'tutorial') return;
    var t = this.state.tower;
    f = U.clamp(Math.floor(f), 1, t.maxFloor);
    t.floor = f; t.wave = 0;
    this.battle.healAllies(true);
    this.battle.status = 'idle';
    this.transition = 0.3;
  };

  // 放置効率（ゲーム内1分あたりの撃破数）を直近の実績から更新
  RP.measureKpm = function () {
    var now = this.gameTime, win = 180;
    this.killLog = this.killLog.filter(function (t) { return now - t <= win; });
    if (now < 60 || this.killLog.length < 5) return null;
    var span = Math.min(win, now);
    var kpm = this.killLog.length / span * 60;
    var cur = this.state.idle.kpm;
    this.state.idle.kpm = U.clamp(cur * 0.7 + kpm * 0.3, 0.5, 600);
    return this.state.idle.kpm;
  };

  // ================= ダンジョン =================
  Progress.dungeon = function (id) { return D.DUNGEONS.filter(function (d) { return d.id === id; })[0] || null; };
  Progress.dungeonUnlocked = function (state, d) {
    if (!d.unlock) return true;
    if (d.unlock.maxFloor && state.stats.maxFloorEver < d.unlock.maxFloor) return false;
    if (d.unlock.rebirths && state.rebirth.count < d.unlock.rebirths) return false;
    return true;
  };
  Progress.unlockText = function (d) {
    if (!d.unlock) return '';
    var t = [];
    if (d.unlock.maxFloor) t.push('第' + d.unlock.maxFloor + '層到達');
    if (d.unlock.rebirths) t.push('転生' + d.unlock.rebirths + '回');
    return t.join('・');
  };
  Progress.trialAffixes = function (tier) {
    var keys = Object.keys(D.AFFIXES), n = Math.min(3, 1 + Math.floor((tier - 1) / 2)), out = [];
    for (var i = 0; i < n; i++) out.push(keys[(tier * 3 + i * 2) % keys.length]);
    return out.filter(function (k, i) { return out.indexOf(k) === i; });
  };

  // ---- 導入の専用戦闘（新規プレイヤーの最初の戦い） ----
  // 報酬は Guide.battleReward で一度だけ付与する。終わると無限の深淵塔に戻る。
  Progress.tutorialEnemies = function () {
    // 戦闘画面を見る時間があるよう、HP を通常の第1層の敵の4倍にしている（攻撃力などはそのまま）
    return [['e_slime', '訓練場の腐肉スライム'], ['e_rat', '訓練場の屍喰いネズミ'], ['e_slime', '訓練場の腐肉スライム']].map(function (e) {
      var sp = Progress.enemySpec(e[0], 1);
      sp.stats.hp = U.safe(sp.stats.hp * 4);
      sp.name = e[1];
      return sp;
    });
  };
  RP.startTutorial = function () {
    if (this.mode === 'dungeon') return false;
    this.mode = 'tutorial';
    this.run = null;
    this.transition = 0;
    this.battle.healAllies(true);
    this.startTutorialWave();
    return true;
  };
  RP.startTutorialWave = function () {
    this.battle.startWave(Progress.tutorialEnemies(), { timeLimit: 0 });
    this.registerSeen();
    this.battle.addLog('【はじめての戦い】訓練場の魔物が現れた！', 'floor');
    AL.Events.emit('wave', { floor: 1, wave: 0, boss: false, tutorial: true });
  };
  RP.finishTutorial = function () {
    var r = AL.Guide.battleReward(this.state);
    this.mode = 'tower';
    this.battle.healAllies(true);
    this.battle.addLog('【はじめての戦い】勝利！ 無限の深淵塔へ向かいます', 'floor');
    this.transition = C.BATTLE.WAVE_TRANSITION;
    AL.Events.emit('tutorialEnd', r);
    return r;
  };

  RP.startDungeon = function (id, tier) {
    var st = this.state, d = Progress.dungeon(id);
    if (!d || d.type === 'tower') return { ok: false, msg: '挑戦できません' };
    if (this.mode === 'dungeon') return { ok: false, msg: '他のダンジョンに挑戦中です' };
    if (this.mode === 'tutorial') return { ok: false, msg: 'はじめての戦いを終えると挑戦できます' };
    if (!Progress.dungeonUnlocked(st, d)) return { ok: false, msg: '解放条件：' + Progress.unlockText(d) };
    var rec = st.dungeons[id];
    tier = Math.max(1, Math.floor(tier || 1));
    if (d.type !== 'bossrush' && tier > rec.maxTier + 1) return { ok: false, msg: '難易度' + (rec.maxTier + 1) + 'までしか選べません' };
    AL.Dungeon.regenTickets(st);
    if (st.currency.tickets < d.ticket) return { ok: false, msg: '挑戦券が足りません' };
    st.currency.tickets -= d.ticket;
    rec.lastTier = tier;
    var floor = d.type === 'bossrush' ? 10 : Math.floor(d.tierFloor(tier));
    this.run = { id: id, type: d.type, tier: tier, floor: floor, wave: 0, totalWaves: d.waves || 0, boss: !!d.boss,
      affixes: d.type === 'trial' ? Progress.trialAffixes(tier) : [], bossCount: 0, startTime: this.gameTime, gold: 0, exp: 0 };
    st.runInProgress = id;
    this.mode = 'dungeon';
    this.transition = 0;
    this.battle.status = 'idle';
    this.battle.healAllies(true);
    this.battle.addLog('【' + d.name + '】難易度' + tier + 'に挑戦開始', 'floor');
    this.startDungeonWave();
    AL.Events.emit('dungeonStart', this.run);
    return { ok: true };
  };

  RP.startDungeonWave = function () {
    var r = this.run, opts = {};
    if (!r) { this.mode = 'tower'; this.startTowerWave(); return; }
    var aff = { affixes: r.affixes };
    if (r.affixes.indexOf('cursed') >= 0) opts.startDebuff = D.AFFIXES.cursed.startDebuff;
    var wave;
    if (r.type === 'bossrush') {
      r.floor = 10 * (r.bossCount + 1);
      wave = Progress.makeWave(r.floor, { boss: true, bossId: D.BOSS_ORDER[r.bossCount % D.BOSS_ORDER.length] });
      opts.timeLimit = 60;
    } else if (r.boss && r.wave >= r.totalWaves) {
      wave = Progress.makeWave(r.floor, Object.assign({ boss: true, bossId: D.BOSS_ORDER[(r.tier - 1) % D.BOSS_ORDER.length] }, aff));
      opts.timeLimit = C.BATTLE.BOSS_TIME_LIMIT;
    } else {
      wave = Progress.makeWave(r.floor, aff);
    }
    this.battle.startWave(wave, opts);
    this.registerSeen();
    AL.Events.emit('wave', { dungeon: r.id, wave: r.wave });
  };

  RP.dungeonWaveCleared = function () {
    var r = this.run;
    if (r.type === 'bossrush') {
      r.bossCount++;
      this.battle.allies.forEach(function (u) { if (u.alive) u.hp = Math.min(u.maxHp, u.hp + u.maxHp * 0.3); });
      this.transition = C.BATTLE.WAVE_TRANSITION;
      return;
    }
    r.wave++;
    var total = r.totalWaves + (r.boss ? 1 : 0);
    if (r.wave >= total) { this.finishDungeon(true); return; }
    this.battle.allies.forEach(function (u) { if (u.alive) u.hp = Math.min(u.maxHp, u.hp + u.maxHp * 0.15); });
    this.transition = C.BATTLE.WAVE_TRANSITION;
  };

  RP.finishDungeon = function (win, why) {
    var st = this.state, r = this.run, d = Progress.dungeon(r.id), rec = st.dungeons[r.id], self = this;
    var res = { id: r.id, name: d.name, tier: r.tier, win: win, why: why || null, time: this.gameTime - r.startTime, items: [], crystals: 0, stones: 0, gold: r.gold, exp: r.exp, firstClear: false, record: false };
    var eff = AL.Stats.rebirthEff(st);
    if (r.type === 'bossrush') {
      res.win = r.bossCount > 0;
      res.bossCount = r.bossCount;
      var cr = 0; for (var i = 1; i <= r.bossCount; i++) cr += 5 + i * 2;
      res.crystals = Math.floor(cr * (1 + eff.crystalMul));
      if (r.bossCount > rec.bestCount) { rec.bestCount = r.bossCount; res.record = true; }
      st.stats.rushBest = Math.max(st.stats.rushBest, r.bossCount);
      if (r.bossCount > 0) rec.clears++;
    } else if (win) {
      rec.clears++;
      if (r.tier > rec.maxTier) { rec.maxTier = r.tier; res.firstClear = true; }
      if (!rec.bestTime || res.time < rec.bestTime) { if (rec.bestTime) res.record = true; rec.bestTime = res.time; }
      if (r.type === 'material') {
        res.stones = 8 + 5 * r.tier;
        var g = U.safe(40 * AL.Scale.reward(r.floor) * (1 + eff.goldMul));
        res.gold += g; Progress.applyReward(st, { gold: g, exp: 0 }, this.session);
      } else if (r.type === 'gear' || r.type === 'trial') {
        for (var k = 0; k < d.drops; k++) {
          var it = AL.Inv.generate({ ilvl: r.floor, minRarity: d.minRarity, setSource: d.setSource, forceSet: r.type === 'gear' || U.chance(0.6),
            rarityBonus: r.type === 'trial' ? 1.5 + r.tier * 0.1 : 0.5 });
          res.items.push(it);
          this.gainItem(it, true);
        }
        if (r.type === 'trial' && res.firstClear) res.crystals = Math.floor(80 * r.tier * (1 + eff.crystalMul));
        else if (r.type === 'trial') res.crystals = Math.floor(10 * r.tier * (1 + eff.crystalMul));
      }
    }
    st.currency.crystals = U.safe(st.currency.crystals + res.crystals);
    st.currency.stones += res.stones;
    if (res.win) st.stats.dungeonClears++;
    this.lastResult = res;
    this.run = null;
    this.mode = 'tower';
    st.runInProgress = null;
    this.battle.healAllies(true);
    this.battle.status = 'idle';
    this.battle.addLog('【' + d.name + '】' + (res.win ? '攻略成功！' : '撤退…'), res.win ? 'floor' : 'down');
    this.transition = C.BATTLE.WAVE_TRANSITION;
    AL.Events.emit('dungeonEnd', res);
    void self;
    return res;
  };

  RP.abandonDungeon = function () {
    if (this.mode !== 'dungeon' || !this.run) return null;
    return this.finishDungeon(false, 'abandon');
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>/* js/core/guide.js */
/* ABYSSAL LEGENDS - はじめての冒険（新規プレイヤー向けの導入と、機能の段階的な解放）
 * 進行状況は state.guide に保存する。初回の報酬（召喚・戦闘）は rewards のフラグで一度だけ付与する。
 * 既存のセーブ（guide 項目なし）は legacy として導入を終えた扱いになり、すべての機能が使える。 */
(function (G) {
  'use strict';
  var AL = G.AL = G.AL || {};
  var C = AL.CONFIG, D = AL.DATA, U = AL.U;
  var Guide = AL.Guide = {};
  var STEPS = C.GUIDE.STEPS;

  Guide.stepIndex = function (step) { return STEPS.indexOf(step); };
  Guide.reached = function (state, step) { return Guide.stepIndex(state.guide.step) >= Guide.stepIndex(step); };
  // まだ「NEW GAME」を押していない（タイトル画面で新規開始を選ぶ）状態
  Guide.isNewGame = function (state) { return !state.guide.legacy && state.guide.step === 'title'; };
  Guide.inTutorial = function (state) { return !state.guide.legacy && state.guide.step !== 'done'; };
  // 段階は先へ進むだけ（戻らない）
  Guide.setStep = function (state, step) {
    if (Guide.stepIndex(step) > Guide.stepIndex(state.guide.step)) { state.guide.step = step; AL.Events.emit('guide', { step: step }); return true; }
    return false;
  };

  // ---- 機能の解放 ----
  Guide.feature = function (id) { return C.GUIDE.FEATURES.filter(function (f) { return f.id === id; })[0] || null; };
  Guide.unlocked = function (state, id) {
    var f = Guide.feature(id);
    if (!f || state.guide.legacy) return true;                 // 解放条件のない機能・既存プレイヤーは常に使える
    if (!Guide.reached(state, f.step)) return false;
    if (f.floor && state.stats.maxFloorEver < f.floor && !(f.orRebirth && state.rebirth.count > 0)) return false;
    return true;
  };
  // 解放されたが、まだ案内していない機能
  Guide.pendingUnlocks = function (state) {
    return C.GUIDE.FEATURES.filter(function (f) { return !state.guide.seen[f.id] && Guide.unlocked(state, f.id); }).map(function (f) { return f.id; });
  };
  Guide.markSeen = function (state, ids) { ids.forEach(function (id) { if (Guide.feature(id)) state.guide.seen[id] = true; }); };

  // ---- 導入の各段階 ----
  Guide.begin = function (state) { return Guide.setStep(state, 'summon'); };

  // 初回召喚：結果は固定（C.GUIDE.FIRST_HERO）。魂晶は使わず、天井カウントも変えない。受け取り済みなら何もしない。
  Guide.firstSummon = function (state, now) {
    if (state.guide.rewards.summon) return { ok: false, already: true };
    if (!Guide.reached(state, 'summon')) return { ok: false, msg: 'まだ召喚できません' };
    var id = C.GUIDE.FIRST_HERO, hd = D.HEROES[id];
    var add = AL.Heroes.add(state, id);
    state.gacha.history.unshift({ t: now || Date.now(), id: id, rarity: hd.rarity, banner: 'はじめての召喚', pity: false });
    if (state.gacha.history.length > C.GACHA.HISTORY_MAX) state.gacha.history.length = C.GACHA.HISTORY_MAX;
    state.gacha.total += 1;
    state.stats.gachaPulls += 1;
    state.guide.rewards.summon = true;
    Guide.setStep(state, 'battle');
    return { ok: true, results: [{ id: id, rarity: hd.rarity, pity: false, isNew: add.isNew, lb: add.lb, shards: add.shards }] };
  };

  // 初回戦闘の報酬：受け取り済みなら何もしない
  Guide.battleReward = function (state) {
    if (state.guide.rewards.battle) return { ok: false, already: true };
    var R = C.GUIDE.BATTLE_REWARD;
    state.currency.gold = U.safe(state.currency.gold + R.gold);
    state.currency.exp = U.safe(state.currency.exp + R.exp);
    var it = AL.Inv.generate({ rarity: R.item.rarity, base: R.item.base, ilvl: R.item.ilvl });
    it.set = null;
    AL.Inv.add(state, it, { noAutoSell: true });
    state.guide.rewards.battle = true;
    Guide.setStep(state, 'heroes');
    return { ok: true, gold: R.gold, exp: R.exp, item: it };
  };

  // 画面を開いたときの進行（仲間画面を見たら、次は装備の案内へ）
  Guide.onScreen = function (state, id) {
    if (state.guide.step === 'heroes' && id === 'heroes') return Guide.setStep(state, 'equip');
    return false;
  };
  // プレイヤーの行動による進行（装備をつけた → 強化の案内へ、強化した → 導入完了）
  Guide.update = function (state) {
    var g = state.guide, changed = false;
    if (g.step === 'equip' && state.party.some(function (id) {
      var h = id && state.heroes[id];
      return h && D.SLOTS.some(function (sl) { return h.equip[sl]; });
    })) changed = Guide.setStep(state, 'enhance') || changed;
    if (g.step === 'enhance' && state.stats.enhances > 0) changed = Guide.setStep(state, 'done') || changed;
    return changed;
  };

  // 案内を終える（スキップ）：未受取の初回報酬は一度だけ受け取り、すべての段階を終えた扱いにする
  Guide.skip = function (state, now) {
    Guide.begin(state);
    var summon = state.guide.rewards.summon ? null : Guide.firstSummon(state, now);
    var battle = state.guide.rewards.battle ? null : Guide.battleReward(state);
    Guide.setStep(state, 'done');
    return { ok: true, summon: summon, battle: battle };
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>/* js/core/systems.js */
/* ABYSSAL LEGENDS - 各種システム：挑戦券・転生・放置報酬・実績・ショップ */
(function (G) {
  'use strict';
  var AL = G.AL = G.AL || {};
  var C = AL.CONFIG, D = AL.DATA, U = AL.U;

  // ================= 挑戦券 =================
  var Dungeon = AL.Dungeon = {};
  Dungeon.regenTickets = function (state, now) {
    now = now || Date.now();
    var period = C.TICKETS.REGEN_MIN * 60000;
    if (now < state.ticketRegenAt) { state.ticketRegenAt = now; return 0; } // 時計の巻き戻し：回復しない
    if (state.currency.tickets >= C.TICKETS.MAX) { state.ticketRegenAt = now; return 0; }
    var n = Math.floor((now - state.ticketRegenAt) / period);
    if (n <= 0) return 0;
    var add = Math.min(n, C.TICKETS.MAX - state.currency.tickets);
    state.currency.tickets += add;
    state.ticketRegenAt = state.currency.tickets >= C.TICKETS.MAX ? now : state.ticketRegenAt + n * period;
    return add;
  };
  Dungeon.nextTicketIn = function (state, now) {
    if (state.currency.tickets >= C.TICKETS.MAX) return 0;
    var period = C.TICKETS.REGEN_MIN * 60000;
    return Math.max(0, (state.ticketRegenAt + period - (now || Date.now())) / 1000);
  };

  // ================= 転生 =================
  var Rebirth = AL.Rebirth = {};
  Rebirth.pointsFor = function (maxFloor) {
    if (maxFloor < C.REBIRTH.MIN_FLOOR) return 0;
    return Math.floor(C.REBIRTH.POINT_BASE * Math.pow(maxFloor / C.REBIRTH.MIN_FLOOR, C.REBIRTH.POINT_EXP));
  };
  Rebirth.canRebirth = function (state) { return state.tower.maxFloor >= C.REBIRTH.MIN_FLOOR; };
  Rebirth.upgradeCost = function (u, lv) { return Math.ceil(u.base * Math.pow(u.growth, lv)); };
  Rebirth.startFloor = function (state) { return 1 + AL.Stats.rebirthEff(state).startFloor; };

  // リセット内容（UIでも同じ定義を表示）
  Rebirth.RESETS = ['現在の階層・最高到達階層（今回の周回）', 'ゴールド・経験値・強化石', '全仲間のレベル（Lv1に戻る）', 'ロックしていない装備（装備中でも消滅）'];
  Rebirth.KEEPS = ['仲間と限界突破・英雄の欠片', 'ロックした装備（強化値・装着状態も維持）', '魂晶・挑戦券', '転生ポイント・転生強化・転生回数',
    'ガチャ履歴・天井カウント', 'ダンジョン記録・実績・図鑑', '通算の最高到達階層・設定'];

  Rebirth.perform = function (state) {
    if (!Rebirth.canRebirth(state)) return { ok: false, msg: '第' + C.REBIRTH.MIN_FLOOR + '層に到達すると転生できます' };
    var pts = Rebirth.pointsFor(state.tower.maxFloor);
    var prevFloor = state.tower.maxFloor;
    state.stats.maxFloorEver = Math.max(state.stats.maxFloorEver, prevFloor);
    state.currency.rebirthPts += pts;
    state.rebirth.totalPts += pts;
    state.rebirth.count++;
    state.stats.rebirths = state.rebirth.count;
    // リセット
    var start = Rebirth.startFloor(state);
    state.tower = { floor: start, wave: 0, maxFloor: start, autoAdvance: true, blockedFloor: 0 };
    state.currency.gold = C.START.gold;
    state.currency.exp = 0;
    state.currency.stones = C.START.stones;
    var keep = {};
    state.items = state.items.filter(function (it) { if (it.locked) { keep[it.uid] = true; return true; } return false; });
    Object.keys(state.heroes).forEach(function (id) {
      var h = state.heroes[id];
      h.lv = 1;
      D.SLOTS.forEach(function (sl) { if (h.equip[sl] && !keep[h.equip[sl]]) h.equip[sl] = null; });
    });
    AL.Stats.invalidate();
    AL.Events.emit('rebirth', { pts: pts, count: state.rebirth.count });
    return { ok: true, pts: pts, prevFloor: prevFloor, start: start, kept: Object.keys(keep).length };
  };

  Rebirth.buy = function (state, id) {
    var u = D.REBIRTH_UPGRADES.filter(function (x) { return x.id === id; })[0];
    if (!u) return { ok: false, msg: '不明な強化です' };
    var lv = state.rebirth.upgrades[id] || 0;
    if (u.max && lv >= u.max) return { ok: false, msg: '最大レベルです' };
    var cost = Rebirth.upgradeCost(u, lv);
    if (state.currency.rebirthPts < cost) return { ok: false, msg: '転生ポイントが足りません' };
    state.currency.rebirthPts -= cost;
    state.rebirth.upgrades[id] = lv + 1;
    AL.Events.emit('loadout');
    return { ok: true, lv: lv + 1 };
  };

  // ================= 放置報酬 =================
  var Idle = AL.Idle = {};
  Idle.maxSeconds = function (state) {
    var eff = AL.Stats.rebirthEff(state);
    return (C.IDLE.BASE_MAX_HOURS + eff.idleHours) * 3600;
  };
  Idle.efficiency = function (state) { return C.IDLE.EFFICIENCY + AL.Stats.rebirthEff(state).idleEff; };

  // 経過時間：最後に確認した最大時刻(maxSeen)以降のみを数える。時計を戻した場合は0。
  Idle.elapsed = function (state, now) {
    var ref = Math.max(state.lastSeen || 0, state.maxSeen || 0);
    var sec = (now - ref) / 1000;
    if (!isFinite(sec) || sec < 0) return { sec: 0, clockBack: sec < -300 };
    return { sec: sec, clockBack: false };
  };

  Idle.compute = function (state, sec) {
    var capSec = Idle.maxSeconds(state);
    var used = Math.min(sec, capSec);
    var floor = state.tower.floor;
    var eff = Idle.efficiency(state);
    var kills = state.idle.kpm * (used / 60) * eff;
    var avg = AL.Progress.killReward(state, { isBoss: false }, floor);
    var reb = AL.Stats.rebirthEff(state);
    var items = Math.min(C.IDLE.MAX_ITEMS, Math.floor(kills * C.REWARD.DROP_CHANCE * (1 + reb.dropMul) * 0.5));
    return {
      sec: sec, used: used, capped: sec > capSec, floor: floor, kills: Math.floor(kills), eff: eff,
      gold: U.safe(avg.gold * kills), exp: U.safe(avg.exp * kills),
      stones: Math.floor(kills * C.REWARD.STONE_CHANCE * 0.5),
      crystals: Math.floor(used / 600 * (1 + reb.crystalMul)),
      items: items
    };
  };

  Idle.claim = function (state, res, runner) {
    state.currency.gold = U.safe(state.currency.gold + res.gold);
    state.currency.exp = U.safe(state.currency.exp + res.exp);
    state.currency.stones += res.stones;
    state.currency.crystals += res.crystals;
    state.stats.goldEarned = U.safe(state.stats.goldEarned + res.gold);
    var kept = 0, sold = 0, best = -1;
    for (var i = 0; i < res.items; i++) {
      var it = AL.Inv.generate({ ilvl: res.floor, rarityBonus: state.rebirth.count * 0.05 });
      var r = runner ? runner.gainItem(it) : AL.Inv.add(state, it);
      if (r.kept) kept++; else sold++;
      best = Math.max(best, it.rarity);
    }
    state.stats.idleClaims++;
    state.idle.lastClaimTs = Date.now();
    var summary = Object.assign({}, res, { kept: kept, sold: sold, best: best });
    state.idle.lastResult = { t: Date.now(), sec: res.used, gold: res.gold, exp: res.exp, items: res.items };
    AL.Events.emit('idleClaim', summary);
    return summary;
  };

  // ================= 実績 =================
  var Ach = AL.Achievements = {};
  Ach.value = function (state, stat) {
    if (stat === 'heroesOwned') return Object.keys(state.heroes).length;
    if (stat === 'fullSets') {
      var n = 0;
      Object.keys(state.heroes).forEach(function (id) {
        AL.Stats.setInfo(state, id).forEach(function (s) { if (s.count >= 6) n++; });
      });
      state.stats.fullSets = Math.max(state.stats.fullSets, n);
      return state.stats.fullSets;
    }
    if (stat === 'maxLB') {
      var m = 0; Object.keys(state.heroes).forEach(function (id) { m = Math.max(m, state.heroes[id].lb); });
      return m;
    }
    return state.stats[stat] || 0;
  };
  Ach.status = function (state, a) {
    var v = Ach.value(state, a.stat);
    return { value: v, done: v >= a.target, claimed: !!state.achievements.claimed[a.id] };
  };
  Ach.claimable = function (state) {
    return D.ACHIEVEMENTS.filter(function (a) { var s = Ach.status(state, a); return s.done && !s.claimed; });
  };
  Ach.claim = function (state, id) {
    var a = D.ACHIEVEMENTS.filter(function (x) { return x.id === id; })[0];
    if (!a) return { ok: false, msg: '不明な実績' };
    var s = Ach.status(state, a);
    if (!s.done) return { ok: false, msg: '未達成です' };
    if (s.claimed) return { ok: false, msg: '受取済みです' };
    state.achievements.claimed[id] = true;
    if (a.reward.crystals) state.currency.crystals = U.safe(state.currency.crystals + a.reward.crystals);
    if (a.reward.stones) state.currency.stones = U.safe(state.currency.stones + a.reward.stones);
    if (a.reward.gold) state.currency.gold = U.safe(state.currency.gold + a.reward.gold);
    return { ok: true, reward: a.reward };
  };

  // ---- 実績画面：実績（achievements.claimed）と実績クエスト（quests.ach.claimed）を1つの画面に並べる ----
  // 受取記録は別々のまま。受け取りはそれぞれの既存の処理（Ach.claim・Quests.claim）に任せるため、二重に受け取る経路はない。
  // 分類は記録の種類（stat）で決める。
  Ach.CATEGORIES = [
    { id: 'main', name: 'メイン実績', stats: ['maxFloorEver', 'bossKills', 'rebirths', 'dungeonClears', 'rushBest'] },
    { id: 'grow', name: '育成実績', stats: ['maxHeroLv', 'maxEnh', 'enhances', 'maxLB', 'fullSets', 'heroesOwned', 'mythicFound'] },
    { id: 'total', name: '累計実績', stats: ['kills', 'gachaPulls', 'idleClaims'] }
  ];
  Ach.categoryOf = function (stat) {
    for (var i = 0; i < Ach.CATEGORIES.length; i++) if (Ach.CATEGORIES[i].stats.indexOf(stat) >= 0) return Ach.CATEGORIES[i].id;
    return 'total';
  };
  // 表示する全項目（分類ごとに、記録の種類 → 目標値の順）。src: 'ach'＝実績／'quest'＝実績クエスト
  var entryCache = null;
  Ach.entries = function () {
    if (entryCache) return entryCache;
    var out = [];
    D.ACHIEVEMENTS.forEach(function (a) { out.push({ src: 'ach', id: a.id, name: a.name, desc: a.desc, stat: a.stat, target: a.target, reward: a.reward, def: a }); });
    D.QUESTS.ach.forEach(function (q) { out.push({ src: 'quest', id: q.id, name: q.name, desc: '', stat: q.stat, target: q.target, reward: q.reward, def: q }); });
    var rank = function (e) {
      var ci = 0, si = 0;
      Ach.CATEGORIES.forEach(function (c, i) { var k = c.stats.indexOf(e.stat); if (k >= 0) { ci = i; si = k; } });
      return [ci, si, e.target];
    };
    out.forEach(function (e, i) { e.cat = Ach.categoryOf(e.stat); e.key = e.src + ':' + e.id; e.order = i; });
    entryCache = out.sort(function (a, b) {
      var x = rank(a), y = rank(b);
      return x[0] - y[0] || x[1] - y[1] || x[2] - y[2] || a.order - b.order;
    });
    return entryCache;
  };
  // {value, target, done, claimed}（どちらも同じ記録 Ach.value から進捗を取る）
  Ach.entryStatus = function (state, e) {
    if (e.src === 'quest') { var s = AL.Quests.status(state, 'ach', e.def); return { value: s.value, target: s.target, done: s.done, claimed: s.claimed }; }
    var a = Ach.status(state, e.def);
    return { value: a.value, target: e.target, done: a.done, claimed: a.claimed };
  };
  Ach.claimEntry = function (state, src, id, now) {
    return src === 'quest' ? AL.Quests.claim(state, 'ach', id, now) : Ach.claim(state, id);
  };
  // 受け取れる項目（cat を指定するとその分類だけ）
  Ach.claimableEntries = function (state, cat) {
    return Ach.entries().filter(function (e) {
      if (cat && e.cat !== cat) return false;
      var s = Ach.entryStatus(state, e);
      return s.done && !s.claimed;
    });
  };

  // ================= ショップ =================
  var Shop = AL.Shop = {};
  Shop.refreshDay = function (state, now) {
    var k = U.dateKey(now);
    if (state.shop.day !== k) { state.shop.day = k; state.shop.bought = {}; }
  };
  Shop.price = function (state, item) {
    var out = {};
    if (item.cost.gold) out.gold = U.safe(Math.floor(item.cost.gold * AL.Scale.reward(state.tower.maxFloor)));
    if (item.cost.shards) out.shards = item.cost.shards;
    return out;
  };
  Shop.remaining = function (state, item) {
    if (!item.limit) return Infinity;
    return Math.max(0, item.limit - (state.shop.bought[item.id] || 0));
  };
  Shop.buy = function (state, id, now) {
    Shop.refreshDay(state, now);
    var item = D.SHOP.filter(function (x) { return x.id === id; })[0];
    if (!item) return { ok: false, msg: '商品が見つかりません' };
    if (Shop.remaining(state, item) <= 0) return { ok: false, msg: '本日の購入上限です' };
    var p = Shop.price(state, item);
    if (p.gold && state.currency.gold < p.gold) return { ok: false, msg: 'ゴールドが足りません' };
    if (p.shards && state.currency.shards < p.shards) return { ok: false, msg: '英雄の欠片が足りません' };
    var g = item.give, msg = '';
    if (g.randomHero) {
      var cand = D.HERO_LIST.filter(function (h) { return h.rarity === g.randomHero && !state.heroes[h.id]; });
      if (!cand.length) return { ok: false, msg: '★' + g.randomHero + 'の仲間はすべて所持しています' };
    }
    if (p.gold) state.currency.gold -= p.gold;
    if (p.shards) state.currency.shards -= p.shards;
    if (g.stones) { state.currency.stones += g.stones; msg = '強化石を' + g.stones + '個獲得'; }
    if (g.tickets) { state.currency.tickets += g.tickets; msg = '挑戦券を' + g.tickets + '枚獲得'; }
    if (g.crystals) { state.currency.crystals += g.crystals; msg = '魂晶を' + g.crystals + '個獲得'; }
    if (g.expKills) {
      var e = AL.Progress.killReward(state, { isBoss: false }, state.tower.floor).exp * g.expKills;
      state.currency.exp = U.safe(state.currency.exp + e); msg = '経験値を' + U.fmt(e) + '獲得';
    }
    if (g.randomHero) {
      var h = U.pick(D.HERO_LIST.filter(function (x) { return x.rarity === g.randomHero && !state.heroes[x.id]; }));
      AL.Heroes.add(state, h.id); msg = h.name + 'が仲間になった！';
    }
    if (item.limit) state.shop.bought[item.id] = (state.shop.bought[item.id] || 0) + 1;
    return { ok: true, msg: msg };
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>/* js/core/quests.js */
/* ABYSSAL LEGENDS - クエスト（メイン・デイリー・実績クエスト）
 * 進捗は既存の記録（state.stats など）から計算し、保存するのは受け取り済みの ID とデイリーの開始時点の記録だけ。
 * 報酬の付与と受け取り済みの記録は同じ処理で行うため、再読み込みしても二重に受け取れない。 */
(function (G) {
  'use strict';
  var AL = G.AL = G.AL || {};
  var C = AL.CONFIG, D = AL.DATA, U = AL.U;
  var Quests = AL.Quests = {};

  // 日付の前後比較用（U.dateKey は「年-月-日」でゼロ埋めがないため数値にする）
  function dayNum(key) {
    var m = /^(\d+)-(\d+)-(\d+)$/.exec(key || '');
    return m ? (+m[1]) * 10000 + (+m[2]) * 100 + (+m[3]) : -1;
  }

  // 転生などで今の値が下がっても、これまでの最高値を保つ（既存のセーブはここで今の値から始まる）
  Quests.sync = function (state) {
    var lv = 0, enh = 0;
    Object.keys(state.heroes).forEach(function (id) { lv = Math.max(lv, state.heroes[id].lv); });
    state.items.forEach(function (it) { enh = Math.max(enh, it.enh || 0); });
    state.stats.maxHeroLv = Math.max(state.stats.maxHeroLv || 0, lv);
    state.stats.maxEnh = Math.max(state.stats.maxEnh || 0, enh);
  };
  Quests.value = function (state, stat) { return AL.Achievements.value(state, stat); };

  // ---- デイリー ----
  // 日付が進んだら、その時点の記録を開始点にして進捗と受け取り済みを戻す。端末の時刻を過去に戻しても戻さない。
  Quests.refreshDay = function (state, now) {
    var d = state.quests.daily, k = U.dateKey(now);
    if (d.day === k) return false;
    if (d.day && dayNum(k) < dayNum(d.day)) return false;
    Quests.sync(state);
    d.day = k;
    d.base = {};
    D.QUESTS.dailyStats.forEach(function (s) { d.base[s] = Quests.value(state, s); });
    d.claimed = {};
    return true;
  };
  Quests.dailyProgress = function (state, q) {
    var base = state.quests.daily.base[q.stat];
    var v = Quests.value(state, q.stat) - (typeof base === 'number' ? base : Quests.value(state, q.stat));
    return Math.max(0, v);
  };

  // ---- 状態：{value, target, done, claimed, locked} ----
  Quests.status = function (state, kind, q) {
    Quests.sync(state);
    if (kind === 'dailyBonus') {
      var all = D.QUESTS.daily.filter(function (x) { return Quests.dailyProgress(state, x) >= x.target; }).length;
      return { value: all, target: D.QUESTS.daily.length, done: all >= D.QUESTS.daily.length, claimed: !!state.quests.daily.claimed[q.id], locked: false };
    }
    var v = kind === 'daily' ? Quests.dailyProgress(state, q) : Quests.value(state, q.stat);
    var claimed = kind === 'daily' ? !!state.quests.daily.claimed[q.id] : !!state.quests[kind].claimed[q.id];
    var locked = false;
    if (kind === 'main') { var cur = Quests.mainCurrent(state); locked = !claimed && (!cur || cur.id !== q.id); }
    return { value: v, target: q.target, done: v >= q.target, claimed: claimed, locked: locked };
  };
  // 次に進めるメインクエスト（すべて受け取り済みなら null）
  Quests.mainCurrent = function (state) {
    for (var i = 0; i < D.QUESTS.main.length; i++) if (!state.quests.main.claimed[D.QUESTS.main[i].id]) return D.QUESTS.main[i];
    return null;
  };

  Quests.find = function (kind, id) {
    if (kind === 'dailyBonus' || id === D.QUESTS.dailyBonus.id) return { kind: 'dailyBonus', q: D.QUESTS.dailyBonus };
    var q = (D.QUESTS[kind] || []).filter(function (x) { return x.id === id; })[0];
    return q ? { kind: kind, q: q } : null;
  };

  // 受け取り：達成済み・未受取・（メインは順番どおり）のときだけ。付与と記録を同時に行う。
  Quests.claim = function (state, kind, id, now) {
    if (kind === 'daily' || kind === 'dailyBonus') Quests.refreshDay(state, now);
    var f = Quests.find(kind, id);
    if (!f) return { ok: false, msg: '不明なクエストです' };
    var s = Quests.status(state, f.kind, f.q);
    if (s.claimed) return { ok: false, msg: '受け取り済みです' };
    if (s.locked) return { ok: false, msg: '前のクエストを先に進めてください' };
    if (!s.done) return { ok: false, msg: 'まだ達成していません' };
    if (f.kind === 'daily' || f.kind === 'dailyBonus') state.quests.daily.claimed[id] = true;
    else state.quests[f.kind].claimed[id] = true;
    state.currency.crystals = U.safe(state.currency.crystals + f.q.reward.crystals);
    AL.Events.emit('questClaim', { kind: f.kind, id: id, reward: f.q.reward });
    return { ok: true, reward: f.q.reward };
  };

  // 受け取れるクエストの一覧（メインは順番どおりに、続けて達成していれば次も含める）
  Quests.claimable = function (state, now) {
    Quests.refreshDay(state, now);
    var out = [];
    var main = D.QUESTS.main, claimed = U.clone(state.quests.main.claimed);
    for (var i = 0; i < main.length; i++) {
      if (claimed[main[i].id]) continue;
      if (Quests.value(state, main[i].stat) >= main[i].target) { out.push({ kind: 'main', q: main[i] }); claimed[main[i].id] = true; }
      else break;
    }
    D.QUESTS.daily.forEach(function (q) { var s = Quests.status(state, 'daily', q); if (s.done && !s.claimed) out.push({ kind: 'daily', q: q }); });
    var b = Quests.status(state, 'dailyBonus', D.QUESTS.dailyBonus);
    if (b.done && !b.claimed) out.push({ kind: 'dailyBonus', q: D.QUESTS.dailyBonus });
    D.QUESTS.ach.forEach(function (q) { var s = Quests.status(state, 'ach', q); if (s.done && !s.claimed) out.push({ kind: 'ach', q: q }); });
    return out;
  };
  // まとめて受け取る（kind を指定するとその種類だけ）。合計の魂晶を返す
  Quests.claimAll = function (state, kind, now) {
    var n = 0, crystals = 0;
    Quests.claimable(state, now).forEach(function (x) {
      if (kind && x.kind !== kind && !(kind === 'daily' && x.kind === 'dailyBonus')) return;
      var r = Quests.claim(state, x.kind, x.q.id, now);
      if (r.ok) { n++; crystals += r.reward.crystals; }
    });
    return { count: n, crystals: crystals };
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>/* js/core/game.js */
/* ABYSSAL LEGENDS - セーブ管理とゲーム本体（ループ・時間管理） */
(function (G) {
  'use strict';
  var AL = G.AL = G.AL || {};
  var C = AL.CONFIG, U = AL.U;

  // ================= ストレージ（localStorage／使えない環境ではメモリ） =================
  var mem = {};
  AL.Storage = {
    available: (function () {
      try { var k = '__al_test__'; G.localStorage.setItem(k, '1'); G.localStorage.removeItem(k); return true; } catch (e) { return false; }
    })(),
    get: function (k) { try { return this.available ? G.localStorage.getItem(k) : (k in mem ? mem[k] : null); } catch (e) { return null; } },
    set: function (k, v) {
      try { if (this.available) G.localStorage.setItem(k, v); else mem[k] = v; return true; }
      catch (e) { return false; }
    },
    remove: function (k) { try { if (this.available) G.localStorage.removeItem(k); else delete mem[k]; } catch (e) { /* noop */ } },
    // get と違い、読み取りの失敗（{ok:false}）と「キーがない」（{ok:true, value:null}）を区別する
    peek: function (k) {
      try { return { ok: true, value: this.available ? G.localStorage.getItem(k) : (k in mem ? mem[k] : null) }; }
      catch (e) { return { ok: false, value: null }; }
    }
  };

  // ================= セーブ =================
  var Save = AL.Save = {};
  Save.serialize = function (state) { return JSON.stringify(state); };

  // ===== 読み込めないデータの退避と保護 =====
  // 読み込めなかったデータは「<元のキー>_corrupt_<時刻>」（使用中なら「_<時刻>_<連番>」）に退避する。既存のキーは上書きしない。
  // 退避を確認できなかったデータは guards に保持して「保護中」とし、そのキーへの保存・削除を止める。
  // 保護は、退避をやり直して成功を確認できたときだけ解除する（時間の経過・再起動・保存の呼び出しでは解除しない）。
  // 保護中は元のキーを書き換えないので、再起動しても同じデータを読んで再び退避を試みる。
  Save.guards = {};
  Save.QUARANTINE_MAX = 1000;
  Save.REASONS = {
    memory: '永続的な保存領域（localStorage）が使えないため',
    read: '保存領域を読み取れなかったため',
    write: '保存領域への書き込みに失敗したため（容量不足の可能性）',
    verify: '書き込んだ内容を確認できなかったため',
    full: '退避用の名前に空きがないため'
  };
  // text を退避する。成功は「書き込み成功」かつ「読み戻した内容が一致」の両方で判定する
  Save.quarantine = function (key, text, now) {
    if (!AL.Storage.available) return { ok: false, reason: 'memory' };  // メモリ保存はページを閉じると消えるので退避とみなさない
    var base = key + '_corrupt_' + Math.floor(now || Date.now());
    for (var i = 0; i < Save.QUARANTINE_MAX; i++) {
      var k = i ? base + '_' + i : base;
      var cur = AL.Storage.peek(k);
      if (!cur.ok) return { ok: false, reason: 'read' };
      if (cur.value !== null) continue;                     // 既存の退避データは上書きしない
      if (!AL.Storage.set(k, text)) return { ok: false, reason: 'write' };
      var back = AL.Storage.peek(k);

    if (key) return Object.prototype.hasOwnProperty.call(Save.guards, key);

  };
  // 退避して、失敗したら保護する
  function keepUnreadable(key, text, now) {
    var q = Save.quarantine(key, text, now);

  Save.retryProtected = function (now) {

  };
  var MSG_PROTECT = '元データを守るため、退避できるまでセーブを停止しています。設定画面の「セーブ」で退避を再試行してください。';

  // 保存。保護中のキーは書き換えない。backup 指定時は、直前の本体のバックアップを確認できたときだけ本体を書き換える
  Save.write = function (state, opts) {

      else if (!AL.State.parse(prev, now).ok) backup = 'skipped';
      else if (AL.Storage.set(C.BACKUP_KEY, prev) && AL.Storage.get(C.BACKUP_KEY) === prev) backup = 'ok';

      var rb = AL.State.parse(bak, now);

        return { state: rb.state, source: 'backup', protected: !qm.ok, warnings: ['セーブデータが破損していたため、バックアップから復元しました'].concat(r.errors).concat([

            : '読み込めなかった元データを別名で退避できませんでした（' + Save.REASONS[qm.reason] + '）。' + MSG_PROTECT]) };

  Game.init = function (opts) {
    opts = opts || {};
    var now = opts.now || Date.now();
    var loaded = opts.state ? { state: opts.state, warnings: [], source: 'given' } : Save.read(now);

    Game.loadWarnings = loaded.warnings || [];

      if (d) Game.state.currency.tickets += d.ticket;

    AL.Quests.refreshDay(Game.state, now);

    Game.state = state;
    U.notation = state.settings.notation;
    Game.pendingIdle = null;
    AL.Stats.invalidate();
    Game.runner = new AL.Runner(state);

    Game.save();
    AL.Events.emit('stateReplaced');
  };

  Game.importText = function (text) {
    if (Save.isProtected()) return { ok: false, blocked: true, errors: [MSG_PROTECTED_OP] };
    var r = AL.State.parse(text, Date.now());
    if (!r.ok) return r;

    r.state.lastSeen = Date.now();

    var s = Game.save({ backup: true });

    Game.replaceState(r.state);
    return r;
  };

  Game.resetAll = function () {
    if (!Save.wipe()) return { ok: false, msg: MSG_PROTECTED_OP };
    Game.replaceState(AL.State.createDefault(Date.now()));
    return { ok: true };
  };

  Game.rebirth = function () {
    // 保存できない状態で転生すると、取り消せない変化が保存されないまま残るため止める
    if (Save.isProtected()) return { ok: false, msg: MSG_PROTECTED_OP };
    var r = AL.Rebirth.perform(Game.state);
    if (r.ok) {
      if (Game.runner.mode === 'dungeon') Game.runner.abandonDungeon();
      Game.runner = new AL.Runner(Game.state);
      Game.runner.start();
      r.saved = Game.save({ backup: true }).ok;
      AL.Events.emit('stateReplaced');
    }
    return r;
  };

<script>/* js/gfx/fx.js */

 * ・描画の時間は Scene.render の刻み（上限0.1秒）に、ゲーム速度を掛けて進める。画面が止まっている間（非表示タブなど）は進まない。 */

    reward: { fx: 'collectBurst', pri: 2, rate: 1.2, opts: { palette: ['#1a1006', '#4a2c08', '#86520c', '#c48412', '#f0b424', '#ffe066', '#fff6c4', '#ffffff'] } },
    chest: { fx: 'chestOpen', pri: 2, rate: 2, opts: {} },
    heal: { fx: 'healAoe', pri: 3, rate: 1.5, opts: { palette: ['#06202a', '#0c3d4a', '#14707a', '#22a89a', '#5ce0b0', '#a8f5c8', '#e0fff0', '#ffffff'], reach: 84 } },
    death: { fx: 'poof', pri: 4, rate: 1.3, opts: { palette: ['#07040d', '#150c26', '#2a1a4e', '#47307f', '#6e55b4', '#a28ae0'], stars: ['#8a68d0', '#c9b5ff', '#ffffff'] } },
    crit: { fx: 'critHit', pri: 5, rate: 1, opts: { palette: ['#12062a', '#2e1366', '#6b2bb8', '#b04dff', '#ff7ad8', '#ffd84a', '#fff3b0', '#ffffff'] } },
    boss: { fx: 'poof', pri: 6, rate: 1.1, opts: { palette: ['#07040d', '#150c26', '#2a1a4e', '#47307f', '#6e55b4', '#a28ae0'], stars: ['#ffd84a', '#fff3a6', '#ffffff'] } }

  // meta.size は光（グロー）の広がりを含まないため、余白を足す。実測のはみ出し：下は最大32px（クリティカル）、左右・上は最大2px。

  // 合成と転送は、演出が使っている範囲だけに絞る（画面全体の合成は、小さな演出1つでも毎フレーム約0.5msかかるため）

 * 戦闘エンジンのユニット状態を毎フレーム直接読み取るため、HP・状態異常は内部データと常に一致します。

  // ---- pixelfx の演出（AL.Fx）：ユニットの足元に出す。出せない・使えないときは、これまでの粒子表現のまま ----
  function feet(u) { var v = Scene.vs[u.uid]; return v ? [v.x + (v.ox || 0), v.y] : null; }
  function fxAt(kind, u, flip) {

    return f;

  // 伝説以上の装備ドロップ（AL.Events の drop）は、次の consume で、最後に倒した敵の位置に演出を出す。
  // ただし「戦闘中の撃破のドロップ」だけ：ドロップは放置報酬の受け取りやダンジョンの結果でも出るため、撃破の処理の中

  Scene.rewardQueue = [];

  // ---- 演出の追加 ----
  function addText(x, y, text, color, size, opts) {

  }

      Scene.fx.push({ x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 10, life: (life || 0.5) * (0.6 + Math.random() * 0.6), t0: nowSec(), color: color, size: Math.random() < 0.3 ? 2 : 1, grav: grav == null ? 60 : grav });

  }
  Scene.shakeIt = function (amp, dur) { Scene.shake = Math.max(Scene.shake, amp); Scene.shakeT = Math.max(Scene.shakeT, nowSec() + (dur || 0.3)); };

  // ---- 戦闘イベントの処理 ----
  Scene.consume = function (battle) {

    Scene.lastConsumeAt = t;

    var fresh = [];

            var c0 = center(a), c1 = center(tg);

          } else {

            (ev.targets || []).forEach(function (id) { var tu = battle.find(id); if (tu) { var cc = center(tu); burst(cc[0], cc[1], col, 10, 50, 0.5); } });
          } else {
            (ev.targets || []).forEach(function (id) {
              var tu = battle.find(id); if (!tu || tu === u) return;
              if (tu.side !== u.side) { var c1 = center(tu); Scene.projs.push({ x0: c[0], y0: c[1], x1: c1[0], y1: c1[1], t0: t, dur: 0.25 / sp, color: col, size: 4, trail: true }); }
            });
          }

        }
        case 'dmg': {
          if (!u) break;
          var vd = vstate(u, battle, t);
          vd.hitT = t;
          var cd = center(u);
          if (showNums) {
            var txt = U.fmt(ev.amount), color = u.side === 'ally' ? '#ff6a6a' : '#ffffff', size = 8;
            if (ev.dot) { color = (D.STATUSES[ev.dot] && D.STATUSES[ev.dot].color) || '#ccc'; size = 6.5; }
            if (ev.crit) { color = '#ffd84a'; size = 11; txt = txt + '!'; }
            if (ev.em > 1 && !ev.dot) addText(cd[0], cd[1] - 10, '弱点', '#ff9a3a', 6, { dur: 0.7 });
            if (ev.em < 1 && !ev.dot) addText(cd[0], cd[1] - 10, '耐性', '#8aa0c0', 6, { dur: 0.7 });
            addText(cd[0], cd[1] - 2, txt, color, size, { vy: ev.crit ? -30 : -22 });
          }
          if (!ev.dot) burst(cd[0], cd[1], ev.crit ? '#ffd84a' : elemColor(ev.element), ev.crit ? 8 : 4, ev.crit ? 55 : 35, 0.35);
          if (ev.crit && u.isBoss) Scene.shakeIt(2, 0.15);

        }

  // ---- 背景（地形ごとに手続き生成してキャッシュ） ----
  function srand(seed) { var a = seed >>> 0; return function () { a = (a + 0x6D2B79F5) >>> 0; var t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

  function ridge(x, w, base, amp, step, col, r) {
    x.fillStyle = col; x.beginPath(); x.moveTo(0, H);
    var y = base;
    for (var i = 0; i <= w; i += step) { y = U.clamp(y + (r() - 0.5) * amp, base - amp * 2, base + amp); x.lineTo(i, Math.round(y)); }
    x.lineTo(w, H); x.closePath(); x.fill();
  }
  function buildBg(biome) {
    var BW = W * 2, r = srand(biome.id.length * 977 + biome.id.charCodeAt(0) * 31);
    var bg = biome.bg;
    var far = layer(BW, H), mid = layer(BW, H), near = layer(BW, H);

    for (var s = 0; s < 70; s++) { far.x.fillStyle = 'rgba(255,255,255,' + (0.15 + r() * 0.5) + ')'; far.x.fillRect(Math.floor(r() * BW), Math.floor(r() * 70), 1, 1); }
    // 月・光源
    var mc = biome.id === 'inferno' ? '#ff6a3a' : (biome.id === 'frost' ? '#d8f4ff' : '#e8e0ff');
    far.x.fillStyle = S.rgba(mc, 0.15); far.x.beginPath(); far.x.arc(250, 36, 22, 0, 7); far.x.fill();
    far.x.fillStyle = S.rgba(mc, 0.85); far.x.beginPath(); far.x.arc(250, 36, 12, 0, 7); far.x.fill();
    if (biome.id !== 'inferno') { far.x.fillStyle = bg[1]; far.x.beginPath(); far.x.arc(255, 33, 10, 0, 7); far.x.fill(); }
    ridge(far.x, BW, 104, 10, 6, S.shade(bg[2], -0.15), r);
    // 中景の構造物
    var mx = mid.x, mcol = S.shade(bg[2], -0.35), i;
    ridge(mx, BW, 128, 5, 8, S.shade(bg[3], -0.45), r);
    for (i = 0; i < 18; i++) {
      var px = Math.floor(r() * BW), py = 128;
      mx.fillStyle = mcol;
      if (biome.id === 'crypt') {
        if (r() < 0.5) { mx.fillRect(px, py - 16, 3, 16); mx.fillRect(px - 4, py - 12, 11, 3); }
        else { mx.fillRect(px, py - 10, 8, 10); mx.fillRect(px + 1, py - 12, 6, 2); }
        if (r() < 0.3) { mx.fillRect(px + 12, py - 30, 2, 30); mx.fillRect(px + 6, py - 26, 14, 1); mx.fillRect(px + 13, py - 22, 9, 1); }
      } else if (biome.id === 'forest') {
        var th = 30 + r() * 40;
        for (var k = 0; k < th; k += 3) { var ww = Math.floor((k / th) * 14) + 2; mx.fillRect(px - ww / 2, py - th + k, ww, 3); }
        mx.fillRect(px - 1, py - 6, 3, 6);
      } else if (biome.id === 'capital') {
        var tw = 8 + Math.floor(r() * 10), tht = 25 + Math.floor(r() * 45);
        mx.fillRect(px, py - tht, tw, tht);
        mx.beginPath(); mx.moveTo(px - 2, py - tht); mx.lineTo(px + tw / 2, py - tht - 12); mx.lineTo(px + tw + 2, py - tht); mx.fill();
        mx.fillStyle = S.rgba(biome.accent, 0.5); if (r() < 0.6) mx.fillRect(px + tw / 2 - 1, py - tht + 8, 2, 3);
      } else if (biome.id === 'frost') {

        var ih = 15 + r() * 40, iw = 6 + r() * 8;
        mx.beginPath(); mx.moveTo(px, py); mx.lineTo(px + iw / 2, py - ih); mx.lineTo(px + iw, py); mx.fill();
        mx.fillStyle = S.rgba('#ffffff', 0.25); mx.fillRect(px + iw / 2 - 1, py - ih + 4, 1, ih * 0.6);
      } else {
        var rh = 20 + r() * 35;
        mx.beginPath(); mx.moveTo(px, py); mx.lineTo(px + 4, py - rh); mx.lineTo(px + 9, py - rh * 0.7); mx.lineTo(px + 14, py); mx.fill();
        mx.fillStyle = S.rgba('#ff6a2a', 0.4); mx.fillRect(px + 5, py - rh * 0.5, 1, rh * 0.5);

    var g2 = nx.createLinearGradient(0, 132, 0, H);
    g2.addColorStop(0, S.shade(bg[3], -0.2)); g2.addColorStop(1, S.shade(bg[1], -0.3));
