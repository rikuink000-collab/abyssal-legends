<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0912">
<meta name="description" content="ABYSSAL LEGENDS - ダークファンタジー放置ハクスラRPG">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ABYSSAL LEGENDS</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%230a0912'/%3E%3Cpath d='M8 1 L14 8 L8 15 L2 8Z' fill='%238b6cff'/%3E%3Cpath d='M8 4 L11 8 L8 12 L5 8Z' fill='%23ff7ad8'/%3E%3C/svg%3E">
<style>
/* ABYSSAL LEGENDS - スタイル（スマートフォン優先・PCでは2カラム） */
:root {
  --bg: #0a0912;
  --bg2: #12101e;
  --panel: #171428;
  --panel2: #1e1a33;
  --line: #2e2848;
  --line2: #40386a;
  --text: #ece8ff;
  --sub: #a49ec4;
  --dim: #6e6890;
  --gold: #ffcc4d;
  --accent: #8b6cff;
  --accent2: #c55cff;
  --good: #5fe08a;
  --bad: #ff5a6a;
  --warn: #ffa53a;
  --info: #4aa8ff;
  --r: 10px;
  --nav-h: 64px;
  --head-h: 52px;
  --font: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Noto Sans JP", "Yu Gothic", "Meiryo", system-ui, sans-serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: var(--font); font-size: 15px; line-height: 1.5; }
body {
  min-height: 100vh; min-height: 100dvh; overflow-x: hidden;
  background:
    radial-gradient(ellipse at 20% -10%, rgba(139, 108, 255, 0.16), transparent 50%),
    radial-gradient(ellipse at 90% 110%, rgba(197, 92, 255, 0.10), transparent 50%), var(--bg);
  background-attachment: fixed;
}
button, select, input, textarea { font-family: inherit; font-size: inherit; color: inherit; }
img.px, canvas { image-rendering: pixelated; image-rendering: crisp-edges; }
.hidden { display: none !important; }
.dim { color: var(--dim); }
.sub { color: var(--sub); }
.good { color: var(--good); }
.bad { color: var(--bad); }
.gold { color: var(--gold); }
.small { font-size: 13px; }
.tiny { font-size: 12px; }
.num { font-variant-numeric: tabular-nums; }
.row { display: flex; align-items: center; gap: 8px; }
.row.wrap { flex-wrap: wrap; }
.row.between { justify-content: space-between; }
.grow { flex: 1; min-width: 0; }
.center { text-align: center; }
.mt { margin-top: 12px; }
.mb { margin-bottom: 12px; }
.ellipsis { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ===== ヘッダー ===== */
#header {
  position: sticky; top: 0; z-index: 30; height: var(--head-h);
  display: flex; align-items: center; gap: 8px; padding: 0 10px;
  background: linear-gradient(180deg, rgba(18, 16, 30, 0.98), rgba(14, 12, 24, 0.94));
  border-bottom: 1px solid var(--line); backdrop-filter: blur(6px);
}
#header .logo { font-weight: 900; letter-spacing: 0.06em; font-size: 15px; white-space: nowrap;
  background: linear-gradient(90deg, #d8c8ff, #ff9ae8); -webkit-background-clip: text; background-clip: text; color: transparent; }
#header .logo small { display: block; font-size: 9px; letter-spacing: 0.3em; color: var(--dim); -webkit-text-fill-color: var(--dim); }
#currency { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; flex: 1; justify-content: flex-end; }
#currency::-webkit-scrollbar { display: none; }
.cur { display: flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 999px; background: var(--panel2); border: 1px solid var(--line); font-size: 13px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.cur i { font-style: normal; display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; font-size: 11px; font-weight: 800; color: #120c20; }
.cur .ig { background: var(--gold); }
.cur .ic { background: linear-gradient(135deg, #b48aff, #ff7ad8); }
.cur .is { background: #8ac8ff; }
.cur .ie { background: #7fe3a2; }
.cur .it { background: #ffb86a; }
.cur .ish { background: #ff8ab0; }

/* ===== レイアウト ===== */
#app { display: block; padding-bottom: calc(var(--nav-h) + env(safe-area-inset-bottom) + 8px); }
#battle-panel { padding: 8px 8px 0; }
#screen-wrap { padding: 8px; min-width: 0; }
#mini-status { display: none; }
body:not(.tab-battle) #battle-panel { display: none; }
body:not(.tab-battle) #mini-status { display: flex; }

@media (min-width: 900px) {
  :root { --nav-h: 0px; }
  #app { display: grid; grid-template-columns: minmax(420px, 46%) 1fr; gap: 12px; padding: 10px 12px 20px; align-items: start; max-width: 1500px; margin: 0 auto; }
  #battle-panel { display: block !important; position: sticky; top: calc(var(--head-h) + 52px); padding: 0; }
  #mini-status { display: none !important; }
  #screen-wrap { padding: 0; }
  #nav { position: sticky !important; top: var(--head-h); bottom: auto !important; height: auto !important; justify-content: flex-start !important; padding: 6px 12px !important; overflow-x: auto; border-top: none !important; border-bottom: 1px solid var(--line); }
  #nav .nav-item { flex: 0 0 auto !important; flex-direction: row !important; gap: 6px !important; padding: 8px 12px !important; min-width: 0 !important; font-size: 14px !important; }
  #nav .nav-item.more-only { display: flex !important; }
  #nav .nav-item.menu-btn { display: none !important; }
  .battle-only-mobile { display: none !important; }
}

/* ===== ナビゲーション ===== */
#nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
  display: flex; justify-content: space-around; align-items: stretch;
  height: calc(var(--nav-h) + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom);
  background: rgba(14, 12, 24, 0.97); border-top: 1px solid var(--line); backdrop-filter: blur(8px);
}
.nav-item {
  flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  background: none; border: none; color: var(--sub); font-size: 11px; cursor: pointer; position: relative; padding: 4px 2px;
}
.nav-item .ni { font-size: 18px; line-height: 1; width: 30px; height: 26px; display: grid; place-items: center; border-radius: 8px; font-weight: 800; }
.nav-item.active { color: #fff; }
.nav-item.active .ni { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; box-shadow: 0 0 14px rgba(139, 108, 255, 0.5); }
.nav-item.more-only { display: none; }
.badge { position: absolute; top: 2px; right: calc(50% - 22px); min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: var(--bad); color: #fff; font-size: 10px; font-weight: 800; display: grid; place-items: center; }
.nav-item .badge:empty { display: none; }

/* ===== パネル・ボタン ===== */
.panel { background: linear-gradient(180deg, var(--panel), var(--bg2)); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; margin-bottom: 10px; }
.panel h2, .panel h3 { margin: 0 0 8px; font-size: 16px; display: flex; align-items: center; gap: 8px; }
.panel h3 { font-size: 15px; }
.screen-title { font-size: 18px; font-weight: 800; margin: 2px 2px 10px; display: flex; align-items: center; gap: 8px; }
.screen-title .tag { font-size: 12px; font-weight: 600; color: var(--sub); }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 8px 14px;
  border-radius: 10px; border: 1px solid var(--line2); background: var(--panel2); color: var(--text); font-weight: 700; cursor: pointer;
  touch-action: manipulation; user-select: none; transition: transform 0.06s, filter 0.15s;
}
.btn:active { transform: scale(0.97); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }
.btn.primary { background: linear-gradient(135deg, #7a5cff, #b04cff); border-color: #a07aff; box-shadow: 0 2px 12px rgba(139, 108, 255, 0.35); }
.btn.gold { background: linear-gradient(135deg, #e0a52a, #ffcc4d); color: #241800; border-color: #ffd97a; }
.btn.danger { background: linear-gradient(135deg, #a8233a, #ff4a6a); border-color: #ff7a8a; }
.btn.ghost { background: transparent; }
.btn.sm { min-height: 36px; padding: 4px 10px; font-size: 13px; border-radius: 8px; }
.btn.block { width: 100%; }
.btn .cost { font-size: 12px; font-weight: 600; opacity: 0.9; }
.btn-group { display: flex; gap: 6px; flex-wrap: wrap; }
.seg { display: inline-flex; border: 1px solid var(--line2); border-radius: 10px; overflow: hidden; }
.seg button { min-height: 38px; min-width: 44px; padding: 4px 10px; background: var(--panel2); border: none; border-right: 1px solid var(--line); font-weight: 700; cursor: pointer; }
.seg button:last-child { border-right: none; }
.seg button.on { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; }
.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
.chip { flex: 0 0 auto; min-height: 36px; padding: 4px 12px; border-radius: 999px; border: 1px solid var(--line2); background: var(--panel2); font-size: 13px; font-weight: 700; cursor: pointer; white-space: nowrap; }
.chip.on { background: var(--accent); border-color: #b9a6ff; color: #fff; }
select, input[type=number], input[type=text], textarea { background: var(--bg2); border: 1px solid var(--line2); border-radius: 8px; padding: 8px 10px; min-height: 40px; }
textarea { width: 100%; min-height: 120px; font-family: ui-monospace, monospace; font-size: 12px; }
label.toggle { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 48px; padding: 6px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
label.toggle:last-child { border-bottom: none; }
.switch { position: relative; width: 50px; height: 28px; flex: 0 0 auto; }
.switch input { opacity: 0; width: 0; height: 0; }
.switch span { position: absolute; inset: 0; background: #2a2540; border-radius: 14px; transition: 0.2s; }
.switch span::before { content: ""; position: absolute; width: 22px; height: 22px; left: 3px; top: 3px; background: #cfc8ef; border-radius: 50%; transition: 0.2s; }
.switch input:checked + span { background: var(--accent); }
.switch input:checked + span::before { transform: translateX(22px); background: #fff; }

.bar { height: 8px; border-radius: 4px; background: #241f38; overflow: hidden; position: relative; }
.bar > i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); border-radius: 4px; transition: width 0.2s; }
.bar.hp > i { background: linear-gradient(90deg, #3fc870, #7ff0a0); }
.bar.hp.mid > i { background: linear-gradient(90deg, #d0a020, #ffd84a); }
.bar.hp.low > i { background: linear-gradient(90deg, #c82a3a, #ff6a6a); }
.bar.boss > i { background: linear-gradient(90deg, #ff2a4a, #ff9a3a); }
.bar.cd { height: 4px; } .bar.cd > i { background: #4ab0ff; transition: none; }
.bar.cd.ready > i { background: #9ff0ff; box-shadow: 0 0 6px #9ff0ff; }

/* ===== 戦闘パネル ===== */
.hud { display: flex; align-items: center; gap: 8px; padding: 6px 4px; flex-wrap: wrap; }
.floor-label { font-weight: 900; font-size: 18px; letter-spacing: 0.02em; }
.floor-label small { font-size: 12px; color: var(--sub); font-weight: 600; margin-left: 4px; }
.waves { display: flex; gap: 4px; }
.waves i { width: 10px; height: 10px; border-radius: 3px; background: #2a2540; border: 1px solid var(--line2); }
.waves i.done { background: var(--good); border-color: var(--good); }
.waves i.cur { background: var(--gold); border-color: var(--gold); box-shadow: 0 0 6px var(--gold); }
.waves i.boss { width: 30px; background: #4a1020; border-color: #ff4a6a; }
.boss-prog { flex: 1; min-width: 140px; }
.boss-prog .tiny { display: flex; justify-content: space-between; }
.canvas-wrap { position: relative; border-radius: 10px; overflow: hidden; border: 1px solid var(--line2); background: #000; box-shadow: 0 6px 30px rgba(0, 0, 0, 0.5), inset 0 0 0 1px rgba(255, 255, 255, 0.03); }
.canvas-wrap canvas { display: block; width: 100%; height: auto; aspect-ratio: 16 / 9; }
.canvas-wrap .overlay-tr { position: absolute; top: 6px; right: 6px; display: flex; gap: 4px; }
.canvas-wrap .overlay-tl { position: absolute; top: 6px; left: 6px; font-size: 12px; background: rgba(0, 0, 0, 0.5); padding: 2px 8px; border-radius: 6px; }
.controls { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; padding: 8px 0; }
.dungeon-banner { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 10px; background: linear-gradient(90deg, rgba(197, 92, 255, 0.25), rgba(139, 108, 255, 0.1)); border: 1px solid #8a5aff; margin-bottom: 6px; }
.party-cards { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 5px; padding-bottom: 8px; }
.pc { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 4px; position: relative; min-width: 0; cursor: pointer; }
.pc.dead { opacity: 0.45; filter: grayscale(0.7); }
.pc .pc-top { display: flex; align-items: center; gap: 2px; }
.pc img { width: 32px; height: 32px; flex: 0 0 auto; }
.pc .pc-name { font-size: 11px; font-weight: 700; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pc .pc-lv { font-size: 10px; color: var(--sub); }
.pc .bar { height: 6px; margin-top: 2px; }
.pc .pc-hp { font-size: 10px; color: var(--sub); text-align: right; line-height: 1.2; font-variant-numeric: tabular-nums; }
.pc .sts { display: flex; gap: 2px; flex-wrap: wrap; min-height: 14px; margin-top: 2px; }
.st { font-size: 9px; line-height: 13px; padding: 0 2px; border-radius: 3px; color: #0a0810; font-weight: 800; }
.st.debuff { outline: 1px solid #000; }
#mini-status { position: sticky; top: var(--head-h); z-index: 20; align-items: center; gap: 8px; padding: 6px 10px; background: rgba(18, 16, 30, 0.96); border-bottom: 1px solid var(--line); font-size: 13px; cursor: pointer; }
#mini-status .mini-hp { display: flex; gap: 3px; flex: 1; }
#mini-status .mini-hp .bar { flex: 1; height: 6px; }

/* ===== リスト・カード ===== */
.grid-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.hcard { position: relative; display: flex; gap: 8px; align-items: center; padding: 8px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line); cursor: pointer; min-width: 0; }
.hcard:hover { border-color: var(--line2); }
.hcard img { width: 48px; height: 48px; flex: 0 0 auto; background: radial-gradient(circle, rgba(255, 255, 255, 0.06), transparent 70%); border-radius: 8px; }
.hcard .nm { font-weight: 800; font-size: 13px; line-height: 1.25; }
.hcard .meta { font-size: 11px; color: var(--sub); }
.hcard.r5 { border-color: rgba(255, 204, 77, 0.5); background: linear-gradient(135deg, rgba(255, 204, 77, 0.09), var(--panel)); }
.hcard.r4 { border-color: rgba(197, 139, 255, 0.45); background: linear-gradient(135deg, rgba(197, 139, 255, 0.08), var(--panel)); }
.hcard.inparty::after { content: "編成中"; position: absolute; top: 4px; right: 6px; font-size: 10px; color: var(--good); font-weight: 800; }
.hcard.selected { outline: 2px solid var(--gold); }
.stars { font-size: 11px; letter-spacing: -1px; font-weight: 900; }
.tagx { display: inline-block; font-size: 10px; font-weight: 800; padding: 0 5px; border-radius: 4px; line-height: 16px; color: #0a0810; }
.lb { display: inline-flex; gap: 2px; vertical-align: middle; }
.lb i { width: 6px; height: 6px; transform: rotate(45deg); background: #3a3456; display: inline-block; }
.lb i.on { background: var(--gold); box-shadow: 0 0 4px var(--gold); }
.list { display: flex; flex-direction: column; gap: 6px; }
.irow { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line); cursor: pointer; min-height: 52px; }
.irow:hover { border-color: var(--line2); }
.irow img { width: 36px; height: 36px; flex: 0 0 auto; border-radius: 8px; background: #0f0d18; padding: 2px; border: 1px solid var(--line2); }
.irow .nm { font-weight: 800; font-size: 13px; }
.irow .meta { font-size: 11px; color: var(--sub); }
.irow .right { text-align: right; font-size: 11px; color: var(--sub); flex: 0 0 auto; }
.lock { color: var(--gold); }
.eqby { font-size: 10px; background: #2a3a2a; color: #9ff0b0; padding: 0 5px; border-radius: 4px; }
.stat-table { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px 12px; font-size: 13px; }
.stat-table > div { display: flex; justify-content: space-between; border-bottom: 1px dashed var(--line); padding: 2px 0; font-variant-numeric: tabular-nums; }
.slots { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.slot { border: 1px dashed var(--line2); border-radius: 10px; padding: 6px; min-height: 64px; display: flex; gap: 6px; align-items: center; cursor: pointer; background: var(--bg2); min-width: 0; }
.slot.filled { border-style: solid; background: var(--panel); }
.slot.active { outline: 2px solid var(--gold); }
.slot img { width: 32px; height: 32px; flex: 0 0 auto; }
.slot .sl { font-size: 10px; color: var(--dim); }
.slot .nm { font-size: 11px; font-weight: 800; line-height: 1.2; }
.diff-up { color: var(--good); } .diff-down { color: var(--bad); }
.kv { display: flex; justify-content: space-between; gap: 8px; padding: 4px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.kv:last-child { border-bottom: none; }
.log { max-height: 240px; overflow-y: auto; font-size: 12px; background: #0c0a14; border-radius: 8px; padding: 6px 8px; border: 1px solid var(--line); }
.log div { padding: 1px 0; border-bottom: 1px solid #161226; }
.log .skill { color: #9fe8ff; } .log .eskill { color: #ff9a8a; } .log .kill { color: var(--sub); } .log .boss { color: #ff8aa0; font-weight: 700; }
.log .down { color: #ff6a6a; } .log .floor { color: var(--gold); font-weight: 700; }
.syn { padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line); margin-bottom: 4px; font-size: 13px; background: var(--bg2); }
.syn.on { border-color: #6ae09a; background: rgba(95, 224, 138, 0.08); }
.syn.on b { color: var(--good); }
.pslots { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.pslot { border: 1px dashed var(--line2); border-radius: 10px; padding: 6px 2px; text-align: center; min-height: 112px; cursor: pointer; background: var(--bg2); position: relative; }
.pslot.filled { border-style: solid; background: var(--panel); }
.pslot.sel { outline: 2px solid var(--gold); }
.pslot img { width: 48px; height: 48px; }
.pslot .pos { font-size: 10px; color: var(--dim); }
.pslot .nm { font-size: 11px; font-weight: 800; line-height: 1.2; height: 2.4em; overflow: hidden; }
.elem-chart { display: flex; flex-wrap: wrap; gap: 6px; font-size: 12px; align-items: center; }

/* ===== ガチャ ===== */
.banner-card { border-radius: 14px; padding: 16px; position: relative; overflow: hidden; border: 1px solid var(--line2); min-height: 170px; }
.banner-card h2 { margin: 0; font-size: 20px; text-shadow: 0 2px 8px #000; position: relative; }
.banner-card .bdesc { position: relative; font-size: 13px; color: #e0d8ff; }
.banner-card .feat { display: flex; gap: 4px; position: relative; margin-top: 10px; }
.banner-card .feat img { width: 72px; height: 72px; filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.35)); animation: bob 2.4s ease-in-out infinite; }
.banner-card .feat img:nth-child(2) { animation-delay: 0.4s; } .banner-card .feat img:nth-child(3) { animation-delay: 0.8s; }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
.pity { font-size: 13px; }
.gacha-overlay { position: fixed; inset: 0; z-index: 100; background: radial-gradient(circle at 50% 45%, #1a1030, #04030a 70%); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px; }
.gacha-overlay canvas { width: min(90vw, 420px); height: min(90vw, 420px); }
.gacha-results { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; width: min(96vw, 640px); }
.gacha-results.one { grid-template-columns: minmax(0, 200px); justify-content: center; }
.gres { border-radius: 10px; padding: 6px 4px; text-align: center; background: var(--panel); border: 2px solid var(--line2); opacity: 0; transform: rotateY(90deg) scale(0.8); transition: transform 0.35s, opacity 0.35s; position: relative; }
.gres.show { opacity: 1; transform: none; }
.gres.r5 { border-color: var(--gold); box-shadow: 0 0 18px rgba(255, 204, 77, 0.6); background: linear-gradient(180deg, #3a2a10, var(--panel)); }
.gres.r4 { border-color: #c58bff; box-shadow: 0 0 12px rgba(197, 139, 255, 0.5); background: linear-gradient(180deg, #2a1a40, var(--panel)); }
.gres img { width: 100%; max-width: 64px; aspect-ratio: 1; }
.gres .nm { font-size: 10px; font-weight: 800; line-height: 1.2; min-height: 2.4em; }
.gres .new { position: absolute; top: -6px; left: -4px; background: var(--bad); color: #fff; font-size: 10px; font-weight: 900; padding: 0 5px; border-radius: 4px; }
.gres .lbtag { font-size: 10px; color: var(--gold); }

/* ===== モーダル ===== */

<script>/* js/core/state.js */
/* ABYSSAL LEGENDS - ゲーム状態の定義・セーブデータ移行・検証 */
(function (G) {
  'use strict';
  var AL = G.AL = G.AL || {};
  var C = AL.CONFIG, D = AL.DATA, U = AL.U;

  var State = AL.State = {};

  State.createDefault = function (now) {
    now = now || Date.now();
    var s = {
      version: C.SAVE_VERSION,
      created: now, lastSeen: now, maxSeen: now, playTime: 0,
      currency: { gold: C.START.gold, crystals: C.START.crystals, stones: C.START.stones, shards: 0, exp: 0, tickets: C.TICKETS.START, rebirthPts: 0 },
      ticketRegenAt: now,
      heroes: {},
      party: [null, null, null, null, null],
      items: [],
      tower: { floor: 1, wave: 0, maxFloor: 1, autoAdvance: true, blockedFloor: 0 },
      stats: { kills: 0, bossKills: 0, gachaPulls: 0, maxFloorEver: 1, rebirths: 0, enhances: 0, dungeonClears: 0,
        rushBest: 0, mythicFound: 0, idleClaims: 0, fullSets: 0, goldEarned: 0, expEarned: 0, heroesOwned: 0, maxLB: 0 },
      gacha: { pity: { standard: 0, pickup: 0 }, history: [], total: 0 },
      rebirth: { count: 0, upgrades: {}, totalPts: 0 },
      dungeons: {},
      achievements: { claimed: {} },
      codex: { heroes: {}, enemies: {}, equips: {}, sets: {} },
      shop: { day: U.dateKey(now), bought: {} },
      settings: { speed: 1, dmgNumbers: true, effects: 'high', autoLevel: true, autoSell: -1, autoBoss: true,
        notation: 'jp', showLog: true, autoEquipDrops: false },
      idle: { kpm: C.IDLE.DEFAULT_KPM, lastClaimTs: now, lastResult: null },
      runInProgress: null
    };
    D.DUNGEONS.forEach(function (d) { s.dungeons[d.id] = { maxTier: 0, clears: 0, bestTime: 0, bestCount: 0, lastTier: 1 }; });
    C.START.heroes.forEach(function (id, i) {
      s.heroes[id] = State.newHero();
      s.party[i] = id;
      s.codex.heroes[id] = true;
    });
    s.stats.heroesOwned = C.START.heroes.length;
    return s;
  };

  State.newHero = function () {
    return { lv: 1, lb: 0, equip: { weapon: null, head: null, body: null, arms: null, legs: null, acc: null } };
  };

  // ===== セーブデータ移行（古いバージョン → 現行） =====
  // 新しい構造変更を入れるときは SAVE_VERSION を上げ、ここに関数を追加します。
  State.MIGRATIONS = {
    // v1：通貨が最上位にあった旧構造 → currency に集約
    1: function (s) {
      s.currency = s.currency || {};
      ['gold', 'crystals', 'stones'].forEach(function (k) {
        if (typeof s[k] === 'number') { s.currency[k] = s[k]; delete s[k]; }
      });
      if (typeof s.floor === 'number') { s.tower = s.tower || {}; s.tower.floor = s.floor; s.tower.maxFloor = s.maxFloor || s.floor; delete s.floor; delete s.maxFloor; }
      s.version = 2; return s;
    },
    // v2：図鑑にセット項目、ショップ購入記録を追加
    2: function (s) {
      s.codex = s.codex || {}; s.codex.sets = s.codex.sets || {};
      s.shop = s.shop || { day: U.dateKey(), bought: {} };
      s.version = 3; return s;
    }
  };

  State.migrate = function (raw) {
    var s = raw, guard = 0;
    while (typeof s.version === 'number' && s.version < C.SAVE_VERSION && guard++ < 20) {
      var fn = State.MIGRATIONS[s.version];
      if (!fn) throw new Error('バージョン' + s.version + 'からの移行処理がありません');
      s = fn(s);
    }
    return s;
  };

  // ===== 検証・修復 =====
  function num(v, def, min, max) {
    if (typeof v !== 'number' || !isFinite(v)) return def;
    if (min != null && v < min) v = min;
    if (max != null && v > max) v = max;
    return v;
  }
  function int(v, def, min, max) { v = num(v, def, min, max); return Math.floor(v); }
  function bool(v, def) { return typeof v === 'boolean' ? v : def; }
  function isObj(o) { return o != null && typeof o === 'object' && !Array.isArray(o); }

  State.sanitizeItem = function (it) {
    if (!isObj(it)) return null;
    var base = D.EQUIP_BASES[it.base];
    if (!base) return null;
    if (typeof it.uid !== 'string' || !it.uid) return null;
    var rarity = int(it.rarity, 0, 0, D.EQUIP_RARITY.length - 1);
    var R = D.EQUIP_RARITY[rarity];
    var out = {
      uid: it.uid.slice(0, 64), base: base.id, rarity: rarity,
      ilvl: int(it.ilvl, 1, 1, 1e9), enh: int(it.enh, 0, 0, R.maxEnh),
      main: { stat: base.main, value: num(it.main && it.main.value, 0, 0, U.MAX) },
      subs: [], set: (it.set && D.SETS[it.set]) ? it.set : null, locked: bool(it.locked, false)
    };
    if (Array.isArray(it.subs)) {
      it.subs.slice(0, 4).forEach(function (sb) {
        if (isObj(sb) && D.SUBSTATS[sb.stat]) out.subs.push({ stat: sb.stat, value: num(sb.value, 0, 0, U.MAX), rolls: int(sb.rolls, 1, 1, 20) });
      });
    }
    return out;
  };

  // 必須項目のチェック（読み込み前の検証）。問題があればエラー文字列の配列を返す
  State.checkRequired = function (s) {
    var errs = [];
    if (!isObj(s)) { errs.push('セーブデータがオブジェクトではありません'); return errs; }
    if (typeof s.version !== 'number' || !isFinite(s.version)) errs.push('version（数値）がありません');
    else if (s.version > C.SAVE_VERSION) errs.push('このゲームより新しいバージョン(' + s.version + ')のセーブデータです');
    else if (s.version < 1) errs.push('version が不正です');
    if (s.version >= 2) {
      if (!isObj(s.currency)) errs.push('currency（通貨）がありません');
      if (!isObj(s.tower)) errs.push('tower（階層）がありません');
    }
    if (!isObj(s.heroes)) errs.push('heroes（仲間）がありません');
    if (!Array.isArray(s.party)) errs.push('party（編成）がありません');
    return errs;
  };

  // 欠けた項目は既定値で補い、不正な値は修正する。ゲームを停止させないことを最優先。
  State.sanitize = function (raw, now) {
    var def = State.createDefault(now);
    var s = def;
    if (!isObj(raw)) return s;
    // 通貨
    var cu = isObj(raw.currency) ? raw.currency : {};
    Object.keys(def.currency).forEach(function (k) { s.currency[k] = num(cu[k], k === 'tickets' ? def.currency.tickets : 0, 0, U.MAX); });
    s.currency.tickets = int(s.currency.tickets, 0, 0, 99);
    s.created = num(raw.created, def.created, 0);
    s.lastSeen = num(raw.lastSeen, def.lastSeen, 0);
    s.maxSeen = Math.max(num(raw.maxSeen, s.lastSeen, 0), s.lastSeen);
    s.playTime = num(raw.playTime, 0, 0);
    s.ticketRegenAt = num(raw.ticketRegenAt, def.ticketRegenAt, 0);
    // 装備
    var seen = {};
    s.items = [];
    if (Array.isArray(raw.items)) {
      raw.items.forEach(function (it) {
        var c = State.sanitizeItem(it);
        if (c && !seen[c.uid]) { seen[c.uid] = c; s.items.push(c); }
      });
    }
    // 仲間
    s.heroes = {};
    var usedItem = {};
    if (isObj(raw.heroes)) {
      Object.keys(raw.heroes).forEach(function (id) {
        if (!D.HEROES[id]) return;
        var h = raw.heroes[id], nh = State.newHero();
        if (isObj(h)) {
          nh.lv = int(h.lv, 1, 1, 1e6);
          nh.lb = int(h.lb, 0, 0, C.HERO.MAX_LB);
          if (isObj(h.equip)) {
            D.SLOTS.forEach(function (sl) {
              var uid = h.equip[sl], it = seen[uid];
              if (it && D.EQUIP_BASES[it.base].slot === sl && !usedItem[uid]) { nh.equip[sl] = uid; usedItem[uid] = true; }
            });
          }
        }
        s.heroes[id] = nh;
      });
    }
    if (Object.keys(s.heroes).length === 0) {
      C.START.heroes.forEach(function (id) { s.heroes[id] = State.newHero(); });
    }
    // 編成
    s.party = [null, null, null, null, null];
    var inParty = {};
    if (Array.isArray(raw.party)) {
      for (var i = 0; i < C.HERO.PARTY_SIZE; i++) {
        var pid = raw.party[i];
        if (typeof pid === 'string' && s.heroes[pid] && !inParty[pid]) { s.party[i] = pid; inParty[pid] = true; }
      }
    }
    if (!s.party.some(function (x) { return x; })) {
      var ids = Object.keys(s.heroes).slice(0, C.HERO.PARTY_SIZE);
      ids.forEach(function (id, j) { s.party[j] = id; });
    }
    // 階層
    var t = isObj(raw.tower) ? raw.tower : {};
    s.tower.floor = int(t.floor, 1, 1, 1e9);
    s.tower.maxFloor = Math.max(int(t.maxFloor, 1, 1, 1e9), s.tower.floor);
    s.tower.wave = int(t.wave, 0, 0, C.TOWER.WAVES_PER_FLOOR - 1);
    s.tower.autoAdvance = bool(t.autoAdvance, true);
    s.tower.blockedFloor = int(t.blockedFloor, 0, 0, 1e9);
    // 統計
    var st = isObj(raw.stats) ? raw.stats : {};
    Object.keys(def.stats).forEach(function (k) { s.stats[k] = num(st[k], def.stats[k], 0, U.MAX); });
    s.stats.maxFloorEver = Math.max(s.stats.maxFloorEver, s.tower.maxFloor);
    // ガチャ
    var g = isObj(raw.gacha) ? raw.gacha : {};
    var pity = isObj(g.pity) ? g.pity : {};
    s.gacha.pity = { standard: int(pity.standard, 0, 0, C.GACHA.PITY - 1), pickup: int(pity.pickup, 0, 0, C.GACHA.PITY - 1) };
    s.gacha.total = int(g.total, 0, 0);
    s.gacha.history = Array.isArray(g.history) ? g.history.filter(function (h) {
      return isObj(h) && D.HEROES[h.id] && typeof h.t === 'number';
    }).slice(0, C.GACHA.HISTORY_MAX).map(function (h) {
      return { t: h.t, id: h.id, rarity: D.HEROES[h.id].rarity, banner: String(h.banner || '').slice(0, 40), pity: !!h.pity };
    }) : [];
    // 転生
    var rb = isObj(raw.rebirth) ? raw.rebirth : {};
    s.rebirth.count = int(rb.count, 0, 0);
    s.rebirth.totalPts = num(rb.totalPts, 0, 0);
    s.rebirth.upgrades = {};
    if (isObj(rb.upgrades)) {
      D.REBIRTH_UPGRADES.forEach(function (u) {
        var lv = int(rb.upgrades[u.id], 0, 0, u.max || 1e6);
        if (lv > 0) s.rebirth.upgrades[u.id] = lv;
      });
    }
    // ダンジョン
    var dg = isObj(raw.dungeons) ? raw.dungeons : {};
    D.DUNGEONS.forEach(function (d) {
      var r = isObj(dg[d.id]) ? dg[d.id] : {};
      s.dungeons[d.id] = { maxTier: int(r.maxTier, 0, 0, 1e6), clears: int(r.clears, 0, 0), bestTime: num(r.bestTime, 0, 0),
        bestCount: int(r.bestCount, 0, 0), lastTier: int(r.lastTier, 1, 1, 1e6) };
    });
    // 実績
    s.achievements.claimed = {};
    if (isObj(raw.achievements) && isObj(raw.achievements.claimed)) {
      D.ACHIEVEMENTS.forEach(function (a) { if (raw.achievements.claimed[a.id] === true) s.achievements.claimed[a.id] = true; });
    }
    // 図鑑
    var cx = isObj(raw.codex) ? raw.codex : {};
    if (isObj(cx.heroes)) Object.keys(cx.heroes).forEach(function (id) { if (D.HEROES[id]) s.codex.heroes[id] = true; });
    Object.keys(s.heroes).forEach(function (id) { s.codex.heroes[id] = true; });
    if (isObj(cx.enemies)) Object.keys(cx.enemies).forEach(function (id) {

<script>/* js/core/stats.js */
/* ABYSSAL LEGENDS - 能力値計算（仲間・装備・セット・相性・転生強化） */
(function (G) {
  'use strict';

  var C = AL.CONFIG, D = AL.DATA, U = AL.U;
  var Stats = AL.Stats = {};

  // 転生強化の効果合計
  Stats.rebirthEff = function (state) {
    var eff = { atkMul: 0, hpMul: 0, expMul: 0, goldMul: 0, dropMul: 0, idleHours: 0, idleEff: 0, levelCap: 0, startFloor: 0, crystalMul: 0 };
    var ups = (state.rebirth && state.rebirth.upgrades) || {};
    D.REBIRTH_UPGRADES.forEach(function (u) {
      var lv = ups[u.id] || 0;
      if (!lv) return;
      Object.keys(u.eff).forEach(function (k) { eff[k] += u.eff[k] * lv; });
    });
    return eff;
  };

  Stats.levelCap = function (state, heroId) {
    var h = state.heroes[heroId];
    return C.HERO.BASE_LEVEL_CAP + (h ? h.lb : 0) * C.HERO.LB_LEVEL_CAP + Stats.rebirthEff(state).levelCap;
  };

  Stats.levelMult = function (lv, rarity) {
    var g = C.HERO.RARITY_GROWTH[rarity] || 1;
    var n = Math.max(0, lv - 1);
    return U.safe((1 + C.HERO.LEVEL_LINEAR * g * n) * Math.pow(C.HERO.LEVEL_EXP, n * g));
  };

  // 装備1つの能力値（強化込み）
  Stats.itemStats = function (item) {
    var out = {};
    var base = D.EQUIP_BASES[item.base];
    if (!base) return out;
    var flat = !!D.FLAT_STATS[item.main.stat];
    var enhMul = 1 + C.EQUIP.ENH_MAIN * item.enh * (flat ? 1 : 0.5);
    out[item.main.stat] = U.safe(item.main.value * enhMul);
    item.subs.forEach(function (s) { out[s.stat] = U.safe((out[s.stat] || 0) + s.value); });
    return out;
  };

  // 装備のスコア（比較・自動装備用）
  Stats.itemScore = function (item, role) {
    var st = Stats.itemStats(item), g = AL.Scale.gear(item.ilvl), score = 0;
    var w = { atk: 3, hp: 0.25, def: 2, res: 2, atkP: 60, hpP: 40, defP: 30, resP: 30, spd: 80, crit: 70, critDmg: 35, skillPow: 45, healPow: 30 };
    if (role === 'tank') { w.hp = 0.5; w.def = 3; w.res = 3; w.hpP = 70; w.defP = 55; w.atkP = 25; w.crit = 30; w.critDmg = 15; }
    if (role === 'healer') { w.healPow = 80; w.skillPow = 55; w.critDmg = 15; }
    if (role === 'mage') { w.skillPow = 70; }
    if (role === 'support') { w.spd = 100; w.hpP = 50; }
    Object.keys(st).forEach(function (k) {
      var v = st[k];
      if (D.FLAT_STATS[k]) score += (v / g) * (w[k] || 1);

  // 装備しているセットの集計

    var h = state.heroes[heroId], counts = {}, res = [];

    var byUid = Stats.itemMap(state);
    D.SLOTS.forEach(function (sl) {
      var it = byUid[h.equip[sl]];
      if (it && it.set) counts[it.set] = (counts[it.set] || 0) + 1;
    });
    Object.keys(counts).forEach(function (sid) {
      var set = D.SETS[sid], active = [];
      Object.keys(set.bonuses).forEach(function (n) { if (counts[sid] >= +n) active.push(+n); });
      res.push({ id: sid, count: counts[sid], active: active });
    });
    return res;
  };

  var mapCache = { items: null, map: null, len: -1 };
  Stats.itemMap = function (state) {
    if (mapCache.items === state.items && mapCache.len === state.items.length && mapCache.map) return mapCache.map;
    var m = {};

    heroes.forEach(function (h) { elemCount[h.element] = (elemCount[h.element] || 0) + 1; roleCount[h.role] = (roleCount[h.role] || 0) + 1; });
    var maxSame = 0; Object.keys(elemCount).forEach(function (k) { maxSame = Math.max(maxSame, elemCount[k]); });
    var active = [];
    D.SYNERGIES.forEach(function (sy) {
      var c = sy.cond, ok = true;
      if (c.sameElement && maxSame < c.sameElement) ok = false;
      if (c.distinctElements && Object.keys(elemCount).length < c.distinctElements) ok = false;
      if (c.roles && !c.roles.every(function (r) { return roleCount[r] > 0; })) ok = false;
      if (c.roleCount && (roleCount[c.roleCount.role] || 0) < c.roleCount.n) ok = false;
      if (c.heroes && !c.heroes.every(function (id) { return ids.indexOf(id) >= 0; })) ok = false;

  };
  Stats.synergyBonusFor = function (heroId, activeSyn) {
    var b = {};

    });

    var lbm = 1 + C.HERO.LB_STAT * h.lb;
    var F = { hp: 0, atk: 0, def: 0, res: 0 }, P = {};
    var byUid = Stats.itemMap(state);
    var equipOverride = opts.equip || null; // {slot: item}
    D.SLOTS.forEach(function (sl) {
      var it = equipOverride && (sl in equipOverride) ? equipOverride[sl] : byUid[h.equip[sl]];
      if (!it) return;
      var st = Stats.itemStats(it);
      Object.keys(st).forEach(function (k) {
        if (D.FLAT_STATS[k]) F[k] += st[k]; else P[k] = (P[k] || 0) + st[k];

    });
    // セット
    var passives = [];
    var sets = equipOverride ? Stats.setInfoFromItems(D.SLOTS.map(function (sl) { return (sl in equipOverride) ? equipOverride[sl] : byUid[h.equip[sl]]; }))

    sets.forEach(function (si) {
      si.active.forEach(function (n) {
        var bn = D.SETS[si.id].bonuses[n];
        if (bn.stats) Object.keys(bn.stats).forEach(function (k) { P[k] = (P[k] || 0) + bn.stats[k]; });
        if (bn.passive) passives.push(bn.passive);

    Object.keys(syn).forEach(function (k) { P[k] = (P[k] || 0) + syn[k]; });
    var eff = Stats.rebirthEff(state);
    function core(k, mod) { return rb[k] * (m[k] || 1) * rs * L * lbm; }
    var s = {
      hp: U.safe((core('hp') + F.hp) * (1 + (P.hpP || 0)) * (1 + eff.hpMul)),
      atk: U.safe((core('atk') + F.atk) * (1 + (P.atkP || 0)) * (1 + eff.atkMul)),
      def: U.safe((core('def') + F.def) * (1 + (P.defP || 0)) * (1 + eff.hpMul)),
      res: U.safe((core('res') + F.res) * (1 + (P.resP || 0)) * (1 + eff.hpMul)),
      spd: U.clamp(rb.spd * (m.spd || 1) * (1 + (P.spd || 0)), 0.2, 4),
      crit: U.clamp(rb.crit * (m.crit || 1) + (P.crit || 0), 0, 1),
      critDmg: rb.critDmg + (P.critDmg || 0),
      skillPow: P.skillPow || 0,
      healPow: P.healPow || 0,
      cdr: U.clamp(P.cdr || 0, 0, 0.5),
      lifesteal: U.clamp(P.lifesteal || 0, 0, 0.5),
      dmgBonus: P.dmgBonus || 0,
      bossDmg: P.bossDmg || 0,
      passives: passives, sets: sets, level: lv

    s.power = Stats.power(s);
    return s;
  };

  Stats.setInfoFromItems = function (items) {
    var counts = {}, res = [];
    items.forEach(function (it) { if (it && it.set) counts[it.set] = (counts[it.set] || 0) + 1; });
    Object.keys(counts).forEach(function (sid) {
      var active = [];
      Object.keys(D.SETS[sid].bonuses).forEach(function (n) { if (counts[sid] >= +n) active.push(+n); });
      res.push({ id: sid, count: counts[sid], active: active });
    });
    return res;
  };

  // 戦闘力（目安）
  Stats.power = function (s) {
    var off = s.atk * (1 + Math.min(1, s.crit) * (C.BATTLE.CRIT_BASE_DMG - 1 + s.critDmg)) * s.spd * (1 + s.skillPow * 0.4 + s.healPow * 0.2);

    return U.safe(total);
  };

  };

  P.addShield = function (tgt, amount, src) {
    var ex = this.hasStatus(tgt, 'shield');
    amount = U.safe(amount);
    if (ex) { ex.value = Math.max(ex.value, amount); ex.dur = 10; }
    else tgt.statuses.push({ id: 'shield', value: amount, dur: 10, tick: 0, stacks: 1, src: src ? src.uid : null });
    this.emit({ t: 'shield', uid: tgt.uid, amount: amount });
  };

  P.tickStatuses = function (u, dt) {
    for (var i = u.statuses.length - 1; i >= 0; i--) {
      if (!u.alive || i >= u.statuses.length) return; // 継続ダメージで倒れた場合
      var s = u.statuses[i], sd = D.STATUSES[s.id];
      s.dur -= dt;
      if (sd.kind === 'dot' || sd.kind === 'hot') {
        s.tick += dt;
        while (s.tick >= 1 && u.alive) {
          s.tick -= 1;
          if (sd.kind === 'dot') {
            var dmg = s.value * (s.stacks || 1) * (1 + this.modSum(u, 'dmgTaken'));
            this.dealRaw(this.find(s.src), u, dmg, { dot: s.id });
          } else {
            this.healUnit(u, u.maxHp * s.value, null, true);
          }
        }
      }
      if (s.dur <= 0 || (sd.kind === 'shield' && s.value <= 0)) u.statuses.splice(i, 1);
    }
  };

  // ---- 対象選択 ----
  P.foes = function (u) { return u.side === 'ally' ? this.alive('enemy') : this.alive('ally'); };
  P.friends = function (u) { return u.side === 'ally' ? this.alive('ally') : this.alive('enemy'); };

  P.pickEnemy = function (u) {
    var foes = this.foes(u);
    if (!foes.length) return null;
    var self = this;
    var taunters = foes.filter(function (f) { return self.hasStatus(f, 'taunt'); });
    if (taunters.length) return taunters[0];
    if (u.side === 'ally') {
      // 味方：先頭の敵に集中（ボスがいればボス優先しない＝取り巻きから処理）
      return foes[0];
    }
    if (u.ai === 'assassin' && U.chance(0.5)) return this.lowest(foes);
    var weights = foes.map(function (f) {
      var w = 1;
      var front = f.slot < C.HERO.FRONT_SLOTS;
      if (u.ai === 'caster') w = front ? 0.7 : 1.4;
      else if (front) w = B.FRONT_TARGET_WEIGHT;
      if (f.role === 'tank') w *= B.TANK_THREAT;
      return w;
    });
    return foes[U.weightedIndex(weights)];
  };
  P.lowest = function (list) {
    var best = null;
    list.forEach(function (x) { if (!best || x.hp / x.maxHp < best.hp / best.maxHp) best = x; });
    return best;
  };
  P.highest = function (list) {
    var best = null;
    list.forEach(function (x) { if (!best || x.hp > best.hp) best = x; });
    return best;
  };
  P.resolveTargets = function (u, target, primary) {
    switch (target) {
      case 'self': return [u];
      case 'allAllies': return this.friends(u);
      case 'allyLowest': var fr = this.friends(u); return fr.length ? [this.lowest(fr)] : [];
      case 'allEnemies': return this.foes(u);
      case 'enemyLowest': var f1 = this.foes(u); return f1.length ? [this.lowest(f1)] : [];
      case 'enemyHighest': var f2 = this.foes(u); return f2.length ? [this.highest(f2)] : [];
      case 'randomEnemies': return this.foes(u);
      case 'targets': return primary || [];
      default: var e = this.pickEnemy(u); return e ? [e] : [];
    }
  };

  // ---- ダメージ・回復 ----
  P.calcDamage = function (src, tgt, p, type, opt) {
    opt = opt || {};
    var atk = this.eff(src, 'atk');
    var raw = atk * p * (opt.skill ? 1 + src.skillPow : 1);
    var defStat = type === 'mag' ? 'res' : 'def';
    var def = this.eff(tgt, defStat) * (1 - (opt.pierce || 0));
    var red = def / (def + atk * B.DEF_FACTOR + 1e-9);
    var dmg = raw * (1 - red);
    var em = elemMult(src.element, tgt.element);
    dmg *= em;
    var critChance = U.clamp(this.eff(src, 'crit') + (opt.critBonus || 0), 0, 1);
    var crit = U.chance(critChance);
    if (crit) dmg *= B.CRIT_BASE_DMG + src.critDmg;
    dmg *= 1 + this.modSum(tgt, 'dmgTaken');
    dmg *= 1 + src.dmgBonus + (tgt.isBoss ? src.bossDmg : 0);
    dmg *= 1 + U.randRange(-B.VARIANCE, B.VARIANCE);
    return { dmg: U.safe(Math.max(1, dmg)), crit: crit, em: em };
  };

  P.dealRaw = function (src, tgt, dmg, info) {
    if (!tgt || !tgt.alive) return 0;
    info = info || {};
    dmg = U.safe(dmg);
    var absorbed = 0;
    var sh = this.hasStatus(tgt, 'shield');
    if (sh && sh.value > 0) {
      absorbed = Math.min(sh.value, dmg);
      sh.value -= absorbed;
      dmg -= absorbed;
    }
    tgt.hp = Math.max(0, tgt.hp - dmg);
    if (src) src.dmgDealt = U.safe(src.dmgDealt + dmg + absorbed);
    this.emit({ t: 'dmg', src: src ? src.uid : null, uid: tgt.uid, amount: dmg + absorbed, absorbed: absorbed, crit: !!info.crit,
      em: info.em || 1, dot: info.dot || null, skill: !!info.skill, element: src ? src.element : null });
    if (tgt.hp <= 0) this.kill(tgt, src);
    else this.checkHpAbilities(tgt);
    return dmg + absorbed;
  };

  P.kill = function (u, src) {
    if (!u.alive) return;
    u.alive = false; u.hp = 0; u.deadAt = this.time; u.statuses = [];
    if (src) src.kills++;
    this.emit({ t: 'death', uid: u.uid, boss: u.isBoss, side: u.side });
    if (u.side === 'enemy') this.addLog((u.isBoss ? '【ボス撃破】' : '') + u.name + 'を倒した', u.isBoss ? 'boss' : 'kill');
    else this.addLog(u.name + 'が倒れた…', 'down');
    if (this.onDeath) this.onDeath(u, this);
  };

  P.healUnit = function (tgt, amount, src, silent) {
    if (!tgt.alive) return 0;
    var before = tgt.hp;
    tgt.hp = Math.min(tgt.maxHp, tgt.hp + U.safe(amount));
    var healed = tgt.hp - before;
    if (healed > 0 && !silent) this.emit({ t: 'heal', src: src ? src.uid : null, uid: tgt.uid, amount: healed });
    else if (healed > 0) this.emit({ t: 'heal', uid: tgt.uid, amount: healed, small: true });
    return healed;
  };

  P.hit = function (src, tgt, p, type, opt) {
    if (!tgt || !tgt.alive || !src.alive) return 0;
    var r = this.calcDamage(src, tgt, p, type, opt);
    var dealt = this.dealRaw(src, tgt, r.dmg, { crit: r.crit, em: r.em, skill: opt && opt.skill });
    var steal = (src.lifesteal || 0) + ((opt && opt.drain) || 0);
    if (steal > 0 && dealt > 0) this.healUnit(src, dealt * steal, src, true);
    // セット効果：攻撃時の付与
    for (var i = 0; i < src.passives.length; i++) {
      var oh = src.passives[i].onHit;
      if (oh && tgt.alive && U.chance(oh.c)) this.applyStatus(tgt, oh.s, oh.v, oh.d, src);
    }
    return dealt;
  };

  // ---- 行動 ----
  P.wantsSkill = function (u) {
    if (!u.skill || u.cd > 0) return false;
    if (this.hasStatus(u, 'silence')) return false;
    if (u.skill.ai === 'heal') {
      var fr = this.friends(u);
      return fr.some(function (f) {
        if (f.hp / f.maxHp < 0.75) return true;
        return f.statuses.some(function (s) { var sd = D.STATUSES[s.id]; return sd && sd.debuff && sd.kind !== 'mod'; });
      });
    }
    return true;
  };

  P.act = function (u) {
    if (this.wantsSkill(u)) this.castSkill(u, u.skill);
    else this.basicAttack(u);
  };

  P.basicAttack = function (u) {
    var tgt = this.pickEnemy(u);
    if (!tgt) return;
    this.emit({ t: 'attack', uid: u.uid, tgt: tgt.uid, ranged: !!u.basic.ranged, type: u.basic.type, element: u.element });
    this.hit(u, tgt, u.basic.p, u.basic.type, {});
  };

  P.castSkill = function (u, sk, forced) {
    var self = this;
    var primary = this.resolveTargets(u, sk.target);
    if (!primary.length && sk.target !== 'self') { if (!forced) u.cd = 0.5; return; }
    if (!forced || sk.cd < 900) u.cd = sk.cd * (1 - u.cdr);
    this.emit({ t: 'skill', uid: u.uid, name: sk.name, targets: primary.map(function (x) { return x.uid; }), target: sk.target, element: u.element, boss: u.isBoss });
    this.addLog(u.name + '「' + sk.name + '」', u.side === 'ally' ? 'skill' : 'eskill');
    sk.effects.forEach(function (ef) {
      var tg = ef.t ? self.resolveTargets(u, ef.t, primary) : primary;
      switch (ef.k) {
        case 'dmg':
          var hits = ef.hits || 1;
          for (var h = 0; h < hits; h++) {
            if (sk.target === 'randomEnemies') {
              var foes = self.foes(u); if (!foes.length) break;
              self.hit(u, U.pick(foes), ef.p, ef.type, { skill: true, drain: ef.drain, critBonus: ef.critBonus, pierce: ef.pierce });
            } else {
              tg.forEach(function (t) { self.hit(u, t, ef.p, ef.type, { skill: true, drain: ef.drain, critBonus: ef.critBonus, pierce: ef.pierce }); });
            }
          }
          break;
        case 'heal':
          tg.forEach(function (t) {
            var amt = ef.scale === 'maxHp' ? t.maxHp * ef.p : self.eff(u, 'atk') * ef.p * (1 + u.healPow) * (1 + u.skillPow * 0.5);
            self.healUnit(t, amt, u);
          });
          break;
        case 'shield':
          tg.forEach(function (t) {
            var base = ef.scale === 'casterHp' ? u.maxHp : (ef.scale === 'atk' ? self.eff(u, 'atk') : t.maxHp);
            self.addShield(t, base * ef.p * (1 + u.healPow * 0.5), u);
          });
          break;
        case 'status':
          tg.forEach(function (t) {
            if (!t.alive) return;
            if (ef.c != null && !U.chance(ef.c)) return;
            self.applyStatus(t, ef.s, ef.v, ef.d, u);
          });
          break;
        case 'cleanse':
          tg.forEach(function (t) { t.statuses = t.statuses.filter(function (s) { var sd = D.STATUSES[s.id]; return !(sd && sd.debuff); }); self.emit({ t: 'cleanse', uid: t.uid }); });
          break;
        case 'cdr':
          tg.forEach(function (t) { if (t !== u) t.cd = Math.max(0, t.cd - ef.v); });
          break;
        case 'summon':
          self.summon(u, ef.enemy, ef.n);
          break;
      }
    });
  };

  P.summon = function (src, enemyId, n) {
    if (!this.spawnFactory) return;
    for (var i = 0; i < n; i++) {
      if (this.alive('enemy').length >= B.MAX_ENEMIES + 1) break;
      var spec = this.spawnFactory(enemyId);
      if (!spec) break;
      var u = makeUnit(Object.assign({ side: 'enemy', slot: this.enemies.length }, spec));
      u.summoned = true;
      this.enemies.push(u);
      this.emit({ t: 'spawn', uid: u.uid, summon: true });
    }
  };

  // ---- ボス能力 ----
  P.runAbility = function (u, a) {
    if (!u.alive) return;
    if (a.text) { this.addLog(u.name + '：' + a.text, 'boss'); this.emit({ t: 'bossAbility', uid: u.uid, text: a.text }); }
    if (a.skill && D.SKILLS[a.skill]) this.castSkill(u, D.SKILLS[a.skill], true);
    if (a.summon) this.summon(u, a.summon.enemy, a.summon.n);
  };
  P.checkHpAbilities = function (u) {
    if (!u.abilities.length || !u.alive) return;
    for (var i = 0; i < u.abilities.length; i++) {
      var a = u.abilities[i];
      if (a.on === 'hpBelow' && !a.used && u.hp / u.maxHp <= a.at) { a.used = true; this.runAbility(u, a); }
    }
  };

  // ---- 1刻み進める ----
  P.step = function (dt) {
    if (this.status !== 'fight') return;
    dt = dt || B.TICK;
    this.time += dt;
    this.waveTime += dt;
    var all = this.allies.concat(this.enemies), i, u;
    for (i = 0; i < all.length; i++) { u = all[i]; if (u.alive) this.tickStatuses(u, dt); }
    if (this.checkEnd()) return;
    for (i = 0; i < all.length; i++) {
      u = all[i];
      if (!u.alive) continue;
      // ボスの定期能力
      for (var k = 0; k < u.abilities.length; k++) {
        var a = u.abilities[k];
        if (a.on === 'every') { a.timer -= dt; if (a.timer <= 0) { a.timer = a.sec; this.runAbility(u, a); } }
      }
      if (this.hasStatus(u, 'stun') || this.hasStatus(u, 'freeze')) continue;
      if (u.cd > 0) u.cd = Math.max(0, u.cd - dt);
      u.gauge += dt * this.eff(u, 'spd') / B.BASE_INTERVAL;
      if (u.gauge >= 1) {
        u.gauge -= 1;
        if (u.gauge > 1) u.gauge = 0.5;
        this.act(u);
        if (this.checkEnd()) return;
      }
    }
    if (this.timeLimit && this.waveTime >= this.timeLimit && this.status === 'fight') {
      this.status = 'timeout';
      this.addLog('時間切れ…撤退します', 'down');
      this.emit({ t: 'timeout' });
    }
  };

  P.checkEnd = function () {
    if (this.status !== 'fight') return true;
    var anyAlly = this.allies.some(function (u) { return u.alive; });
    var anyEnemy = this.enemies.some(function (u) { return u.alive; });
    if (!anyAlly) { this.status = 'wiped'; this.emit({ t: 'wiped' }); this.addLog('パーティーが全滅した…', 'down'); return true; }
    if (!anyEnemy) { this.status = 'cleared'; this.emit({ t: 'cleared' }); return true; }
    return false;
  };
})(typeof window !== 'undefined' ? window : globalThis);

<script>/* js/core/inventory.js */
/* ABYSSAL LEGENDS - 装備：生成・強化・売却・ロック・装着・自動整理 */
(function (G) {
  'use strict';
  var AL = G.AL = G.AL || {};
  var C = AL.CONFIG, D = AL.DATA, U = AL.U;
  var Inv = AL.Inv = {};

  var PREFIX = ['古びた', '頑丈な', '魔鋼の', '黒曜の', '英雄の', '神話の'];

  Inv.name = function (it) {
    var b = D.EQUIP_BASES[it.base];
    if (!b) return '不明な装備';
    return (it.set ? D.SETS[it.set].name + 'の' : PREFIX[it.rarity]) + b.name;
  };

  Inv.rollRarity = function (floor, opts) {
    opts = opts || {};
    var w = C.EQUIP.RARITY_WEIGHTS.slice();
    var f = Math.min(Math.max(1, floor), 600);
    var bonus = 1 + (opts.bonus || 0);
    for (var i = 1; i < w.length; i++) w[i] *= (1 + C.EQUIP.RARITY_FLOOR_SHIFT * f * i) * (i >= 3 ? bonus : 1);
    var min = opts.minRarity || 0;
    for (var j = 0; j < min; j++) w[j] = 0;
    return U.weightedIndex(w);
  };

  Inv.rollSub = function (stat, ilvl, rarity) {
    var sd = D.SUBSTATS[stat], R = D.EQUIP_RARITY[rarity];
    var v = U.randRange(sd.min, sd.max) * R.subMult;
    if (sd.flat) v *= AL.Scale.gear(ilvl);
    return U.safe(v);
  };

  // 装備生成。opts: {ilvl, rarity, minRarity, slot, base, setSource, setChance, set}
  Inv.generate = function (opts) {
    opts = opts || {};
    var ilvl = Math.max(1, Math.floor(opts.ilvl || 1));
    var rarity = opts.rarity != null ? opts.rarity : Inv.rollRarity(ilvl, { minRarity: opts.minRarity, bonus: opts.rarityBonus });
    var R = D.EQUIP_RARITY[rarity];
    var base;
    if (opts.base) base = D.EQUIP_BASES[opts.base];
    else {
      var cands = D.EQUIP_BASE_LIST.filter(function (b) { return !opts.slot || b.slot === opts.slot; });
      base = U.pick(cands);
    }
    var flat = !!D.FLAT_STATS[base.main];
    var mainVal = flat ? base.mainBase * AL.Scale.gear(ilvl) * R.mult : base.mainBase * (1 + (R.mult - 1) * 0.6);
    mainVal *= U.randRange(0.92, 1.08);
    var item = { uid: U.uid('i'), base: base.id, rarity: rarity, ilvl: ilvl, enh: 0,
      main: { stat: base.main, value: U.safe(mainVal) }, subs: [], set: null, locked: false };
    // サブ能力（重複なし、主能力とも重複しない）
    var pool = Object.keys(D.SUBSTATS).filter(function (k) { return k !== base.main; });
    for (var i = 0; i < R.subs && pool.length; i++) {
      var weights = pool.map(function (k) { return D.SUBSTATS[k].w * (base.bias.indexOf(k) >= 0 ? 2.2 : 1); });
      var idx = U.weightedIndex(weights);
      var st = pool.splice(idx, 1)[0];
      item.subs.push({ stat: st, value: Inv.rollSub(st, ilvl, rarity), rolls: 1 });
    }
    // セット
    if (opts.set && D.SETS[opts.set]) item.set = opts.set;
    else if (rarity >= 3 || opts.forceSet) {
      var src = opts.setSource || 'tower';
      var sets = D.SET_ORDER.filter(function (s) { return D.SETS[s].sources.indexOf(src) >= 0; });
      var ch = opts.setChance != null ? opts.setChance : C.EQUIP.SET_CHANCE;
      if (sets.length && (opts.forceSet || U.chance(ch))) item.set = U.pick(sets);
    }
    return item;
  };

  Inv.sellValue = function (it) {
    var R = D.EQUIP_RARITY[it.rarity];
    return U.safe(Math.floor(8 * AL.Scale.reward(it.ilvl) * R.sell * (1 + it.enh * 0.25)) + 1);
  };
  Inv.sellStones = function (it) { return Math.floor(it.enh * (1 + it.rarity) * 0.5); };

  Inv.equippedBy = function (state, uid) {
    var ids = Object.keys(state.heroes);
    for (var i = 0; i < ids.length; i++) {
      var eq = state.heroes[ids[i]].equip;
      for (var s in eq) if (eq[s] === uid) return ids[i];
    }
    return null;
  };
  Inv.equippedSet = function (state) {
    var m = {};
    Object.keys(state.heroes).forEach(function (id) {
      var eq = state.heroes[id].equip;
      Object.keys(eq).forEach(function (s) { if (eq[s]) m[eq[s]] = id; });
    });
    return m;
  };

  Inv.find = function (state, uid) { return AL.Stats.itemMap(state)[uid] || null; };

  function touch(state) { AL.Stats.invalidate(); AL.Events.emit('inventory'); }

  // 図鑑登録
  Inv.registerCodex = function (state, it) {
    var cur = state.codex.equips[it.base];
    if (cur == null || it.rarity > cur) state.codex.equips[it.base] = it.rarity;
    if (it.set) state.codex.sets[it.set] = true;
    if (it.rarity === 5) state.stats.mythicFound++;
  };

  // 入手処理（自動売却・所持上限を考慮）。戻り値 {kept:bool, gold, reason}
  Inv.add = function (state, it, opts) {
    opts = opts || {};
    Inv.registerCodex(state, it);
    var auto = state.settings.autoSell;
    if (!opts.noAutoSell && auto >= 0 && it.rarity <= auto && !it.set) {
      var g = Inv.sellValue(it);
      state.currency.gold = U.safe(state.currency.gold + g);
      return { kept: false, gold: g, reason: 'auto' };
    }
    if (state.items.length >= C.EQUIP.INVENTORY_CAP) {
      var g2 = Inv.sellValue(it);
      state.currency.gold = U.safe(state.currency.gold + g2);
      return { kept: false, gold: g2, reason: 'full' };
    }
    state.items.push(it);
    touch(state);
    return { kept: true, gold: 0 };
  };

  Inv.sell = function (state, uid) {
    var it = Inv.find(state, uid);
    if (!it) return { ok: false, msg: '装備が見つかりません' };
    if (it.locked) return { ok: false, msg: 'ロック中の装備は売却できません' };
    if (Inv.equippedBy(state, uid)) return { ok: false, msg: '装備中の装備は売却できません' };
    var g = Inv.sellValue(it), st = Inv.sellStones(it);
    state.items = state.items.filter(function (x) { return x.uid !== uid; });
    state.currency.gold = U.safe(state.currency.gold + g);
    state.currency.stones += st;
    touch(state);
    return { ok: true, gold: g, stones: st };
  };

  // 一括売却：レアリティ maxRarity 以下、未装備・未ロック。onlySet=false ならセット装備も含む
  Inv.sellableList = function (state, maxRarity, includeSets) {
    var eq = Inv.equippedSet(state);
    return state.items.filter(function (it) {
      return it.rarity <= maxRarity && !it.locked && !eq[it.uid] && (includeSets || !it.set);
    });
  };
  Inv.sellBulk = function (state, maxRarity, includeSets) {
    var list = Inv.sellableList(state, maxRarity, includeSets);
    var gold = 0, stones = 0, ids = {};
    list.forEach(function (it) { gold += Inv.sellValue(it); stones += Inv.sellStones(it); ids[it.uid] = true; });
    state.items = state.items.filter(function (it) { return !ids[it.uid]; });
    state.currency.gold = U.safe(state.currency.gold + gold);
    state.currency.stones += stones;
    touch(state);
    return { count: list.length, gold: gold, stones: stones };
  };

  Inv.toggleLock = function (state, uid) {
    var it = Inv.find(state, uid);
    if (!it) return false;
    it.locked = !it.locked;
    touch(state);
    return it.locked;
  };

  Inv.enhanceCost = function (it) {
    return {
      gold: U.safe(Math.floor(25 * AL.Scale.reward(it.ilvl) * (it.enh + 1) * (1 + it.rarity * 0.5))),
      stones: (it.enh + 1) * (1 + it.rarity)
    };
  };
  Inv.enhance = function (state, uid) {
    var it = Inv.find(state, uid);
    if (!it) return { ok: false, msg: '装備が見つかりません' };
    var R = D.EQUIP_RARITY[it.rarity];

<script>/* js/core/heroes.js */
/* ABYSSAL LEGENDS - 仲間：獲得・重複処理・レベルアップ・限界突破・編成 */
(function (G) {
  'use strict';
  var AL = G.AL = G.AL || {};
  var C = AL.CONFIG, D = AL.DATA, U = AL.U;
  var Heroes = AL.Heroes = {};

  Heroes.expToNext = function (lv) {
    return U.safe(Math.floor(C.HERO.EXP_BASE * Math.pow(C.HERO.EXP_GROWTH, lv - 1) + 8 * lv));
  };

  // 仲間を獲得。重複は限界突破（上限まで）→ 上限後は欠片に変換

    var hd = D.HEROES[id];
    if (!hd) return null;
    state.codex.heroes[id] = true;
    var h = state.heroes[id];
    if (!h) {
      state.heroes[id] = AL.State.newHero();
      state.stats.heroesOwned = Object.keys(state.heroes).length;
      // 編成に空きがあれば自動で加える
      var empty = state.party.indexOf(null);
      if (empty >= 0) { state.party[empty] = id; AL.Events.emit('loadout'); }
      return { id: id, isNew: true, lb: 0, shards: 0 };
    }
    if (h.lb < C.HERO.MAX_LB) {
      h.lb++;
      state.stats.maxLB = Math.max(state.stats.maxLB, h.lb);
      AL.Events.emit('loadout');
      return { id: id, isNew: false, lb: h.lb, shards: 0 };
    }
    var sh = C.HERO.DUPE_SHARDS[hd.rarity];
    state.currency.shards += sh;
    return { id: id, isNew: false, lb: h.lb, shards: sh };
  };

  Heroes.levelUp = function (state, id, n) {
    var h = state.heroes[id];
    if (!h) return 0;
    var cap = AL.Stats.levelCap(state, id), gained = 0;
    n = n || 1;
    while (gained < n && h.lv < cap) {
      var cost = Heroes.expToNext(h.lv);
      if (state.currency.exp < cost) break;
      state.currency.exp -= cost;
      h.lv++; gained++;

    if (gained) AL.Events.emit('loadout');
    return gained;
  };
  Heroes.costFor = function (state, id, n) {
    var h = state.heroes[id], cap = AL.Stats.levelCap(state, id), total = 0, lv = h.lv, k = 0;
    while (k < n && lv < cap) { total += Heroes.expToNext(lv); lv++; k++; }
    return { exp: total, levels: k };
  };

  // 編成中の仲間を、レベルの低い順に自動でレベルアップ
  Heroes.autoLevelParty = function (state) {
    var ids = state.party.filter(Boolean), total = 0, guard = 0;
    while (guard++ < 500) {
      var best = null;
      ids.forEach(function (id) {

        if (!best || h.lv < state.heroes[best].lv) best = id;

      if (!best) break;

  Heroes.shardLbCost = function (id) { return C.HERO.SHARD_LB_COST[D.HEROES[id].rarity]; };

    var h = state.heroes[id];
    if (!h) return { ok: false, msg: '未所持です' };
    if (h.lb >= C.HERO.MAX_LB) return { ok: false, msg: '限界突破は最大です' };
    var cost = Heroes.shardLbCost(id);
    if (state.currency.shards < cost) return { ok: false, msg: '英雄の欠片が足りません' };
    state.currency.shards -= cost;

    return true;

    if (state.party.filter(Boolean).length <= 1) return false;
    state.party[slot] = null;
    AL.Events.emit('loadout');
    return true;
  };

  // おまかせ編成：役割バランス（タンク1・ヒーラー1・残りは戦闘力順）
  Heroes.autoParty = function (state) {
    var ids = Object.keys(state.heroes);
    var power = {};
    ids.forEach(function (id) { power[id] = AL.Stats.hero(state, id).power; });
    var byRole = function (role) { return ids.filter(function (id) { return D.HEROES[id].role === role; }).sort(function (a, b) { return power[b] - power[a]; }); };
    var pick = [];
    var tank = byRole('tank')[0], healer = byRole('healer')[0];
    if (tank) pick.push(tank);
    var rest = ids.filter(function (id) { return id !== tank && id !== healer && D.HEROES[id].role !== 'tank'; })
      .sort(function (a, b) { return power[b] - power[a]; });
    var dps = rest.slice(0, healer ? 3 : 4);
    pick = pick.concat(dps);
    if (healer) pick.push(healer);
    // 不足分を補充
    ids.sort(function (a, b) { return power[b] - power[a]; }).forEach(function (id) { if (pick.length < C.HERO.PARTY_SIZE && pick.indexOf(id) < 0) pick.push(id); });
    // 前衛にタンク・物理を配置
    var order = { tank: 0, phys: 1, support: 2, mage: 3, healer: 4 };
    pick.sort(function (a, b) { return order[D.HEROES[a].role] - order[D.HEROES[b].role]; });
    state.party = [null, null, null, null, null].map(function (_, i) { return pick[i] || null; });
    AL.Events.emit('loadout');
  };

  Heroes.sortedIds = function (state, mode, filter) {
    filter = filter || {};
    var ids = Object.keys(state.heroes).filter(function (id) {
      var hd = D.HEROES[id];
      if (filter.role && hd.role !== filter.role) return false;
      if (filter.element && hd.element !== filter.element) return false;

    var cache = {};
    function pw(id) { return cache[id] || (cache[id] = AL.Stats.hero(state, id).power); }

      power: function (a, b) { return pw(b) - pw(a); },
      rarity: function (a, b) { return D.HEROES[b].rarity - D.HEROES[a].rarity || pw(b) - pw(a); },
      level: function (a, b) { return state.heroes[b].lv - state.heroes[a].lv || pw(b) - pw(a); },
      id: function (a, b) { return a < b ? -1 : 1; }
    };
    return ids.sort(fns[mode] || fns.power);
  };

</script>
<script>/* js/core/gacha.js */
/* ABYSSAL LEGENDS - ガチャ
 * 表示する排出率と抽選は、どちらも rateTable() の同じ表を使います（表示と実処理の一致を保証）。 */
(function (G) {
  'use strict';
  var AL = G.AL = G.AL || {};
  var C = AL.CONFIG, D = AL.DATA, U = AL.U;
  var Gacha = AL.Gacha = {};

  Gacha.currentPickup = function (now) {
    var rot = D.PICKUP_ROTATION;
    if (!rot.length) return null;
    var wk = U.weekIndex(now);
    var p = rot[((wk % rot.length) + rot.length) % rot.length];
    var base = Date.UTC(2024, 0, 1) + (wk + 1) * 7 * 86400000;
    return Object.assign({ type: 'pickup', desc: 'ピックアップ対象の★5・★4の排出率が上昇中！', endsAt: base }, p);
  };

  Gacha.banners = function (now) {
    var list = [Object.assign({}, D.BANNERS.standard)];
    var pu = Gacha.currentPickup(now);
    if (pu) list.push(pu);
    return list;
  };
  Gacha.banner = function (id, now) {
    return Gacha.banners(now).filter(function (b) { return b.id === id; })[0] || null;
  };

  // 排出率表：[{id, rarity, rate, pickup}]。合計は1。
  Gacha.rateTable = function (banner) {
    var out = [];
    [5, 4, 3].forEach(function (r) {
      var share = C.GACHA.RATES[r];
      var pool = D.HERO_LIST.filter(function (h) { return h.rarity === r; }).map(function (h) { return h.id; });
      var pu = banner && banner.type === 'pickup' ? (r === 5 ? banner.pickup : (r === 4 ? banner.pickup4 : null)) : null;
      pu = (pu || []).filter(function (id) { return pool.indexOf(id) >= 0; });
      if (pu.length && pu.length < pool.length) {
        var puShare = share * C.GACHA.PICKUP_SHARE, rest = pool.filter(function (id) { return pu.indexOf(id) < 0; });
        pu.forEach(function (id) { out.push({ id: id, rarity: r, rate: puShare / pu.length, pickup: true }); });
        rest.forEach(function (id) { out.push({ id: id, rarity: r, rate: (share - puShare) / rest.length, pickup: false }); });
      } else {
        pool.forEach(function (id) { out.push({ id: id, rarity: r, rate: share / pool.length, pickup: false }); });
      }
    });
    return out;
  };

  function drawFrom(table) {
    var idx = U.weightedIndex(table.map(function (e) { return e.rate; }));
    return table[idx];
  }

  // 1回分の抽選。pityCount は抽選前の天井カウント。
  Gacha.drawOne = function (banner, pityCount, guarantee4) {
    var table = Gacha.rateTable(banner), entry, byPity = false;
    if (pityCount + 1 >= C.GACHA.PITY) {
      // 天井：★5確定（ピックアップではピックアップ対象から）
      var five = table.filter(function (e) { return e.rarity === 5 && (banner.type !== 'pickup' || e.pickup); });
      if (!five.length) five = table.filter(function (e) { return e.rarity === 5; });
      entry = drawFrom(five.map(function (e) { return { id: e.id, rarity: 5, rate: 1 }; }));
      byPity = true;
    } else {
      entry = drawFrom(table);
      if (guarantee4 && entry.rarity < C.GACHA.TEN_GUARANTEE) {
        // ★4以上確定枠：★4以上の排出率の比率を保ったまま再抽選
        entry = drawFrom(table.filter(function (e) { return e.rarity >= C.GACHA.TEN_GUARANTEE; }));
      }
    }
    return { id: entry.id, rarity: entry.rarity, pity: byPity };
  };

  Gacha.cost = function (count) { return count >= 10 ? C.GACHA.COST_TEN : C.GACHA.COST_SINGLE * count; };

  Gacha.pull = function (state, bannerId, count, now) {
    var banner = Gacha.banner(bannerId, now);
    if (!banner) return { ok: false, msg: 'ガチャが見つかりません' };
    count = count >= 10 ? 10 : 1;
    var cost = Gacha.cost(count);
    if (state.currency.crystals < cost) return { ok: false, msg: '魂晶が足りません（必要: ' + cost + '）' };
    state.currency.crystals -= cost;
    var results = [];
    for (var i = 0; i < count; i++) {
      var pity = state.gacha.pity[banner.type] || 0;
      var guarantee = count === 10 && i === 9 && !results.some(function (r) { return r.rarity >= C.GACHA.TEN_GUARANTEE; });
      var r = Gacha.drawOne(banner, pity, guarantee);
      state.gacha.pity[banner.type] = r.rarity === 5 ? 0 : pity + 1;
      var add = AL.Heroes.add(state, r.id);
      r.isNew = add.isNew; r.lb = add.lb; r.shards = add.shards;
      results.push(r);
      state.gacha.history.unshift({ t: now || Date.now(), id: r.id, rarity: r.rarity, banner: banner.name, pity: r.pity });
    }
    if (state.gacha.history.length > C.GACHA.HISTORY_MAX) state.gacha.history.length = C.GACHA.HISTORY_MAX;

</script>

      stats: {

        def: U.safe(b.def * E * m.def * bm.def * am.def), res: U.safe(b.res * E * m.res * bm.res * am.res),

      abilities: ed.abilities || [], sprite: { kind: 'enemy', id: id, shape: ed.shape, pal: ed.pal, boss: !!ed.isBoss, crown: ed.crown, wings: ed.wings, twin: ed.twin, big: ed.big }

      out.push({ refId: id, name: hd.name, element: hd.element, role: hd.role, stats: st, skill: hd.skill, basic: hd.basic,

  // ================= Runner =================

    this.state = state;
    this.mode = 'tower';      // tower | dungeon
    this.run = null;          // ダンジョン挑戦中の情報
    this.acc = 0;
    this.transition = 0;      // ウェーブ間の移動時間（ゲーム内秒）
    this.gameTime = 0;
    this.session = Runner.newSession();
    this.killLog = [];        // 撃破のゲーム内時刻（放置効率の計測）
    this.lastResult = null;
    this.retryTimer = 0;
    var self = this;
    this.battle = new AL.Battle({
      spawnFactory: function (eid) { return Progress.enemySpec(eid, self.currentFloor(), { affixes: self.run && self.run.affixes }); },
      onDeath: function (u) { self.onDeath(u); }
    });

  AL.Runner = Runner;
  var RP = Runner.prototype;

  RP.currentFloor = function () {
    if (this.mode === 'dungeon' && this.run) return this.run.floor;
    return this.state.tower.floor;
  };

  RP.rebuildAllies = function (keepHp) {
    this.battle.setAllies(Progress.heroSpecs(this.state), keepHp);
  };

  RP.start = function () {
    this.rebuildAllies(false);
    this.startTowerWave();
  };

  RP.startTowerWave = function () {
    var t = this.state.tower;
    if (t.wave >= Progress.wavesFor(t.floor)) t.wave = 0;
    var boss = Progress.isBossFloor(t.floor);
    this.battle.startWave(Progress.makeWave(t.floor, { tower: true }), { timeLimit: boss ? C.BATTLE.BOSS_TIME_LIMIT : 0 });
    this.registerSeen();
    if (boss) this.battle.addLog('第' + t.floor + '層　ボス「' + this.battle.enemies[0].name + '」が現れた！', 'boss');
    AL.Events.emit('wave', { floor: t.floor, wave: t.wave, boss: boss });
  };

  RP.registerSeen = function () {
    var cx = this.state.codex.enemies;
    this.battle.enemies.forEach(function (e) { if (!cx[e.refId]) cx[e.refId] = { kills: 0 }; });
  };

  RP.onDeath = function (u) {
    if (u.side !== 'enemy') return;
    var st = this.state, floor = this.currentFloor();
    st.stats.kills++;
    if (u.isBoss) st.stats.bossKills++;
    var cx = st.codex.enemies[u.refId] || (st.codex.enemies[u.refId] = { kills: 0 });
    cx.kills++;
    this.session.kills++;
    if (u.isBoss) this.session.bosses++;
    if (this.mode === 'tower') this.killLog.push(this.gameTime);
    var r = Progress.killReward(st, u, floor);
    if (this.mode === 'dungeon' && this.run && this.run.type === 'bossrush') r.crystals = 0; // ボスラッシュは終了時にまとめて付与
    Progress.applyReward(st, r, this.session);
    if (this.run) { this.run.gold += r.gold; this.run.exp += r.exp; }
    if (this.mode === 'tower') {
      var drops = Progress.rollDrops(st, u, floor);
      var self = this;
      drops.forEach(function (it) { self.gainItem(it); });
    }
    AL.Events.emit('kill', { unit: u, reward: r });
  };

  RP.gainItem = function (it, noAuto) {
    var res = AL.Inv.add(this.state, it, { noAutoSell: noAuto });
    if (res.kept) {
      this.session.items++;
      if (this.state.settings.autoEquipDrops) {
        var self = this;
        this.state.party.forEach(function (id) { if (id) AL.Inv.autoEquip(self.state, id); });

  // ---- 時間を進める（dt はゲーム内秒：速度倍率適用済み） ----
  RP.update = function (dt) {

    var tick = C.BATTLE.TICK, steps = 0;
    while (this.acc >= tick && steps < 20000) {

  RP.stepOnce = function (tick) {

  RP.onCleared = function () {
    this.battle.status = 'idle';
    if (this.mode === 'dungeon') { this.dungeonWaveCleared(); return; }
    var t = this.state.tower, st = this.state;
    t.wave++;
    var floorDone = t.wave >= Progress.wavesFor(t.floor);
    if (floorDone) {
      t.wave = 0;
      var cleared = t.floor;
      if (t.blockedFloor && cleared >= t.blockedFloor) t.blockedFloor = 0;
      var next = cleared + 1;
      if (next > t.maxFloor) t.maxFloor = next;
      if (next > st.stats.maxFloorEver) st.stats.maxFloorEver = next;
      if (t.blockedFloor && !st.settings.autoBoss) {
        // 自動再挑戦がオフ：手前の階層を周回
      } else if (t.autoAdvance || t.blockedFloor) {
        t.floor = t.blockedFloor ? t.blockedFloor : next;

      this.battle.healAllies(true);
      this.battle.addLog('第' + cleared + '層を突破！', 'floor');
      AL.Events.emit('floor', { cleared: cleared, floor: t.floor });
    } else {
      // ウェーブ間で少し回復
      this.battle.allies.forEach(function (u) { if (u.alive) u.hp = Math.min(u.maxHp, u.hp + u.maxHp * 0.1); });

    this.battle.addLog('第' + failed + '層で敗北…第' + t.floor + '層で態勢を立て直します', 'down');

  // 手動でボス・停滞階層に挑戦

  RP.setAutoAdvance = function (on) {

  RP.gotoFloor = function (f) {

    this.battle.status = 'idle';

  };

  // 放置効率（ゲーム内1分あたりの撃破数）を直近の実績から更新
  RP.measureKpm = function () {
    var now = this.gameTime, win = 180;
    this.killLog = this.killLog.filter(function (t) { return now - t <= win; });
    if (now < 60 || this.killLog.length < 5) return null;
    var span = Math.min(win, now);
    var kpm = this.killLog.length / span * 60;
    var cur = this.state.idle.kpm;

    return this.state.idle.kpm;
  };

  // ================= ダンジョン =================
  Progress.dungeon = function (id) { return D.DUNGEONS.filter(function (d) { return d.id === id; })[0] || null; };
  Progress.dungeonUnlocked = function (state, d) {
    if (!d.unlock) return true;
    if (d.unlock.maxFloor && state.stats.maxFloorEver < d.unlock.maxFloor) return false;
    if (d.unlock.rebirths && state.rebirth.count < d.unlock.rebirths) return false;
    return true;
  };
  Progress.unlockText = function (d) {
    if (!d.unlock) return '';
    var t = [];
    if (d.unlock.maxFloor) t.push('第' + d.unlock.maxFloor + '層到達');
    if (d.unlock.rebirths) t.push('転生' + d.unlock.rebirths + '回');

  };
  Progress.trialAffixes = function (tier) {
    var keys = Object.keys(D.AFFIXES), n = Math.min(3, 1 + Math.floor((tier - 1) / 2)), out = [];
    for (var i = 0; i < n; i++) out.push(keys[(tier * 3 + i * 2) % keys.length]);

  RP.startDungeon = function (id, tier) {

    if (this.mode === 'dungeon') return { ok: false, msg: '他のダンジョンに挑戦中です' };
    if (!Progress.dungeonUnlocked(st, d)) return { ok: false, msg: '解放条件：' + Progress.unlockText(d) };
    var rec = st.dungeons[id];
    tier = Math.max(1, Math.floor(tier || 1));
    if (d.type !== 'bossrush' && tier > rec.maxTier + 1) return { ok: false, msg: '難易度' + (rec.maxTier + 1) + 'までしか選べません' };
    AL.Dungeon.regenTickets(st);
    if (st.currency.tickets < d.ticket) return { ok: false, msg: '挑戦券が足りません' };
    st.currency.tickets -= d.ticket;

    this.mode = 'dungeon';
    this.transition = 0;
    this.battle.status = 'idle';
    this.battle.healAllies(true);
    this.battle.addLog('【' + d.name + '】難易度' + tier + 'に挑戦開始', 'floor');
    this.startDungeonWave();
    AL.Events.emit('dungeonStart', this.run);
    return { ok: true };
  };

  RP.startDungeonWave = function () {
    var r = this.run, opts = {};
    if (!r) { this.mode = 'tower'; this.startTowerWave(); return; }
    var aff = { affixes: r.affixes };
    if (r.affixes.indexOf('cursed') >= 0) opts.startDebuff = D.AFFIXES.cursed.startDebuff;
    var wave;
    if (r.type === 'bossrush') {
      r.floor = 10 * (r.bossCount + 1);
      wave = Progress.makeWave(r.floor, { boss: true, bossId: D.BOSS_ORDER[r.bossCount % D.BOSS_ORDER.length] });
      opts.timeLimit = 60;
    } else if (r.boss && r.wave >= r.totalWaves) {
      wave = Progress.makeWave(r.floor, Object.assign({ boss: true, bossId: D.BOSS_ORDER[(r.tier - 1) % D.BOSS_ORDER.length] }, aff));
      opts.timeLimit = C.BATTLE.BOSS_TIME_LIMIT;
    } else {
      wave = Progress.makeWave(r.floor, aff);
    }
    this.battle.startWave(wave, opts);
    this.registerSeen();
    AL.Events.emit('wave', { dungeon: r.id, wave: r.wave });
  };

  RP.dungeonWaveCleared = function () {
    var r = this.run;
    if (r.type === 'bossrush') {
      r.bossCount++;
      this.battle.allies.forEach(function (u) { if (u.alive) u.hp = Math.min(u.maxHp, u.hp + u.maxHp * 0.3); });
      this.transition = C.BATTLE.WAVE_TRANSITION;
      return;
    }
    r.wave++;
    var total = r.totalWaves + (r.boss ? 1 : 0);
    if (r.wave >= total) { this.finishDungeon(true); return; }
    this.battle.allies.forEach(function (u) { if (u.alive) u.hp = Math.min(u.maxHp, u.hp + u.maxHp * 0.15); });
    this.transition = C.BATTLE.WAVE_TRANSITION;
  };

  RP.finishDungeon = function (win, why) {
    var st = this.state, r = this.run, d = Progress.dungeon(r.id), rec = st.dungeons[r.id], self = this;
    var res = { id: r.id, name: d.name, tier: r.tier, win: win, why: why || null, time: this.gameTime - r.startTime, items: [], crystals: 0, stones: 0, gold: r.gold, exp: r.exp, firstClear: false, record: false };
    var eff = AL.Stats.rebirthEff(st);
    if (r.type === 'bossrush') {
      res.win = r.bossCount > 0;
      res.bossCount = r.bossCount;
      var cr = 0; for (var i = 1; i <= r.bossCount; i++) cr += 5 + i * 2;
      res.crystals = Math.floor(cr * (1 + eff.crystalMul));
      if (r.bossCount > rec.bestCount) { rec.bestCount = r.bossCount; res.record = true; }
      st.stats.rushBest = Math.max(st.stats.rushBest, r.bossCount);
      if (r.bossCount > 0) rec.clears++;
    } else if (win) {
      rec.clears++;
      if (r.tier > rec.maxTier) { rec.maxTier = r.tier; res.firstClear = true; }
      if (!rec.bestTime || res.time < rec.bestTime) { if (rec.bestTime) res.record = true; rec.bestTime = res.time; }
      if (r.type === 'material') {
        res.stones = 8 + 5 * r.tier;
        var g = U.safe(40 * AL.Scale.reward(r.floor) * (1 + eff.goldMul));
        res.gold += g; Progress.applyReward(st, { gold: g, exp: 0 }, this.session);
      } else if (r.type === 'gear' || r.type === 'trial') {
        for (var k = 0; k < d.drops; k++) {
          var it = AL.Inv.generate({ ilvl: r.floor, minRarity: d.minRarity, setSource: d.setSource, forceSet: r.type === 'gear' || U.chance(0.6),
            rarityBonus: r.type === 'trial' ? 1.5 + r.tier * 0.1 : 0.5 });
          res.items.push(it);
          this.gainItem(it, true);
        }
        if (r.type === 'trial' && res.firstClear) res.crystals = Math.floor(80 * r.tier * (1 + eff.crystalMul));
        else if (r.type === 'trial') res.crystals = Math.floor(10 * r.tier * (1 + eff.crystalMul));
      }
    }
    st.currency.crystals = U.safe(st.currency.crystals + res.crystals);
    st.currency.stones += res.stones;
    if (res.win) st.stats.dungeonClears++;
    this.lastResult = res;
    this.run = null;
    this.mode = 'tower';
    st.runInProgress = null;
    this.battle.healAllies(true);
    this.battle.status = 'idle';
    this.battle.addLog('【' + d.name + '】' + (res.win ? '攻略成功！' : '撤退…'), res.win ? 'floor' : 'down');
    this.transition = C.BATTLE.WAVE_TRANSITION;
    AL.Events.emit('dungeonEnd', res);
    void self;
    return res;
  };

  RP.abandonDungeon = function () {
    if (this.mode !== 'dungeon' || !this.run) return null;
    return this.finishDungeon(false, 'abandon');
  };
})(typeof window !== 'undefined' ? window : globalThis);
