    var sk = D.SKILLS[ed.skill];
    UI.modal({ title: '敵図鑑', html: '<div class="row"><img class="px" width="96" height="96" src="' + AL.Sprites.enemyUrl(id) + '" style="transform:scaleX(-1)"><div><b>' + esc(ed.name) + '</b>' + (ed.title ? ' <span class="tiny bad">' + esc(ed.title) + '</span>' : '') + '<div>' + UI.elemTag(ed.element) + '</div>' +
      '<div class="small sub">出現：' + esc(where) + '</div><div class="small">撃破数：' + U.fmt(rec.kills) + '</div></div></div>' +
      '<div class="panel mt"><div class="small">行動傾向：' + ({ brute: '前衛・タンクを狙う', assassin: 'HPの低い相手を狙う', caster: '後衛を狙う', support: '味方を支援する' }[ed.ai]) + '</div>' +
      (sk ? '<div class="small">スキル：' + esc(sk.name) + '</div>' : '') + (ed.abilities && ed.abilities.length ? '<div class="small bad">固有能力：' + ed.abilities.map(function (a) { return a.text || (a.on === 'start' ? '戦闘開始時に' + (D.SKILLS[a.skill] ? D.SKILLS[a.skill].name : '') : ''); }).filter(Boolean).join('／') + '</div>' : '') + '</div>' });
  });

  // ===== 実績・記録 =====
  UI.register({
    id: 'achievements', name: '実績', icon: '績', nav: 'more',
    render: function (el) {
      var st = UI.st();
      var list = D.ACHIEVEMENTS.map(function (a) { return { a: a, s: AL.Achievements.status(st, a) }; });
      list.sort(function (x, y) { return (y.s.done && !y.s.claimed) - (x.s.done && !x.s.claimed) || x.s.claimed - y.s.claimed; });
      var claimable = list.filter(function (x) { return x.s.done && !x.s.claimed; }).length;
      var recs = [['通算最高到達階層', '第' + st.stats.maxFloorEver + '層'], ['ボスラッシュ最高撃破', st.dungeons.rush.bestCount + '体'],
        ['魔晶の坑道 最高難易度', st.dungeons.mine.maxTier], ['封印の宝物殿 最高難易度', st.dungeons.vault.maxTier], ['深淵の試練 最高難易度', st.dungeons.trial.maxTier],
        ['通算撃破数', U.fmt(st.stats.kills)], ['ボス撃破数', U.fmt(st.stats.bossKills)], ['転生回数', st.rebirth.count], ['ガチャ回数', st.gacha.total], ['プレイ時間', U.fmtTime(st.playTime)]];
      el.innerHTML = '<div class="screen-title">実績 <span class="tag">' + list.filter(function (x) { return x.s.claimed; }).length + '/' + list.length + '</span></div>' +
        (claimable ? '<button class="btn gold block mb" data-act="achClaimAll">まとめて受け取る（' + claimable + '件）</button>' : '') +
        list.map(function (x) {
          var a = x.a, s = x.s, p = Math.min(1, s.value / a.target);
          return '<div class="ach' + (s.done ? ' done' : '') + (s.claimed ? ' claimed' : '') + '"><div class="grow"><b>' + esc(a.name) + '</b><div class="tiny sub">' + esc(a.desc) + '　報酬：' + (a.reward.crystals ? '魂晶' + a.reward.crystals : '') + (a.reward.stones ? '強化石' + a.reward.stones : '') + '</div>' +
            '<div class="bar mt"><i style="width:' + (p * 100).toFixed(1) + '%"></i></div><div class="tiny dim num">' + U.fmt(Math.min(s.value, a.target)) + ' / ' + U.fmt(a.target) + '</div></div>' +
            (s.claimed ? '<span class="tiny good">受取済</span>' : '<button class="btn sm gold" data-act="achClaim" data-id="' + a.id + '"' + (s.done ? '' : ' disabled') + '>受取</button>') + '</div>';
        }).join('') +
        '<div class="screen-title mt" style="font-size:15px">自己ベスト <span class="tag">この端末内の記録</span></div><div class="panel">' + recs.map(function (r) { return '<div class="kv"><span>' + r[0] + '</span><b>' + r[1] + '</b></div>'; }).join('') +
        '<div class="tiny dim mt">※ 他のプレイヤーと競うオンラインランキングはサーバーが必要なため未実装です。ここに表示されるのはこの端末に保存された自分の記録のみです。</div></div>';
    }
  });
  UI.listen(['stateReplaced'], ['achievements']);
  UI.action('achClaim', function (el) {
    var r = AL.Achievements.claim(UI.st(), el.dataset.id);
    UI.toast(r.ok ? '報酬を受け取りました' : r.msg, r.ok ? 'good' : 'bad');
    UI.render(); UI.renderCurrency(); UI.updateBadges();
  });
  UI.action('achClaimAll', function () {
    var st = UI.st(), n = 0;
    AL.Achievements.claimable(st).forEach(function (a) { if (AL.Achievements.claim(st, a.id).ok) n++; });
    UI.toast(n + '件の報酬を受け取りました', 'good');
    UI.render(); UI.renderCurrency(); UI.updateBadges();
  });

  // ===== ショップ =====
  UI.register({
    id: 'shop', name: 'ショップ', icon: '店', nav: 'more',
    render: function (el) {
      var st = UI.st();
      AL.Shop.refreshDay(st);
      el.innerHTML = '<div class="screen-title">ショップ <span class="tag">G ' + U.fmt(st.currency.gold) + '・欠片 ' + U.fmt(st.currency.shards) + '</span></div>' +
        D.SHOP.map(function (it) {
          var p = AL.Shop.price(st, it), rem = AL.Shop.remaining(st, it);
          var can = rem > 0 && (!p.gold || st.currency.gold >= p.gold) && (!p.shards || st.currency.shards >= p.shards);
          return '<div class="panel"><div class="row between"><div class="grow"><b>' + esc(it.name) + '</b><div class="small sub">' + esc(it.desc) + '</div>' +
            (it.limit ? '<div class="tiny ' + (rem ? 'sub' : 'bad') + '">本日あと' + rem + '回</div>' : '') + '</div>' +
            '<button class="btn sm ' + (p.shards ? 'primary' : 'gold') + '" data-act="shopBuy" data-id="' + it.id + '"' + (can ? '' : ' disabled') + '>' + (p.gold ? U.fmt(p.gold) + 'G' : '欠片' + p.shards) + '</button></div></div>';
        }).join('') + '<div class="tiny dim">ゴールドの価格は今回の最高到達階層に応じて変動します。購入上限は端末の日付で毎日リセットされます。</div>';
    }
  });
  UI.action('shopBuy', function (el) {
    var r = AL.Shop.buy(UI.st(), el.dataset.id);
    UI.toast(r.ok ? r.msg : r.msg, r.ok ? 'good' : 'bad');
    UI.render(); UI.renderCurrency();
  });

  // ===== 設定・セーブ管理 =====
  UI.register({
    id: 'settings', name: '設定', icon: '設', nav: 'more',
    render: function (el) {
      var st = UI.st(), s = st.settings;
      function tog(key, label, desc) {
        return '<label class="toggle"><span>' + label + (desc ? '<div class="tiny dim">' + desc + '</div>' : '') + '</span><span class="switch"><input type="checkbox" data-change="setToggle" data-k="' + key + '"' + (s[key] ? ' checked' : '') + '><span></span></span></label>';
      }
      el.innerHTML = '<div class="screen-title">設定・セーブ管理</div>' +
        (AL.Storage.available ? '' : '<div class="notice danger">このブラウザではlocalStorageが使えないため、ページを閉じると進行が失われます。書き出し機能でバックアップしてください。</div>') +
        '<div class="panel"><h3>戦闘・表示</h3>' +
        '<div class="row between" style="min-height:48px"><span>戦闘速度</span><div class="seg">' + C.BATTLE.SPEEDS.map(function (v) { return '<button class="' + (s.speed === v ? 'on' : '') + '" data-act="setSpeedS" data-v="' + v + '">×' + v + '</button>'; }).join('') + '</div></div>' +
        '<div class="row between" style="min-height:48px"><span>数値の表記</span><select data-change="setNotation"><option value="jp"' + (s.notation === 'jp' ? ' selected' : '') + '>日本式（万・億・兆）</option><option value="en"' + (s.notation === 'en' ? ' selected' : '') + '>英語式（K・M・B）</option><option value="sci"' + (s.notation === 'sci' ? ' selected' : '') + '>指数表記（1.23e45）</option></select></div>' +
        '<div class="row between" style="min-height:48px"><span>演出の品質</span><div class="seg"><button class="' + (s.effects === 'high' ? 'on' : '') + '" data-act="setFx" data-v="high">高</button><button class="' + (s.effects === 'low' ? 'on' : '') + '" data-act="setFx" data-v="low">低（省電力）</button></div></div>' +
        tog('dmgNumbers', 'ダメージ数値を表示') + tog('showLog', '戦闘ログを記録') + '</div>' +
        '<div class="panel"><h3>自動化</h3>' +
        tog('autoLevel', '自動レベルアップ', '編成中の仲間を経験値で自動成長') +
        tog('autoBoss', '敗北した階層へ自動で再挑戦', '1つ前の階層を1周するごとに再挑戦') +
        tog('autoEquipDrops', '入手時に自動で最適装備', '編成中の仲間に、より強い装備を自動で装着') +
        '<div class="row between" style="min-height:48px"><span>自動売却<div class="tiny dim">セット装備は対象外</div></span><select data-change="setAutoSell"><option value="-1">OFF</option>' + [0, 1, 2, 3].map(function (r) { return '<option value="' + r + '"' + (s.autoSell === r ? ' selected' : '') + '>' + D.EQUIP_RARITY[r].name + '以下</option>'; }).join('') + '</select></div></div>' +
        '<div class="panel"><h3>セーブ</h3><div class="small sub">' + C.AUTOSAVE_SEC + '秒ごと・画面を閉じる時に自動保存しています。<br>最終保存：<span id="last-saved">' + (UI.lastSaved ? new Date(UI.lastSaved).toLocaleTimeString() : '—') + '</span>（データ v' + C.SAVE_VERSION + '）</div>' +
        '<div class="btn-group mt"><button class="btn primary" data-act="saveNow">今すぐ保存</button><button class="btn" data-act="exportSave">書き出し（ファイル）</button><button class="btn" data-act="copySave">書き出し（コピー）</button></div>' +
        '<h3 class="mt">読み込み</h3><div class="small sub">書き出したファイル（.json）またはテキストから復元します。読み込む前に内容を検証し、現在のデータはバックアップとして保持されます。</div>' +
        '<div class="btn-group mt"><label class="btn"><input type="file" accept=".json,application/json,text/plain" data-change="importFile" style="display:none">ファイルを選択</label></div>' +
        '<textarea id="import-text" class="mt" placeholder="ここにセーブデータのテキストを貼り付け"></textarea><button class="btn block mt" data-act="importText">テキストから読み込む</button></div>' +
        '<div class="panel" style="border-color:rgba(255,90,106,0.5)"><h3 class="bad">初期化</h3><div class="small sub">すべての進行を削除して最初から始めます。この操作は取り消せません。</div><button class="btn danger block mt" data-act="resetAll">データを初期化</button></div>' +
        '<div class="panel"><h3>遊び方</h3><div class="small sub">戦闘は自動で進みます。仲間の編成・装備・レベルを整えて、より深い階層を目指しましょう。10階層ごとにボスが出現します。第' + C.REBIRTH.MIN_FLOOR + '層に到達すると転生でき、永続的な強化を得られます。ゲームを閉じていても最大' + C.IDLE.BASE_MAX_HOURS + '時間分の放置報酬が貯まります。</div></div>';
    }
  });
  UI.listen(['stateReplaced'], ['settings']);
  UI.action('setToggle', function (el) {
    UI.st().settings[el.dataset.k] = el.checked;
    if (el.dataset.k === 'showLog') AL.Game.runner.battle.logEnabled = el.checked;
    UI.toast('設定を変更しました');
  });
  UI.action('setSpeedS', function (el) { UI.st().settings.speed = +el.dataset.v; UI.render(); });
  UI.action('setFx', function (el) { UI.st().settings.effects = el.dataset.v; UI.render(); });
  UI.action('setNotation', function (el) { UI.st().settings.notation = el.value; U.notation = el.value; UI.renderCurrency(); UI.toast('表記を変更しました'); });
  UI.action('setAutoSell', function (el) { UI.st().settings.autoSell = +el.value; UI.toast('自動売却：' + (+el.value >= 0 ? D.EQUIP_RARITY[+el.value].name + '以下' : 'OFF')); });
  UI.action('saveNow', function () { var r = AL.Game.save({ backup: true }); UI.toast(r.ok ? '保存しました' : '保存に失敗しました（容量不足の可能性）', r.ok ? 'good' : 'bad'); });
  UI.action('exportSave', function () {
    AL.Game.save();
    var text = AL.Save.exportText(UI.st());
    var d = new Date(), name = 'abyssal_legends_' + d.getFullYear() + ('0' + (d.getMonth() + 1)).slice(-2) + ('0' + d.getDate()).slice(-2) + '_' + ('0' + d.getHours()).slice(-2) + ('0' + d.getMinutes()).slice(-2) + '.json';
    try {
      var blob = new Blob([text], { type: 'application/json' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = name;
      document.body.appendChild(a); a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
      UI.toast('バックアップファイルを書き出しました', 'good');
    } catch (e) { UI.toast('書き出しに失敗しました：' + e.message, 'bad'); }
  });
  UI.action('copySave', function () {
    var text = AL.Save.exportText(UI.st());
    function fallback() { UI.modal({ title: 'セーブデータ（全選択してコピー）', html: '<textarea readonly style="min-height:240px">' + esc(text) + '</textarea>' }); }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function () { UI.toast('クリップボードにコピーしました', 'good'); }, fallback);
    else fallback();
  });
  function tryImport(text) {
    var check = AL.State.parse(text, Date.now());
    if (!check.ok) {
      UI.modal({ title: '読み込みできません', html: '<div class="notice danger">セーブデータの検証に失敗しました。現在のデータは変更されていません。</div><ul class="small">' + check.errors.map(function (e) { return '<li>' + esc(e) + '</li>'; }).join('') + '</ul>' });
      return;
    }
    var s = check.state;
    UI.confirm({
      title: 'セーブデータの上書き', danger: true, ok: '上書きして読み込む',
      html: '<div class="notice">現在のデータを上書きします（現在のデータはバックアップ領域に1つ保存されます）。</div>' +
        '<div class="kv"><span>読み込むデータ</span><b>第' + s.tower.floor + '層・最高' + s.stats.maxFloorEver + '層</b></div><div class="kv"><span>仲間</span><b>' + Object.keys(s.heroes).length + '人</b></div>' +
        '<div class="kv"><span>転生回数</span><b>' + s.rebirth.count + '</b></div><div class="kv"><span>装備</span><b>' + s.items.length + '個</b></div>' +
        (check.warnings.length ? '<div class="tiny sub mt">' + check.warnings.map(esc).join('<br>') + '</div>' : ''),
      onOk: function () {
        var r = AL.Game.importText(text);
        if (r.ok) { UI.toast('セーブデータを読み込みました', 'good'); UI.renderCurrency(); UI.show('battle'); }
        else UI.toast('読み込みに失敗しました', 'bad');
      }
    });
  }
  UI.action('importText', function () {
    var t = (UI.$('#import-text') || {}).value || '';
    if (!t.trim()) { UI.toast('テキストを貼り付けてください', 'bad'); return; }
    tryImport(t.trim());
  });
  UI.action('importFile', function (el) {
    var f = el.files && el.files[0];
    if (!f) return;
    if (f.size > 20 * 1024 * 1024) { UI.toast('ファイルが大きすぎます', 'bad'); return; }
    var rd = new FileReader();
    rd.onload = function () { tryImport(String(rd.result)); el.value = ''; };
    rd.onerror = function () { UI.toast('ファイルを読み込めませんでした', 'bad'); };
    rd.readAsText(f);
  });
  UI.action('resetAll', function () {
    UI.confirm({
      title: 'データの初期化', danger: true, ok: '初期化する',
      html: '<div class="notice danger"><b>すべての進行（仲間・装備・転生・記録）が削除されます。取り消せません。</b></div><div class="small">必要であれば先に「書き出し」でバックアップしてください。</div>',
      check: '全データを削除することを理解しました',
      onOk: function () { AL.Game.resetAll(); UI.toast('初期化しました'); UI.renderCurrency(); UI.show('battle'); }
    });
  });
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>/* js/main.js */
/* ABYSSAL LEGENDS - 起動処理とメインループ */
(function (G) {
  'use strict';
  var AL = G.AL, UI = AL.UI, U = AL.U, D = AL.DATA;
  var lastTick = 0, lastSlow = 0, errCount = 0;

  function loop() {
    var now = Date.now();
    try {
      AL.Game.frame(now);
      AL.Scene.render();
      if (now - lastTick > 120) { lastTick = now; UI.tickBattle(); }
      if (now - lastSlow > 500) { lastSlow = now; UI.renderCurrency(); UI.updateBadges(); }
      errCount = 0;
    } catch (e) {
      errCount++;
      console.error(e);
      if (errCount === 1) UI.toast('エラーが発生しました：' + e.message, 'bad', 5000);
    }
    G.requestAnimationFrame(loop);
  }

  function boot() {
    AL.Game.init();
    UI.lastSaved = Date.now();
    UI.buildBattlePanel();
    document.addEventListener('click', UI.handleClick);
    document.addEventListener('change', UI.handleChange);
    UI.$('#mini-status').addEventListener('click', function () { UI.show('battle'); });
    UI.show('battle');
    UI.renderCurrency();

    // ゲームイベント → 画面
    AL.Events.on('idlePending', function () { setTimeout(UI.showIdle, 50); });
    AL.Events.on('dungeonEnd', function (res) { UI.showDungeonResult(res); UI.refresh(); });
    AL.Events.on('saved', function (r) { UI.lastSaved = Date.now(); var el = UI.$('#last-saved'); if (el) el.textContent = new Date().toLocaleTimeString(); if (!r.ok) UI.toast('保存に失敗しました（ストレージ容量を確認してください）', 'bad'); });
    AL.Events.on('drop', function (d) {
      if (d.kept && d.item.rarity >= 3) UI.toast((d.item.rarity >= 5 ? '★神話級★ ' : '') + D.EQUIP_RARITY[d.item.rarity].name + '「' + AL.Inv.name(d.item) + '」を入手！', 'rare');
      if (d.reason === 'full') UI.toast('所持数上限のため装備を自動売却しました', 'bad');
    });
    AL.Events.on('defeat', function (d) { UI.toast('第' + d.floor + '層で敗北…編成や装備を見直しましょう', 'bad'); });
    AL.Events.on('floor', function (d) { if (AL.Progress.isBossFloor(d.cleared)) UI.toast('ボス撃破！第' + d.cleared + '層を突破', 'good'); if (UI.current === 'battle') UI.refresh(); });
    AL.Events.on('stateReplaced', function () { UI.refresh(); UI.renderCurrency(); });

    // 保存のタイミング
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) AL.Game.save();
      else { AL.Game.frame(Date.now()); if (AL.Game.pendingIdle) UI.showIdle(); }
    });
    G.addEventListener('pagehide', function () { AL.Game.save(); });
    G.addEventListener('beforeunload', function () { AL.Game.save(); });
    // 非表示中（requestAnimationFrame停止中）も時間を進める
    setInterval(function () { if (document.hidden) { try { AL.Game.frame(Date.now()); } catch (e) { console.error(e); } } }, 1000);

    if (AL.Game.loadWarnings.length) {
      UI.modal({ title: 'お知らせ', html: '<ul class="small">' + AL.Game.loadWarnings.map(function (w) { return '<li>' + U.esc(w) + '</li>'; }).join('') + '</ul>' });
    }
    if (AL.Game.pendingIdle) UI.showIdle();
    var ld = document.getElementById('loading'); if (ld) ld.remove();
    G.requestAnimationFrame(loop);
  }

  // ブラウザが出す無害な通知（ResizeObserverのループ、詳細のない他オリジンの「Script error.」）は画面に出さない
  G.addEventListener('error', function (e) {
    var msg = e.message || '';
    if (/ResizeObserver loop/i.test(msg) || (/^Script error\.?$/i.test(msg) && !e.filename)) { console.warn('[ignored]', msg); return; }
    if (UI && UI.toast) UI.toast('エラー：' + (msg || '不明'), 'bad', 5000);
  });
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})(window);

</script>
