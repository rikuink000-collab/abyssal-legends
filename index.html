  // 実績（32件）と実績クエスト（11件）を分類ごとに表示する。受取記録はそれぞれ別のまま（AL.Achievements.claimEntry）。
  var ACH = AL.Achievements;
  function achCat() { var c = ui.achCat; return ACH.CATEGORIES.some(function (x) { return x.id === c; }) ? c : 'main'; }
  function rewardText(r) { return [r.crystals ? '魂晶 ' + U.fmt(r.crystals) : '', r.stones ? '強化石 ' + U.fmt(r.stones) : '', r.gold ? 'ゴールド ' + U.fmt(r.gold) : ''].filter(Boolean).join('・'); }
  // 分類ごとの集計：{main: {total, done, claimed, ready}, ...}
  function achSummary(st) {
    var out = {};
    ACH.CATEGORIES.forEach(function (c) { out[c.id] = { total: 0, done: 0, claimed: 0, ready: 0 }; });
    ACH.entries().forEach(function (e) {
      var s = ACH.entryStatus(st, e), o = out[e.cat];
      o.total++; if (s.done) o.done++; if (s.claimed) o.claimed++; if (s.done && !s.claimed) o.ready++;
    });
    return out;
  }
  function achTabHtml(c, o) {
    // 2段目に「受取済み/全件」と、受け取れる件数のバッジ（名前に重ならないよう同じ段に置く）
    return '<span class="at-name">' + c.name + '</span><span class="at-sub num">' + o.claimed + '/' + o.total + (o.ready ? '<span class="badge at-badge">' + o.ready + '</span>' : '') + '</span>';
  }
  function achAllText(n) { return 'まとめて受け取る（' + n + '件）'; }

      ACH.CATEGORIES.forEach(function (c) { tot.total += sum[c.id].total; tot.claimed += sum[c.id].claimed; tot.ready += sum[c.id].ready; });
      var recs = [['通算最高到達階層', '第' + st.stats.maxFloorEver + '層'], ['ボスラッシュ最高撃破', st.dungeons.rush.bestCount + '体'],

        }).join('') + '</div>' +

        list.map(function (e) {
          return UI.goalRow({ keyAttr: 'goal', key: e.key, name: e.name, sub: e.desc, reward: rewardText(e.reward),
            claimAttrs: 'data-act="achClaim" data-src="' + e.src + '" data-id="' + e.id + '"' }, ACH.entryStatus(st, e));
        }).join('') +
        '<div class="screen-title mt" style="font-size:15px">自己ベスト <span class="tag">この端末内の記録</span></div><div class="panel">' + recs.map(function (r) { return '<div class="kv"><span>' + r[0] + '</span><b>' + r[1] + '</b></div>'; }).join('') +

  // 実績画面を開いているあいだ、進捗・状態・件数だけを書き換える（要素は作り直さない）。
  // 受取済みの状態が変わったときだけ画面を作り直す。
  UI.achScreenTick = function () {
    var el = UI.$('#screen'), st = UI.st();
    if (UI.current !== 'achievements' || !el || !st || UI.dirty) return;
    var cat = achCat(), list = ACH.entries().filter(function (e) { return e.cat === cat; });
    var rows = el.querySelectorAll('.quest[data-goal]'), stats = [];
    if (rows.length !== list.length) return UI.render();
    for (var i = 0; i < list.length; i++) {
      var s = ACH.entryStatus(st, list[i]);
      if (rows[i].dataset.goal !== list[i].key || s.claimed !== rows[i].classList.contains('claimed')) return UI.render();
      stats.push(s);
    }
    stats.forEach(function (s, i) { UI.goalRowUpdate(rows[i], s); });
    var sum = achSummary(st), cur = sum[cat], ready = 0;
    ACH.CATEGORIES.forEach(function (c) { ready += sum[c.id].ready; });
    el.querySelectorAll('.ach-tabs [data-act="achTab"]').forEach(function (b) {
      var c = ACH.CATEGORIES.filter(function (x) { return x.id === b.dataset.id; })[0], h = c && achTabHtml(c, sum[c.id]);
      if (c && b._h !== h) { b.innerHTML = h; b._h = h; }
    });
    var t = el.querySelector('.ach-sum-t'), tt = '達成 ' + cur.done + '/' + cur.total + '・受取済み ' + cur.claimed + '/' + cur.total;
    if (t && t.textContent !== tt) t.textContent = tt;
    var bar = el.querySelector('.ach-sum .bar i'), w = (cur.total ? cur.done / cur.total * 100 : 0).toFixed(1) + '%';
    if (bar && parseFloat(bar.style.width) !== parseFloat(w)) bar.style.width = w;
    var all = el.querySelector('.q-all');
    if (all) {
      var disp = cur.ready ? '' : 'none', txt = achAllText(cur.ready);
      if (all.style.display !== disp) all.style.display = disp;
      if (all.textContent !== txt) all.textContent = txt;
    }
    var note = el.querySelector('.ach-ready'), nt = '受け取れる報酬があります（' + ready + '件）';
    if (note) { var nd = ready ? '' : 'none'; if (note.style.display !== nd) note.style.display = nd; if (note.textContent !== nt) note.textContent = nt; }
  };

          : '<b>手動保存（バックアップ作成）を停止しています。</b>読み込めなかったバックアップ領域のデータを別名で退避できなかったため、バックアップの上書きを止めています。自動保存は続いています。') +
          'ストレージの空きを増やしてから「退避を再試行」を押してください。退避に成功すると再開します。</div>' +
          '<div class="btn-group mt"><button class="btn primary" data-act="retryProtect">退避を再試行</button><button class="btn" data-act="copyProtected">元データを書き出す（コピー）</button></div>' : '') +
        '<div class="btn-group mt"><button class="btn primary" data-act="saveNow">今すぐ保存</button><button class="btn" data-act="exportSave">書き出し（ファイル）</button><button class="btn" data-act="copySave">書き出し（コピー）</button></div>' +
        '<h3 class="mt">読み込み</h3><div class="small sub">書き出したファイル（.json）またはテキストから復元します。読み込む前に内容を検証し、現在のデータはバックアップとして保持されます。</div>' +
        '<div class="btn-group mt"><label class="btn"><input type="file" accept=".json,application/json,text/plain" data-change="importFile" style="display:none">ファイルを選択</label></div>' +
        '<textarea id="import-text" class="mt" placeholder="ここにセーブデータのテキストを貼り付け"></textarea><button class="btn block mt" data-act="importText">テキストから読み込む</button></div>' +
        '<div class="panel" style="border-color:rgba(255,90,106,0.5)"><h3 class="bad">初期化</h3><div class="small sub">すべての進行を削除して最初から始めます。この操作は取り消せません。</div><button class="btn danger block mt" data-act="resetAll">データを初期化</button></div>' +
        '<div class="panel"><h3>遊び方</h3><div class="small sub">戦闘は自動で進みます。仲間の編成・装備・レベルを整えて、より深い階層を目指しましょう。10階層ごとにボスが出現します。第' + C.REBIRTH.MIN_FLOOR + '層に到達すると転生でき、永続的な強化を得られます。ゲームを閉じていても最大' + C.IDLE.BASE_MAX_HOURS + '時間分の放置報酬が貯まります。</div></div>';
    }
  });
  UI.listen(['stateReplaced'], ['settings']);
  UI.action('setToggle', function (el) {
    UI.st().settings[el.dataset.k] = el.checked;
    if (el.dataset.k === 'showLog') AL.Game.runner.battle.logEnabled = el.checked;
    UI.toast('設定を変更しました');
  });
  UI.action('setSpeedS', function (el) { UI.st().settings.speed = +el.dataset.v; UI.render(); });
  UI.action('setFx', function (el) { UI.st().settings.effects = el.dataset.v; UI.render(); });
  UI.action('setNotation', function (el) { UI.st().settings.notation = el.value; U.notation = el.value; UI.renderCurrency(); UI.toast('表記を変更しました'); });
  UI.action('setAutoSell', function (el) { UI.st().settings.autoSell = +el.value; UI.toast('自動売却：' + (+el.value >= 0 ? D.EQUIP_RARITY[+el.value].name + '以下' : 'OFF')); });
  UI.action('saveNow', function () {
    var r = AL.Game.save({ backup: true });
    var msg = r.ok ? '保存しました'
      : r.reason === 'protected' ? '読み込めなかった元データを保護中のため、保存していません'
      : r.reason === 'backup_protected' ? 'バックアップ領域の元データを保護中のため、手動保存（バックアップ作成）を停止しています'
      : r.reason === 'backup_failed' ? 'バックアップを作成できなかったため、保存を中止しました（容量不足の可能性）'
      : '保存に失敗しました（容量不足の可能性）';
    UI.toast(msg, r.ok ? 'good' : 'bad');
  });
  UI.action('retryProtect', function () {
    var r = AL.Save.retryProtected(Date.now());
    if (r.ok) {
      var s = AL.Game.save();
      UI.toast(s.ok ? '元データを別名で退避しました。保存を再開します' : '元データを退避しましたが、保存に失敗しました', s.ok ? 'good' : 'bad', 5000);
    } else {
      UI.toast('退避できませんでした（' + r.results.filter(function (x) { return !x.ok; }).map(function (x) { return AL.Save.REASONS[x.reason] || x.reason; }).join('、') + '）', 'bad', 5000);
    }
    UI.render();
  });
  UI.action('copyProtected', function () {
    var text = Object.keys(AL.Save.guards).map(function (k) { return AL.Save.guards[k]; }).join('\n\n');
    UI.modal({ title: '読み込めなかった元データ（全選択してコピー）', html: '<div class="small sub">書き出しても保護は解除されません。保護の解除には「退避を再試行」の成功が必要です。</div><textarea readonly style="min-height:240px">' + esc(text) + '</textarea>' });
  });
  UI.action('exportSave', function () {
    AL.Game.save();
    var text = AL.Save.exportText(UI.st());
    var d = new Date(), name = 'abyssal_legends_' + d.getFullYear() + ('0' + (d.getMonth() + 1)).slice(-2) + ('0' + d.getDate()).slice(-2) + '_' + ('0' + d.getHours()).slice(-2) + ('0' + d.getMinutes()).slice(-2) + '.json';
    try {
      var blob = new Blob([text], { type: 'application/json' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = name;
      document.body.appendChild(a); a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
      UI.toast('バックアップファイルを書き出しました', 'good');
    } catch (e) { UI.toast('書き出しに失敗しました：' + e.message, 'bad'); }
  });
  UI.action('copySave', function () {
    var text = AL.Save.exportText(UI.st());
    function fallback() { UI.modal({ title: 'セーブデータ（全選択してコピー）', html: '<textarea readonly style="min-height:240px">' + esc(text) + '</textarea>' }); }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function () { UI.toast('クリップボードにコピーしました', 'good'); }, fallback);
    else fallback();
  });
  function tryImport(text) {
    var check = AL.State.parse(text, Date.now());
    if (!check.ok) {
      UI.modal({ title: '読み込みできません', html: '<div class="notice danger">セーブデータの検証に失敗しました。現在のデータは変更されていません。</div><ul class="small">' + check.errors.map(function (e) { return '<li>' + esc(e) + '</li>'; }).join('') + '</ul>' });
      return;
    }
    var s = check.state;
    UI.confirm({
      title: 'セーブデータの上書き', danger: true, ok: '上書きして読み込む',
      html: '<div class="notice">現在のデータを上書きします（現在のデータはバックアップ領域に1つ保存されます）。</div>' +
        '<div class="kv"><span>読み込むデータ</span><b>第' + s.tower.floor + '層・最高' + s.stats.maxFloorEver + '層</b></div><div class="kv"><span>仲間</span><b>' + Object.keys(s.heroes).length + '人</b></div>' +
        '<div class="kv"><span>転生回数</span><b>' + s.rebirth.count + '</b></div><div class="kv"><span>装備</span><b>' + s.items.length + '個</b></div>' +
        (check.warnings.length ? '<div class="tiny sub mt">' + check.warnings.map(esc).join('<br>') + '</div>' : ''),
      onOk: function () {
        var r = AL.Game.importText(text);
        if (r.ok) { UI.toast('セーブデータを読み込みました', 'good'); UI.renderCurrency(); UI.show('battle'); }
        else UI.toast((r.errors && r.errors[0]) || '読み込みに失敗しました', 'bad', 5000);
      }
    });
  }
  UI.action('importText', function () {
    var t = (UI.$('#import-text') || {}).value || '';
    if (!t.trim()) { UI.toast('テキストを貼り付けてください', 'bad'); return; }
    tryImport(t.trim());
  });
  UI.action('importFile', function (el) {
    var f = el.files && el.files[0];
    if (!f) return;
    if (f.size > 20 * 1024 * 1024) { UI.toast('ファイルが大きすぎます', 'bad'); return; }
    var rd = new FileReader();
    rd.onload = function () { tryImport(String(rd.result)); el.value = ''; };
    rd.onerror = function () { UI.toast('ファイルを読み込めませんでした', 'bad'); };
    rd.readAsText(f);
  });
  UI.action('resetAll', function () {
    UI.confirm({
      title: 'データの初期化', danger: true, ok: '初期化する',
      html: '<div class="notice danger"><b>すべての進行（仲間・装備・転生・記録）が削除されます。取り消せません。</b></div><div class="small">必要であれば先に「書き出し」でバックアップしてください。</div>',
      check: '全データを削除することを理解しました',
      onOk: function () {
        var r = AL.Game.resetAll();
        if (!r.ok) { UI.toast(r.msg, 'bad', 5000); return; }
        UI.toast('初期化しました'); UI.renderCurrency(); UI.show('battle');
      }
    });
  });
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>/* js/ui/quests.js */
/* ABYSSAL LEGENDS - クエスト画面と、バトル画面の「次の目標」 */
(function (G) {
  'use strict';
  var AL = G.AL, UI = AL.UI, C = AL.CONFIG, D = AL.DATA, U = AL.U, esc = U.esc;
  var Q = AL.Quests, ui = UI.ui;
  var TABS = [['main', 'メイン'], ['daily', 'デイリー']];   // 実績クエストは「実績」画面に表示する

  // 1件分の表示内容。状態は「未達成」「達成（受取可）」「受取済み」「未解放（メインの先のクエスト）」の4つ
  function view(s) {
    return {
      width: (Math.min(1, s.target ? s.value / s.target : 0) * 100).toFixed(1) + '%',
      prog: U.fmt(Math.min(s.value, s.target)) + '/' + U.fmt(s.target),
      label: s.claimed ? ['got', '受取済み'] : s.locked ? ['todo', '未解放'] : s.done ? ['ready', '達成'] : ['todo', '未達成'],
      ready: s.done && !s.claimed && !s.locked
    };
  }
  // 目標1件の行（クエスト画面・実績画面で共用）。o: {keyAttr, key, name, sub, reward, claimAttrs}
  UI.goalRow = function (o, s) {
    var v = view(s);
    var act = s.claimed ? '' : '<button class="btn sm gold q-act" ' + o.claimAttrs + (v.ready ? '' : ' disabled') + '>受取</button>';
    return '<div class="ach quest' + (v.ready ? ' done' : '') + (s.claimed ? ' claimed' : '') + (s.locked ? ' locked' : '') + '" data-' + o.keyAttr + '="' + o.key + '">' +
      '<div class="grow"><div class="row"><b class="grow">' + esc(o.name) + '</b><span class="q-state ' + v.label[0] + '">' + v.label[1] + '</span></div>' +
      (o.sub ? '<div class="tiny sub">' + esc(o.sub) + '</div>' : '') +
      '<div class="tiny sub">報酬：' + o.reward + '</div>' +
      '<div class="bar mt"><i style="width:' + v.width + '"></i></div><div class="tiny dim num q-prog">' + v.prog + '</div></div>' + act + '</div>';
  };
  // 描画済みの行の進捗・状態・受取ボタンだけを書き換える（要素は作り直さない）
  UI.goalRowUpdate = function (r, s) {
    var v = view(s), bar = r.querySelector('.bar i'), prog = r.querySelector('.q-prog'), lab = r.querySelector('.q-state'), btn = r.querySelector('.q-act');
    if (bar && parseFloat(bar.style.width) !== parseFloat(v.width)) bar.style.width = v.width;
    if (prog && prog.textContent !== v.prog) prog.textContent = v.prog;
    if (lab && lab.textContent !== v.label[1]) { lab.className = 'q-state ' + v.label[0]; lab.textContent = v.label[1]; }
    r.classList.toggle('done', v.ready);
    r.classList.toggle('locked', !!s.locked);
    if (btn && btn.disabled !== !v.ready) btn.disabled = !v.ready;
  };
  function row(kind, q, s) {
    return UI.goalRow({ keyAttr: 'quest', key: q.id, name: q.name, reward: '魂晶 ' + q.reward.crystals,
      claimAttrs: 'data-act="questClaim" data-kind="' + kind + '" data-id="' + q.id + '"' }, s);
  }
  // タブに表示するクエスト（表示順）
  function items(tab) {
    if (tab === 'daily') return D.QUESTS.daily.map(function (q) { return { kind: 'daily', q: q }; }).concat([{ kind: 'dailyBonus', q: D.QUESTS.dailyBonus }]);
    return D.QUESTS.main.map(function (q) { return { kind: 'main', q: q }; });
  }
  function curTab() { return ui.questTab === 'daily' ? 'daily' : 'main'; }
  // 受け取れる件数（メイン・デイリー）。実績クエストは実績画面で数える
  function counts(st) {
    var c = { main: 0, daily: 0 };
    Q.claimable(st).forEach(function (x) { if (x.kind !== 'ach') c[x.kind === 'dailyBonus' ? 'daily' : x.kind]++; });
    return c;
  }
  UI.questClaimableCount = function (st) { var c = counts(st); return c.main + c.daily; };
  function tabText(t, n) { return t[1] + (n ? '（' + n + '）' : ''); }
  function claimAllText(n) { return 'まとめて受け取る（' + n + '件）'; }

  UI.register({
    id: 'quests', name: 'クエスト', icon: '📜', nav: 'main',
    render: function (el) {
      var st = UI.st();
      Q.refreshDay(st, Date.now());
      var tab = curTab(), c = counts(st);
      var html = '<div class="screen-title">クエスト</div><div class="tabs">' + TABS.map(function (t) {
        return '<button class="' + (t[0] === tab ? 'on' : '') + '" data-act="questTab" data-id="' + t[0] + '">' + tabText(t, c[t[0]]) + '</button>';
      }).join('') + '</div>';
      // まとめて受け取るボタンは常に置き、受け取れるものがないときは隠す（戦闘中の更新でボタンを作り直さないため）
      html += '<button class="btn gold block mb q-all" data-act="questClaimAll" data-kind="' + tab + '"' + (c[tab] ? '' : ' style="display:none"') + '>' + claimAllText(c[tab]) + '</button>';
      if (tab === 'main') {
        var cur = Q.mainCurrent(st), done = D.QUESTS.main.filter(function (q) { return st.quests.main.claimed[q.id]; }).length;
        html += '<div class="tiny sub mb">順番に進むクエストです。報酬を受け取ると次のクエストが始まります。（' + done + '/' + D.QUESTS.main.length + '）</div>' +
          (cur ? '' : '<div class="notice info">メインクエストをすべて達成しました。</div>');
      } else {
        html += '<div class="tiny sub mb">毎日0時（この端末の時刻）に進捗と受け取りが戻ります。今日の開始時点からの記録で数えます。</div>';
      }
      // 実績クエストは実績画面へ移したので、そこへの導線を置く
      if (AL.Guide.unlocked(st, 'achievements')) html += '<div class="row between mb"><span class="tiny sub">長期の目標（実績クエスト）は実績画面にあります</span><button class="btn sm" data-act="nav" data-id="achievements">🏆 実績を見る</button></div>';
      html += items(tab).map(function (x) { return row(x.kind, x.q, Q.status(st, x.kind, x.q)); }).join('');
      el.innerHTML = html;
    }
  });
  // 討伐・階層・育成による進捗は UI.questScreenTick で数値とバーだけを更新する（画面全体は作り直さない）
  UI.listen(['rebirth', 'questClaim', 'stateReplaced'], ['quests']);

  // クエスト画面を開いているあいだ、進捗の数値・バー・状態の表示だけを書き換える。
  // ボタンなどの要素は作り直さない。受取済みの状態が変わったとき（日付の切り替え）だけ画面を作り直す。
  UI.questScreenTick = function () {
    var el = UI.$('#screen'), st = UI.st();
    if (UI.current !== 'quests' || !el || !st || UI.dirty) return;
    Q.refreshDay(st, Date.now());
    var tab = curTab(), list = items(tab), rows = el.querySelectorAll('.quest[data-quest]'), stats = [];
    if (rows.length !== list.length) return UI.render();
    for (var i = 0; i < list.length; i++) {
      var s = Q.status(st, list[i].kind, list[i].q);
      if (rows[i].dataset.quest !== list[i].q.id || !!s.claimed !== rows[i].classList.contains('claimed')) return UI.render();
      stats.push(s);
    }
    stats.forEach(function (s, i) { UI.goalRowUpdate(rows[i], s); });
    var c = counts(st);
    el.querySelectorAll('.tabs [data-act="questTab"]').forEach(function (b) {
      var t = TABS.filter(function (x) { return x[0] === b.dataset.id; })[0], txt = t && tabText(t, c[t[0]]);
      if (t && b.textContent !== txt) b.textContent = txt;
    });
    var all = el.querySelector('.q-all');
    if (all) {
      var disp = c[tab] ? '' : 'none', txt = claimAllText(c[tab]);
      if (all.style.display !== disp) all.style.display = disp;
      if (all.textContent !== txt) all.textContent = txt;
    }
  };

  UI.action('questTab', function (el) { ui.questTab = el.dataset.id; UI.render(); });
  UI.action('questClaim', function (el) {
    var r = Q.claim(UI.st(), el.dataset.kind, el.dataset.id, Date.now());
    if (r.ok) AL.Game.save();
    UI.toast(r.ok ? '魂晶を' + r.reward.crystals + '個受け取りました' : r.msg, r.ok ? 'good' : 'bad');
    UI.render(); UI.renderCurrency(); UI.updateBadges(); UI.questTick(true);
  });
  UI.action('questClaimAll', function (el) {
    var r = Q.claimAll(UI.st(), el.dataset.kind, Date.now());
    if (r.count) AL.Game.save();
    UI.toast(r.count ? r.count + '件・魂晶' + r.crystals + '個を受け取りました' : '受け取れるクエストはありません', r.count ? 'good' : 'bad');
    UI.render(); UI.renderCurrency(); UI.updateBadges(); UI.questTick(true);
  });

  // バトル画面の上部に、次に進めるメインクエストを表示する。
  // 進捗が変わっただけなら数値だけを書き換え、ボタンは作り直さない。
  UI.questTick = function (force) {
    var box = UI.$('#bs-quest'), st = UI.st();
    if (!box || !st) return;
    var cur = AL.Guide.unlocked(st, 'quests') ? Q.mainCurrent(st) : null;
    var s = cur && Q.status(st, 'main', cur);
    var key = cur ? cur.id + (s.done ? ':done' : ':todo') : '';
    var prog = cur ? U.fmt(Math.min(s.value, s.target)) + '/' + U.fmt(s.target) + '　報酬：魂晶 ' + cur.reward.crystals : '';
    if (force || box._k !== key) {
      box.innerHTML = cur ? '<div class="panel quest-next"><div class="row between"><div class="grow"><div class="tiny sub">次の目標（メインクエスト）</div><div class="q-name">' + esc(cur.name) + '</div>' +
        '<div class="tiny num q-prog">' + prog + '</div></div>' +
        (s.done ? '<button class="btn sm gold" data-act="questClaim" data-kind="main" data-id="' + cur.id + '">受取</button>'
          : '<button class="btn sm" data-act="nav" data-id="quests">クエスト</button>') + '</div></div>' : '';
      box._k = key;
      return;
    }
    var p = box.querySelector('.q-prog');
    if (p && p.textContent !== prog) p.textContent = prog;
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>/* js/ui/guide.js */
/* ABYSSAL LEGENDS - はじめての冒険の画面（タイトル・初回召喚・はじめての戦い・育成の案内・機能の解放） */
(function (G) {
  'use strict';
  var AL = G.AL, UI = AL.UI, C = AL.CONFIG, D = AL.DATA, U = AL.U, esc = U.esc;
  var Guide = AL.Guide;

  // 機能が解放されたときの短い説明（heroes・equip は案内バーで説明する）
  var INTRO = {
    gacha: '魂晶を使って、新しい仲間を召喚できます。',
    party: '戦う5人と並び順（前衛・後衛）を入れ替えられます。',
    achievements: '長期の目標（メイン実績・育成実績・累計実績）を確認し、達成すると魂晶などの報酬を受け取れます。',
    quests: '次に進める目標（メイン）と毎日の目標（デイリー）を確認し、達成すると魂晶を受け取れます。',
    codex: '出会った仲間・敵・装備を確認できます。',
    shop: 'ゴールドで強化石・魂晶・挑戦券などと交換できます。',
    dungeon: '挑戦券を使って特別な戦いに挑み、強化石や装備をたくさん手に入れます。',
    rebirth: '塔をやり直す代わりに転生ポイントを得て、永続的な強化を買えます。'
  };
  // 育成の案内（一度に1つずつ、その機能を使う場面で表示する）
  var HINTS = {
    summon: { text: '仲間を召喚して、冒険を始めましょう。', btn: '召喚する', act: 'guideSummon' },
    battle: { text: '仲間は自動で戦います。訓練場の魔物をすべて倒しましょう。' },
    heroes: { text: '【育成】仲間画面が解放されました。仲間は経験値で自動でレベルアップします。仲間を選ぶと能力やスキルを確認できます。', btn: '仲間画面へ', act: 'nav', id: 'heroes' },
    equip: { text: '【装備】手に入れた武器を装備しましょう。装備画面の「編成全員を最適装備」で、強い装備を自動でつけられます。', btn: '装備画面へ', act: 'nav', id: 'equip' },
    enhance: { text: '【強化】装備を選んで「強化」すると、強化石とゴールドで強くなります。1回強化してみましょう。', btn: '装備画面へ', act: 'nav', id: 'equip' }
  };

  UI.lockText = function (id) {
    var f = Guide.feature(id);
    if (!f) return '';
    if (!Guide.reached(UI.st(), f.step)) return 'はじめての冒険を進めると解放されます';
    return '第' + f.floor + '層に到達すると解放されます';
  };

  // ---- タイトル画面 ----
  UI.showTitle = function () {
    var st = UI.st(), isNew = Guide.isNewGame(st);
    var old = document.getElementById('title-screen'); if (old) old.remove();
    AL.Game.paused = true;
    UI.titleOpen = true;
    UI.titleWarnShown = AL.Game.loadWarnings.length;   // タイトル画面で表示したお知らせの件数（開始後に同じものを出さないため）
    var el = document.createElement('div');
    el.id = 'title-screen';
    el.innerHTML = '<div class="t-logo">ABYSSAL<br>LEGENDS</div><div class="t-sub">INFINITE ABYSS</div>' +
      '<div class="t-btns"><button class="btn primary" data-title="new"' + (isNew ? '' : ' disabled') + '>NEW GAME</button>' +
      '<button class="btn" data-title="continue"' + (isNew ? ' disabled' : '') + '>CONTINUE</button></div>' +
      // 読み込み時のお知らせ（セーブを読み込めなかった・バックアップから復元した等）は、始める前にここで知らせる
      (AL.Game.loadWarnings.length ? '<div class="notice t-warn" role="alert"><b>お知らせ</b><ul>' +
        AL.Game.loadWarnings.map(function (w) { return '<li>' + esc(w) + '</li>'; }).join('') + '</ul></div>' : '') +
      '<div class="t-note tiny sub">' + (isNew ? '深淵の塔の頂を目指す、放置型の冒険が始まります。'
        : 'この端末のセーブデータから続きを遊べます。最初からやり直すときは、設定画面の「データの初期化」を使ってください。') + '</div>' +
      '<div class="tiny dim">v' + C.GAME_VERSION + '</div>';
    el.addEventListener('click', function (e) {
      var b = e.target.closest('[data-title]');
      if (!b || b.disabled) return;
      if (b.dataset.title === 'new') { Guide.begin(UI.st()); AL.Game.save(); }
      UI.startGame();
    });
    document.body.appendChild(el);
  };
  UI.startGame = function () {
    var el = document.getElementById('title-screen'); if (el) el.remove();
    UI.titleOpen = false;
    AL.Game.paused = false;
    AL.Game.lastReal = Date.now();
    UI.renderNav();
    if (!AL.Guide.unlocked(UI.st(), UI.current)) UI.show('battle');
    // タイトル画面で表示したお知らせは繰り返さず、タイトル画面の表示後に加わったものだけを表示する
    var rest = AL.Game.loadWarnings.slice(UI.titleWarnShown || 0);
    if (rest.length) UI.modal({ title: 'お知らせ', html: '<ul class="small">' + rest.map(function (w) { return '<li>' + esc(w) + '</li>'; }).join('') + '</ul>' });
    AL.Game.loadWarnings = [];
    UI.titleWarnShown = 0;
    if (AL.Game.pendingIdle) UI.showIdle();
    UI.guideFlow();
  };

  // ---- 導入の段階ごとの画面 ----
  UI.guideFlow = function () {
    var st = UI.st();
    if (st.guide.step === 'summon') UI.showSummonIntro();
    else if (st.guide.step === 'battle') { AL.Game.resumeGuide(); UI.show('battle'); UI.showBattleIntro(); }
    UI.guideRefresh();
  };

  UI.showSummonIntro = function () {
    if (UI.topModal('guideSummon')) return;
    AL.Game.paused = true;            // 召喚するまで塔の戦闘を進めない（はじめての戦いから始めるため）
    UI.modal({
      id: 'guideSummon', title: 'はじめての召喚', persistent: true,
      html: '<div class="small">深淵の塔に挑む冒険者たち。まずは、ともに戦う仲間を呼びましょう。</div>' +
        '<div class="notice info mt small">はじめての召喚は無料です。<b>★4の仲間が必ず1人</b>加わり、そのまま編成に入ります。</div>',
      buttons: [{ label: 'スキップ', cls: 'ghost', onClick: function () { UI.confirmSkipGuide(); } },
        { label: '仲間を召喚する', cls: 'primary', onClick: function () { UI.doFirstSummon(); } }]
    });
  };
  UI.doFirstSummon = function () {
    UI.closeModal('guideSummon');
    var r = Guide.firstSummon(UI.st(), Date.now());
    if (!r.ok) { UI.guideFlow(); return; }
    AL.Game.save();
    UI.renderCurrency();
    UI.gachaAnim(r.results, function () { UI.guideFlow(); });
  };

  UI.showBattleIntro = function () {
    if (UI.topModal('guideBattle')) return;
    var st = UI.st();
    AL.Game.paused = true;
    UI.modal({
      id: 'guideBattle', title: 'はじめての戦い',
      html: (st.heroes[C.GUIDE.FIRST_HERO] ? '<div class="small good">' + esc(D.HEROES[C.GUIDE.FIRST_HERO].name) + 'が仲間になり、5人で戦います。</div>' : '') +
        '<ul class="small guide-list">' +
        '<li>仲間は<b>自動で戦います</b>。上の画面で戦いの様子、下の「戦闘中の敵」で敵の残りHPを確認できます。</li>' +
        '<li>仲間のカードの<b class="good">緑のバーがHP</b>、<b style="color:#4ab0ff">青のバーがスキル</b>です。青がたまると、スキルを自動で使います。</li>' +
        '<li>「×2」などのボタンで、戦いの速さを変えられます。</li></ul>',
      buttons: [{ label: '戦闘開始', cls: 'primary' }],
      onClose: function () { AL.Game.paused = false; AL.Game.lastReal = Date.now(); }
    });
  };

  UI.showTutorialEnd = function (r) {
    if (!r || !r.ok) return;
    AL.Game.save();
    UI.renderCurrency(); UI.renderNav();
    UI.modal({
      id: 'guideWin', title: '勝利！',
      html: '<div class="small">はじめての戦いに勝利しました。倒した敵からは、ゴールドや経験値、装備が手に入ります。</div>' +
        '<div class="reward-list mt"><div>ゴールド<b>+' + U.fmt(r.gold) + '</b></div><div>経験値<b>+' + U.fmt(r.exp) + '</b></div>' +
        '<div>装備<b>' + esc(AL.Inv.name(r.item)) + '</b></div></div>' +
        '<div class="small mt">ここからは無限の深淵塔を自動で登っていきます。仲間を育てて、より深い階層を目指しましょう。</div>',
      buttons: [{ label: '仲間画面へ', cls: 'primary', onClick: function () { UI.show('heroes'); } }]
    });
  };

  UI.confirmSkipGuide = function () {
    UI.confirm({ title: '案内をスキップ', ok: 'スキップする',
      html: '<div class="small">はじめての冒険の案内を終了します。初回の召喚と、はじめての戦いの報酬は受け取れます。ほかの機能は、これまでどおり進行に合わせて解放されます。</div>',
      onOk: function () {
        UI.closeModal('guideSummon'); UI.closeModal('guideBattle');
        AL.Game.paused = false;
        var r = AL.Game.skipGuide(Date.now());
        UI.renderCurrency(); UI.renderNav();
        if (r.summon && r.summon.ok) UI.gachaAnim(r.summon.results, function () { UI.guideRefresh(); });
        UI.guideRefresh();
      } });
  };

  // ---- 案内バーと機能の解放 ----
  UI.guideRefresh = function () {
    var st = UI.st(); if (!st) return;
    var bar = document.getElementById('guide-bar');
    if (!bar) { bar = document.createElement('div'); bar.id = 'guide-bar'; document.body.appendChild(bar); }
    var h = !st.guide.legacy && HINTS[st.guide.step];
    if (!h || UI.titleOpen) { document.body.classList.remove('has-guide'); bar._v = ''; return; }
    var html = '<div>' + esc(h.text) + '</div><div class="g-row">' +
      (h.btn ? '<button class="btn sm primary" data-act="' + h.act + '"' + (h.id ? ' data-id="' + h.id + '"' : '') + '>' + h.btn + '</button>' : '') +
      '<button class="g-skip" data-act="guideSkip">案内を終える</button></div>';
    if (bar._v !== html) { bar.innerHTML = html; bar._v = html; }
    document.body.classList.add('has-guide');
  };
  UI.guideTick = function () {
    var st = UI.st(); if (!st || UI.titleOpen) return;
    if (Guide.update(st)) { UI.renderNav(); UI.guideRefresh(); }
    var pend = Guide.pendingUnlocks(st);
    if (!pend.length) return;
    // 説明のない機能（仲間・装備は案内バーで説明）は、表示せずに案内済みにする
    Guide.markSeen(st, pend.filter(function (id) { return !INTRO[id]; }));
    var show = pend.filter(function (id) { return INTRO[id]; });
    if (!show.length || UI.modals.length || document.querySelector('.gacha-overlay')) return;
    Guide.markSeen(st, show);
    UI.renderNav();
    UI.modal({ id: 'guideUnlock', title: '新しい機能が解放されました',
      html: show.map(function (id) { var sc = UI.screens[id]; return '<div class="syn on"><b>' + sc.icon + '　' + esc(sc.name) + '</b>　<span class="tiny sub">' + whereIs(sc) + '</span><div class="small">' + esc(INTRO[id]) + '</div></div>'; }).join(''),
      buttons: [{ label: 'OK', cls: 'primary' }] });
    AL.Game.save();
  };
  // 解放した機能の開き方（下部のタブ／仲間タブの中／その他メニュー）
  function whereIs(sc) {
    if (sc.parent) return '「' + UI.screens[sc.parent].name + '」タブ上部の「' + sc.name + '」から';
    return sc.nav === 'more' ? '「その他」メニューから' : '下のタブから';
  }
  UI.afterStateReplaced = function () {
    var st = UI.st();
    UI.closeModal('guideSummon'); UI.closeModal('guideBattle');
    if (Guide.isNewGame(st)) { UI.showTitle(); UI.guideRefresh(); return; }
    AL.Game.resumeGuide();
    UI.renderNav();
    if (!Guide.unlocked(st, UI.current)) UI.show('battle');
    UI.guideRefresh();
  };

  UI.action('guideSummon', function () { if (UI.st().guide.step === 'summon') UI.showSummonIntro(); });
  UI.action('guideSkip', function () { UI.confirmSkipGuide(); });
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>/* js/main.js */
/* ABYSSAL LEGENDS - 起動処理とメインループ */
(function (G) {
  'use strict';
  var AL = G.AL, UI = AL.UI, U = AL.U, D = AL.DATA;
  var lastTick = 0, lastSlow = 0, errCount = 0;

  function loop() {
    var now = Date.now();
    try {
      AL.Game.frame(now);
      AL.Scene.render();
      if (now - lastTick > 120) { lastTick = now; UI.tickBattle(); }
      if (now - lastSlow > 500) { lastSlow = now; UI.renderCurrency(); UI.updateBadges(); UI.guideTick(); UI.questTick(); UI.questScreenTick(); UI.achScreenTick(); }
      errCount = 0;
    } catch (e) {
      errCount++;
      console.error(e);
      if (errCount === 1) UI.toast('エラーが発生しました：' + e.message, 'bad', 5000);
    }
    G.requestAnimationFrame(loop);
  }

  function boot() {
    AL.Game.init();
    AL.Game.paused = true;            // タイトル画面で「NEW GAME／CONTINUE」を選ぶまで戦闘を進めない
    UI.lastSaved = Date.now();
    UI.buildBattlePanel();
    document.addEventListener('click', UI.handleClick);
    document.addEventListener('change', UI.handleChange);
    UI.$('#mini-status').addEventListener('click', function () { UI.show('battle'); });
    UI.show('battle');
    UI.renderCurrency();

    // ゲームイベント → 画面
    AL.Events.on('idlePending', function () { setTimeout(function () { if (!UI.titleOpen) UI.showIdle(); }, 50); });
    AL.Events.on('dungeonEnd', function (res) {
      // バトル・ダンジョン画面で見ていたときだけ、次の挑戦を選べるようダンジョン画面へ戻す
      if (UI.current === 'battle' || UI.current === 'dungeon') UI.show('dungeon');
      UI.showDungeonResult(res); UI.refresh();
    });
    AL.Events.on('saved', function (r) {
      // 保護による停止は起動時のお知らせと設定画面で伝えるので、自動保存のたびには表示しない
      if (r.ok) { UI.lastSaved = Date.now(); var el = UI.$('#last-saved'); if (el) el.textContent = new Date().toLocaleTimeString(); }
      else if (!r.blocked) UI.toast('保存に失敗しました（ストレージ容量を確認してください）', 'bad');
    });
    AL.Events.on('drop', function (d) {
      if (d.kept && d.item.rarity >= 3) UI.toast((d.item.rarity >= 5 ? '★神話級★ ' : '') + D.EQUIP_RARITY[d.item.rarity].name + '「' + AL.Inv.name(d.item) + '」を入手！', 'rare');
      if (d.reason === 'full') UI.toast('所持数上限のため装備を自動売却しました', 'bad');
    });
    AL.Events.on('defeat', function (d) { UI.toast('第' + d.floor + '層で敗北…編成や装備を見直しましょう', 'bad'); });
    AL.Events.on('floor', function (d) { if (AL.Progress.isBossFloor(d.cleared)) UI.toast('ボス撃破！第' + d.cleared + '層を突破', 'good'); if (UI.current === 'battle') UI.refresh(); });
    AL.Events.on('stateReplaced', function () { UI.refresh(); UI.renderCurrency(); });

    // 保存のタイミング
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) AL.Game.save();
      else { AL.Game.frame(Date.now()); if (AL.Game.pendingIdle && !UI.titleOpen) UI.showIdle(); }
    });
    G.addEventListener('pagehide', function () { AL.Game.save(); });
    G.addEventListener('beforeunload', function () { AL.Game.save(); });
    // 非表示中（requestAnimationFrame停止中）も時間を進める
    setInterval(function () { if (document.hidden) { try { AL.Game.frame(Date.now()); } catch (e) { console.error(e); } } }, 1000);

    AL.Events.on('tutorialEnd', function (r) { UI.showTutorialEnd(r); });
    AL.Events.on('guide', function () { UI.renderNav(); UI.guideRefresh(); });
    AL.Events.on('stateReplaced', function () { UI.afterStateReplaced(); });
    // お知らせ・放置報酬は、タイトル画面から始めたあとに表示する（UI.startGame）
    UI.showTitle();
    var ld = document.getElementById('loading'); if (ld) ld.remove();
    G.requestAnimationFrame(loop);
  }

  // ブラウザが出す無害な通知（ResizeObserverのループ、詳細のない他オリジンの「Script error.」）は画面に出さない
  G.addEventListener('error', function (e) {
    var msg = e.message || '';
    if (/ResizeObserver loop/i.test(msg) || (/^Script error\.?$/i.test(msg) && !e.filename)) { console.warn('[ignored]', msg); return; }
    if (UI && UI.toast) UI.toast('エラー：' + (msg || '不明'), 'bad', 5000);
  });
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})(window);

</script>
</body>
