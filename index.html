<script>/* js/ui/ui.js */
/* ABYSSAL LEGENDS - UI基盤：画面切替・モーダル・通知・共通部品
 * 画面は常にゲーム状態から描画し直すため、画面を切り替えても編成・装備の変更が確実に反映されます。
 * 各画面の選択状態（選択中の仲間・フィルタ・スクロール位置）は UI.ui に保持し、タブ切替で失われません。 */
(function (G) {
  'use strict';
  var AL = G.AL = G.AL || {};
  var D = AL.DATA, U = AL.U;
  var esc = U.esc;

  var UI = AL.UI = {
    screens: {}, order: [], current: 'battle', actions: {}, ui: {}, scroll: {}, modals: [], dirty: false
  };
  UI.$ = function (sel, root) { return (root || document).querySelector(sel); };
  UI.$$ = function (sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); };
  UI.st = function () { return AL.Game.state; };

  // 画面登録：{id, name, icon, nav:'main'|'more', render(el), events:[...]}
  UI.register = function (def) { UI.screens[def.id] = def; UI.order.push(def.id); };
  UI.action = function (name, fn) { UI.actions[name] = fn; };

  UI.show = function (id, opts) {
    if (!UI.screens[id]) id = 'battle';
    var wrap = UI.$('#screen-wrap');
    if (UI.current && wrap) UI.scroll[UI.current] = G.scrollY;
    UI.current = id;
    document.body.className = document.body.className.replace(/\btab-\S+/g, '').trim() + ' tab-' + id;
    UI.renderNav();
    UI.render();
    if (!(opts && opts.keepScroll === false)) G.scrollTo(0, UI.scroll[id] || 0);
  };

  UI.render = function () {
    UI.dirty = false;
    var def = UI.screens[UI.current], el = UI.$('#screen');
    if (!def || !el) return;
    try { def.render(el); }
    catch (e) { console.error(e); el.innerHTML = '<div class="panel notice danger">画面の描画中にエラーが発生しました：' + esc(e.message) + '</div>'; }
  };
  // 次のフレームでまとめて再描画（入力中のフォームがある場合は保留）
  UI.refresh = function () {
    if (UI.dirty) return;
    UI.dirty = true;
    G.requestAnimationFrame(function () {
      var a = document.activeElement;
      if (a && /INPUT|TEXTAREA|SELECT/.test(a.tagName) && UI.$('#screen').contains(a)) { UI.dirty = false; return; }
      UI.render();
    });
  };
  UI.listen = function (evts, screens) {
    evts.forEach(function (ev) {
      AL.Events.on(ev, function () { if (!screens || screens.indexOf(UI.current) >= 0) UI.refresh(); });
    });
  };

  UI.renderNav = function () {
    var nav = UI.$('#nav');
    if (!nav) return;
    var html = '';
    UI.order.forEach(function (id) {
      var s = UI.screens[id];
      if (!s.nav) return;
      var cls = 'nav-item' + (UI.current === id || (id === 'menu' && UI.screens[UI.current].nav === 'more') ? ' active' : '') + (s.nav === 'more' ? ' more-only' : '') + (id === 'menu' ? ' menu-btn' : '');
      html += '<button class="' + cls + '" data-act="nav" data-id="' + id + '"><span class="ni">' + s.icon + '</span><span>' + s.name + '</span><span class="badge" id="badge-' + id + '"></span></button>';
    });
    nav.innerHTML = html;
    UI.updateBadges();
  };
  UI.updateBadges = function () {
    var st = UI.st(); if (!st) return;
    var ach = AL.Achievements.claimable(st).length;
    var set = function (id, v) { var b = UI.$('#badge-' + id); if (b) b.textContent = v ? String(v) : ''; };
    set('achievements', ach);
    set('battle', AL.Game.pendingIdle ? '!' : '');
    set('menu', ach || '');
    set('dungeon', st.currency.tickets >= AL.CONFIG.TICKETS.MAX && st.stats.maxFloorEver >= 15 ? '!' : '');
  };

  // ---- 通貨表示 ----
  UI.renderCurrency = function () {
    var st = UI.st(), c = st.currency, el = UI.$('#currency');
    if (!el) return;
    var items = [['ig', 'G', 'ゴールド', U.fmt(c.gold)], ['ic', '魂', '魂晶', U.fmt(c.crystals)], ['ie', 'EX', '経験値', U.fmt(c.exp)],
      ['is', '石', '強化石', U.fmt(c.stones)], ['it', '券', '挑戦券', c.tickets + '/' + AL.CONFIG.TICKETS.MAX]];
    if (c.shards > 0) items.push(['ish', '片', '英雄の欠片', U.fmt(c.shards)]);
    if (c.rebirthPts > 0 || st.rebirth.count > 0) items.push(['ic', '輪', '転生ポイント', U.fmt(c.rebirthPts)]);
    var key = items.map(function (i) { return i[3]; }).join('|');
    if (el._key === key) return;
    el._key = key;
    el.innerHTML = items.map(function (i) { return '<span class="cur" title="' + i[2] + '"><i class="' + i[0] + '">' + i[1] + '</i>' + i[3] + '</span>'; }).join('');
  };

  // ---- 通知 ----
  UI.toast = function (msg, type, ms) {
    var box = UI.$('#toasts'); if (!box) return;
    var d = document.createElement('div');
    d.className = 'toast ' + (type || '');
    d.textContent = msg;
    box.appendChild(d);
    while (box.children.length > 4) box.removeChild(box.firstChild);
    setTimeout(function () { if (d.parentNode) d.parentNode.removeChild(d); }, ms || 2600);
  };

  // ---- モーダル ----
  // opts: {title, html, buttons:[{label, cls, onClick(close) or act, close:true}], wide, onClose, id}
  UI.modal = function (opts) {
    var root = UI.$('#modal-root');
    var bd = document.createElement('div');
    bd.className = 'backdrop';
    var foot = '';
    (opts.buttons || []).forEach(function (b, i) {
      foot += '<button class="btn ' + (b.cls || '') + '" data-mbtn="' + i + '"' + (b.disabled ? ' disabled' : '') + '>' + b.label + '</button>';
    });
    bd.innerHTML = '<div class="modal' + (opts.wide ? ' wide' : '') + '" role="dialog" aria-modal="true">' +
      '<div class="modal-head"><h3>' + (opts.title || '') + '</h3><button class="modal-close" data-mclose aria-label="閉じる">×</button></div>' +
      '<div class="modal-body">' + (opts.html || '') + '</div>' + (foot ? '<div class="modal-foot">' + foot + '</div>' : '') + '</div>';
    var entry = { el: bd, opts: opts, id: opts.id || null };
    function close() {
      if (!bd.parentNode) return;
      bd.parentNode.removeChild(bd);
      UI.modals = UI.modals.filter(function (m) { return m !== entry; });
      if (opts.onClose) opts.onClose();
    }
    entry.close = close;
    bd.addEventListener('click', function (e) {
      if (e.target === bd && !opts.persistent) { close(); return; }
      if (e.target.closest('[data-mclose]')) { close(); return; }
      var mb = e.target.closest('[data-mbtn]');
      if (mb) {
        var b = opts.buttons[+mb.getAttribute('data-mbtn')];
        if (b.onClick) { var keep = b.onClick(close, bd); if (keep !== true && b.close !== false) close(); }
        else close();
      }
    });
    root.appendChild(bd);
    UI.modals.push(entry);
    if (opts.onOpen) opts.onOpen(bd, close);
    return { close: close, el: bd, setBody: function (h) { bd.querySelector('.modal-body').innerHTML = h; } };
  };
  UI.closeModal = function (id) { UI.modals.slice().forEach(function (m) { if (!id || m.id === id) m.close(); }); };
  UI.topModal = function (id) { var m = UI.modals.filter(function (x) { return x.id === id; })[0]; return m || null; };

  // 確認ダイアログ。opts.check を指定すると、チェックを入れるまで実行ボタンが押せない
  UI.confirm = function (opts) {
    var html = '<div>' + (opts.html || '') + '</div>';
    if (opts.check) html += '<label class="toggle mt"><span>' + opts.check + '</span><span class="switch"><input type="checkbox" id="confirm-check"><span></span></span></label>';
    var m = UI.modal({
      title: opts.title || '確認', html: html, persistent: !!opts.check,
      buttons: [{ label: 'キャンセル', cls: 'ghost' }, { label: opts.ok || '実行', cls: opts.danger ? 'danger' : 'primary', disabled: !!opts.check, onClick: function () { opts.onOk && opts.onOk(); } }]
    });
    if (opts.check) {
      var cb = m.el.querySelector('#confirm-check'), okb = m.el.querySelector('[data-mbtn="1"]');
      cb.addEventListener('change', function () { okb.disabled = !cb.checked; });
    }
    return m;
  };

  // ---- 共通部品 ----
  UI.elemTag = function (e) { var d = D.ELEMENTS[e]; return d ? '<span class="tagx" style="background:' + d.color + '">' + d.name + '</span>' : ''; };
  UI.roleTag = function (r) { var d = D.ROLES[r]; return d ? '<span class="tagx" style="background:' + d.color + '">' + d.name + '</span>' : ''; };
  UI.stars = function (r) { return '<span class="stars" style="color:' + D.HERO_RARITY[r].color + '">' + '★'.repeat(r) + '</span>'; };
  UI.lbPips = function (lb) { var s = '<span class="lb" title="限界突破 ' + lb + '/' + AL.CONFIG.HERO.MAX_LB + '">'; for (var i = 0; i < AL.CONFIG.HERO.MAX_LB; i++) s += '<i class="' + (i < lb ? 'on' : '') + '"></i>'; return s + '</span>'; };
  UI.heroImg = function (id, size, cls) { return '<img class="px ' + (cls || '') + '" src="' + AL.Sprites.heroUrl(id) + '" width="' + (size || 48) + '" height="' + (size || 48) + '" alt="">'; };
  UI.itemImg = function (it) { return '<img class="px" src="' + AL.Sprites.itemUrl(it.base, it.rarity) + '" alt="">'; };
  UI.rarityColor = function (r) { return D.EQUIP_RARITY[r].color; };
  UI.statVal = function (stat, v) { var sd = D.STATS[stat]; return sd && sd.pct ? U.pct(v, 1) : U.fmt(v); };
  UI.statName = function (stat) { var sd = D.STATS[stat]; return sd ? sd.name + (sd.pct && D.FLAT_STATS[stat.replace('P', '')] && stat.slice(-1) === 'P' ? '%' : '') : stat; };

  UI.heroCard = function (id, opts) {
    opts = opts || {};
    var st = UI.st(), hd = D.HEROES[id], h = st.heroes[id];
    var inParty = st.party.indexOf(id) >= 0;
    var power = AL.Stats.hero(st, id).power;
    return '<div class="hcard r' + hd.rarity + (inParty && !opts.noParty ? ' inparty' : '') + (opts.selected ? ' selected' : '') + '" data-act="' + (opts.act || 'heroDetail') + '" data-id="' + id + '">' +
      UI.heroImg(id, 48) + '<div class="grow" style="min-width:0">' +
      '<div class="nm ellipsis">' + esc(hd.name) + '</div>' +
      '<div class="meta">' + UI.stars(hd.rarity) + ' ' + UI.elemTag(hd.element) + ' ' + UI.roleTag(hd.role) + '</div>' +
      '<div class="meta">Lv' + h.lv + '/' + AL.Stats.levelCap(st, id) + ' ' + UI.lbPips(h.lb) + '</div>' +
      '<div class="meta">戦力 <b class="gold">' + U.fmt(power) + '</b></div></div></div>';
  };

  UI.itemSummary = function (it) {
    var st = AL.Stats.itemStats(it), main = it.main.stat;
    var s = '<b>' + UI.statName(main) + ' +' + UI.statVal(main, st[main]) + '</b>';
    it.subs.forEach(function (sb) { s += ' / ' + UI.statName(sb.stat) + '+' + UI.statVal(sb.stat, sb.value); });
    return s;
  };
  UI.itemRow = function (it, opts) {
    opts = opts || {};
    var eqBy = opts.eqMap ? opts.eqMap[it.uid] : AL.Inv.equippedBy(UI.st(), it.uid);
    var R = D.EQUIP_RARITY[it.rarity];
    return '<div class="irow" data-act="' + (opts.act || 'itemDetail') + '" data-uid="' + it.uid + '" style="border-left:3px solid ' + R.color + '">' +
      UI.itemImg(it) + '<div class="grow" style="min-width:0"><div class="nm ellipsis" style="color:' + R.color + '">' +
      (it.locked ? '<span class="lock">🔒</span>' : '') + esc(AL.Inv.name(it)) + (it.enh ? ' +' + it.enh : '') + '</div>' +
      '<div class="meta ellipsis">' + UI.itemSummary(it) + '</div></div>' +
      '<div class="right">' + R.name + '<br>Lv' + it.ilvl + (eqBy ? '<br><span class="eqby">' + esc(U.shortName(D.HEROES[eqBy].name)) + '</span>' : '') +
      (it.set ? '<br><span style="color:' + D.SETS[it.set].color + '">セット</span>' : '') + '</div></div>';
  };

  UI.statusChips = function (u) {
    return u.statuses.filter(function (s) { return D.STATUSES[s.id]; }).slice(0, 6).map(function (s) {
      var sd = D.STATUSES[s.id];
      return '<span class="st' + (sd.debuff ? ' debuff' : '') + '" style="background:' + sd.color + '" title="' + sd.name + ' 残り' + Math.ceil(s.dur) + '秒">' + sd.mark + (s.stacks > 1 ? s.stacks : '') + '</span>';
    }).join('');
  };

  // ---- 共通アクション ----
  UI.action('nav', function (el) { UI.show(el.dataset.id); });

  UI.handleClick = function (e) {
    var el = e.target.closest('[data-act]');
    if (!el || el.disabled) return;
    if (el.closest('.modal') && el.closest('[data-mbtn]')) return;
    var fn = UI.actions[el.dataset.act];
    if (fn) { e.preventDefault(); fn(el, e); }
  };
  UI.handleChange = function (e) {
    var el = e.target.closest('[data-change]');
    if (!el) return;
    var fn = UI.actions[el.dataset.change];
    if (fn) fn(el, e);
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>/* js/ui/battle.js */
/* ABYSSAL LEGENDS - メイン画面（戦闘パネル・戦闘詳細・放置報酬・ダンジョン結果） */
(function (G) {
  'use strict';
  var AL = G.AL = G.AL || {};
  var D = AL.DATA, U = AL.U, C = AL.CONFIG, UI = AL.UI;
  var esc = U.esc;

  // ===== 戦闘パネル（常駐） =====
  UI.buildBattlePanel = function () {
    var p = UI.$('#battle-panel');
    p.innerHTML =
      '<div id="dungeon-banner"></div>' +
      '<div class="hud"><div class="floor-label" id="hud-floor"></div><div class="waves" id="hud-waves"></div>' +
      '<div class="boss-prog"><div class="tiny sub"><span id="hud-boss-text"></span><span id="hud-biome"></span></div><div class="bar boss"><i id="hud-boss-bar"></i></div></div></div>' +
      '<div class="canvas-wrap"><canvas id="scene" aria-label="戦闘画面"></canvas><div class="overlay-tl num" id="hud-kills"></div>' +
      '<div class="overlay-tr"><button class="btn sm" data-act="idleOpen" id="hud-idle" style="display:none">放置報酬</button></div></div>' +
      '<div class="controls"><div class="seg" id="speed-seg">' + C.BATTLE.SPEEDS.map(function (s) { return '<button data-act="setSpeed" data-v="' + s + '">×' + s + '</button>'; }).join('') + '</div>' +
      '<button class="btn sm" data-act="toggleAdvance" id="btn-advance"></button>' +
      '<button class="btn sm gold" data-act="challenge" id="btn-challenge" style="display:none">ボスに挑戦</button>' +
      '<span class="grow"></span><span class="tiny sub num" id="hud-power"></span></div>' +
      '<div class="party-cards" id="party-cards"></div>';
    AL.Scene.init(UI.$('#scene'));
  };

  var partySig = '';
  UI.tickBattle = function () {
    var st = UI.st(), R = AL.Game.runner, b = R.battle;
    if (!st || !R) return;
    var t = st.tower, inD = R.mode === 'dungeon' && R.run;
    // 階層表示
    var fl = R.currentFloor(), biome = AL.Progress.biome(fl);
    var hf = UI.$('#hud-floor');
    var ftxt = inD ? esc(AL.Progress.dungeon(R.run.id).name) + '<small>難易度' + R.run.tier + '</small>' : '第' + t.floor + '層<small>' + (AL.Progress.isBossFloor(t.floor) ? 'ボス階層' : '') + '</small>';
    if (hf._v !== ftxt) { hf.innerHTML = ftxt; hf._v = ftxt; }
    var wv = UI.$('#hud-waves'), wh = '';
    if (inD) {
      var r = R.run, total = r.type === 'bossrush' ? 0 : r.totalWaves + (r.boss ? 1 : 0);
      for (var i = 0; i < total; i++) wh += '<i class="' + (i < r.wave ? 'done' : (i === r.wave ? 'cur' : '')) + (r.boss && i === total - 1 ? ' boss' : '') + '"></i>';
      if (r.type === 'bossrush') wh = '<span class="tiny gold">撃破 ' + r.bossCount + '体</span>';
    } else if (AL.Progress.isBossFloor(t.floor)) wh = '<i class="boss cur"></i>';
    else for (var j = 0; j < C.TOWER.WAVES_PER_FLOOR; j++) wh += '<i class="' + (j < t.wave ? 'done' : (j === t.wave ? 'cur' : '')) + '"></i>';
    if (wv._v !== wh) { wv.innerHTML = wh; wv._v = wh; }
    var nb = AL.Progress.nextBossIn(t.floor);
    UI.$('#hud-boss-text').textContent = inD ? 'ダンジョン挑戦中' : (nb === 0 ? 'ボス戦！' : '次のボスまで ' + nb + '層');
    UI.$('#hud-biome').textContent = biome.name;
    var prog = inD ? 1 : (nb === 0 ? 1 : (C.TOWER.BOSS_INTERVAL - nb + t.wave / C.TOWER.WAVES_PER_FLOOR) / C.TOWER.BOSS_INTERVAL);
    UI.$('#hud-boss-bar').style.width = (prog * 100).toFixed(1) + '%';
    UI.$('#hud-kills').textContent = '撃破 ' + U.fmt(R.session.kills) + '　EXP +' + U.fmt(R.session.exp) + '　G +' + U.fmt(R.session.gold);
    UI.$('#hud-idle').style.display = AL.Game.pendingIdle ? '' : 'none';
    // 操作
    UI.$$('#speed-seg button').forEach(function (bt) { bt.classList.toggle('on', +bt.dataset.v === st.settings.speed); });
    var adv = UI.$('#btn-advance');
    var advTxt = t.autoAdvance ? '自動進行：ON' : '周回中（進行OFF）';
    if (adv.textContent !== advTxt) adv.textContent = advTxt;
    adv.style.display = inD ? 'none' : '';
    var ch = UI.$('#btn-challenge');
    var showCh = !inD && (t.blockedFloor > 0 || (!t.autoAdvance && t.floor < t.maxFloor));
    ch.style.display = showCh ? '' : 'none';
    ch.textContent = t.blockedFloor ? '第' + t.blockedFloor + '層に再挑戦' : '次の階層へ';
    UI.$('#hud-power').textContent = '戦力 ' + U.fmt(AL.Stats.partyPower(st));
    // ダンジョンバナー
    var db = UI.$('#dungeon-banner');
    var dbh = inD ? '<div class="dungeon-banner"><b class="grow">【' + esc(AL.Progress.dungeon(R.run.id).name) + '】挑戦中' + (R.run.affixes.length ? '　<span class="tiny">変異：' + R.run.affixes.map(function (a) { return D.AFFIXES[a].name; }).join('・') + '</span>' : '') + '</b><button class="btn sm danger" data-act="abandonDungeon">撤退</button></div>' : '';
    if (db._v !== dbh) { db.innerHTML = dbh; db._v = dbh; }
    // パーティーカード
    var sig = b.allies.map(function (u) { return u.uid + u.refId; }).join(',');
    var pc = UI.$('#party-cards');
    if (sig !== partySig) {
      partySig = sig;
      pc.innerHTML = b.allies.map(function (u) {
        var hd = D.HEROES[u.refId];
        return '<div class="pc" data-act="heroDetail" data-id="' + u.refId + '" id="pc-' + u.uid + '"><div class="pc-top">' + UI.heroImg(u.refId, 32) +
          '<div style="min-width:0"><div class="pc-lv">Lv' + st.heroes[u.refId].lv + '</div><span class="tagx" style="background:' + D.ROLES[hd.role].color + '">' + D.ROLES[hd.role].short + '</span></div></div>' +
          '<div class="pc-name">' + esc(U.shortName(hd.name)) + '</div>' +
          '<div class="bar hp"><i></i></div><div class="pc-hp"></div><div class="bar cd"><i></i></div><div class="sts"></div></div>';
      }).join('');
    }
    b.allies.forEach(function (u) {
      var el = UI.$('#pc-' + u.uid); if (!el) return;
      var r = u.hp / u.maxHp;
      el.classList.toggle('dead', !u.alive);
      var hb = el.querySelector('.bar.hp');
      hb.className = 'bar hp' + (r < 0.25 ? ' low' : (r < 0.5 ? ' mid' : ''));
      hb.firstChild.style.width = (r * 100).toFixed(1) + '%';
      el.querySelector('.pc-hp').textContent = U.fmt(u.hp) + '/' + U.fmt(u.maxHp);
      var cdb = el.querySelector('.bar.cd'), cdr = u.skill ? 1 - Math.min(1, u.cd / Math.max(0.01, u.skill.cd * (1 - u.cdr))) : 0;
      cdb.className = 'bar cd' + (cdr >= 1 ? ' ready' : '');
      cdb.firstChild.style.width = (cdr * 100).toFixed(0) + '%';
      var sts = UI.statusChips(u);
      var se = el.querySelector('.sts');
      if (se._v !== sts) { se.innerHTML = sts; se._v = sts; }
      var lv = el.querySelector('.pc-lv'), lvt = 'Lv' + st.heroes[u.refId].lv;
      if (lv.textContent !== lvt) lv.textContent = lvt;
    });
    // ミニステータス（他画面用）
    var ms = UI.$('#mini-status');
    if (ms && UI.current !== 'battle') {
      var mh = '<b>' + (inD ? 'ダンジョン' : '第' + t.floor + '層') + '</b><div class="mini-hp">' + b.allies.map(function (u) {
        var rr = u.alive ? u.hp / u.maxHp : 0;
        return '<div class="bar hp' + (rr < 0.25 ? ' low' : (rr < 0.5 ? ' mid' : '')) + '"><i style="width:' + (rr * 100).toFixed(0) + '%"></i></div>';
      }).join('') + '</div><span class="tiny sub">戦闘へ ›</span>';
      ms.innerHTML = mh;
    }
    if (UI.current === 'battle') UI.tickBattleScreen();
  };

  UI.action('setSpeed', function (el) { UI.st().settings.speed = +el.dataset.v; UI.tickBattle(); });
  UI.action('toggleAdvance', function () {
    var t = UI.st().tower;
    AL.Game.runner.setAutoAdvance(!t.autoAdvance);
    UI.toast(t.autoAdvance ? '自動で次の階層へ進みます' : '現在の階層を周回します');
    UI.tickBattle();
  });
  UI.action('challenge', function () { AL.Game.runner.challenge(); UI.toast('挑戦します！'); });
  UI.action('miniStatus', function () { UI.show('battle'); });
  UI.action('abandonDungeon', function () {
    UI.confirm({ title: 'ダンジョンから撤退', html: '撤退すると挑戦は失敗扱いになり、消費した挑戦券は戻りません。', ok: '撤退する', danger: true,
      onOk: function () { AL.Game.runner.abandonDungeon(); } });
  });

  // ===== 戦闘詳細画面 =====
  UI.register({
    id: 'battle', name: 'バトル', icon: '⚔', nav: 'main',
    render: function (el) {
      var st = UI.st(), t = st.tower;
      var syn = AL.Stats.synergies(st.party);
      var idleMax = AL.Idle.maxSeconds(st), eff = AL.Idle.efficiency(st);
      var est = AL.Idle.compute(st, 3600);
      el.innerHTML =
        '<div class="screen-title battle-only-mobile">バトル <span class="tag">自動戦闘中</span></div>' +
        (AL.Game.pendingIdle ? '<div class="panel" style="border-color:var(--gold)"><div class="row between"><div><b class="gold">放置報酬が届いています</b><div class="tiny sub">' + U.fmtTime(AL.Game.pendingIdle.used) + 'の報酬</div></div><button class="btn gold" data-act="idleOpen">受け取る</button></div></div>' : '') +
        '<div class="panel"><h3>戦闘中の敵</h3><div id="bs-enemies"></div></div>' +
        '<div class="panel"><h3>今回のプレイの成果</h3><div id="bs-session"></div></div>' +
        '<div class="panel"><h3>階層の操作</h3>' +
        '<div class="kv"><span>現在の階層</span><b>第' + t.floor + '層</b></div>' +
        '<div class="kv"><span>今回の最高到達</span><b>第' + t.maxFloor + '層</b></div>' +
        '<div class="kv"><span>通算の最高到達</span><b>第' + st.stats.maxFloorEver + '層</b></div>' +
        (t.blockedFloor ? '<div class="notice">第' + t.blockedFloor + '層で敗北したため、第' + Math.max(1, t.blockedFloor - 1) + '層で態勢を整えています。' + (st.settings.autoBoss ? '（1階層周回ごとに自動で再挑戦）' : '（自動再挑戦はOFF）') + '</div>' : '') +
        '<div class="row wrap mt"><span class="sub small">移動先：</span><div class="stepper"><button class="btn sm" data-act="floorStep" data-v="-10">-10</button><button class="btn sm" data-act="floorStep" data-v="-1">-1</button><b id="floor-target">' + (UI.ui.floorTarget || t.floor) + '</b><button class="btn sm" data-act="floorStep" data-v="1">+1</button><button class="btn sm" data-act="floorStep" data-v="10">+10</button></div>' +
        '<button class="btn sm primary" data-act="gotoFloor">移動</button></div><div class="tiny dim">到達済みの階層（第' + t.maxFloor + '層まで）へ移動できます。</div></div>' +
        '<div class="panel"><h3>放置報酬</h3><div class="kv"><span>上限時間</span><b>' + U.fmtTime(idleMax) + '</b></div><div class="kv"><span>放置効率</span><b>' + U.pct(eff, 0) + '</b></div>' +
        '<div class="kv"><span>計測した撃破ペース</span><b>' + st.idle.kpm.toFixed(1) + '体/分</b></div>' +
        '<div class="kv"><span>1時間あたりの見込み</span><b class="small">G ' + U.fmt(est.gold) + ' / EXP ' + U.fmt(est.exp) + ' / 装備 約' + est.items + '個</b></div>' +
        '<div class="tiny dim mt">ゲームを閉じている間も、第' + t.floor + '層での撃破ペースをもとに報酬が貯まります（階層は進みません）。端末の時刻を過去に戻した場合、前回の最終時刻以降の分のみ計算します。</div></div>' +
        '<div class="panel"><h3>発動中の相性</h3>' + (syn.length ? syn.map(function (s) { return '<div class="syn on"><b>' + esc(s.name) + '</b>　<span class="small">' + esc(s.desc) + '</span></div>'; }).join('') : '<div class="dim small">なし（編成画面で相性を確認できます）</div>') + '</div>' +
        '<div class="panel"><div class="row between"><h3 style="margin:0">戦闘ログ</h3><span class="tiny dim">スキル・撃破・ボスの行動を記録</span></div><div class="log mt" id="bs-log"></div></div>';
      UI.tickBattleScreen(true);
    }
  });

  var lastLogSeq = '';
  UI.tickBattleScreen = function (force) {
    var R = AL.Game.runner, b = R.battle, st = UI.st();
    var en = UI.$('#bs-enemies');
    if (!en) return;
    var h = b.enemies.filter(function (e) { return e.alive; }).map(function (e) {
      var r = e.hp / e.maxHp;
      return '<div style="margin-bottom:6px"><div class="row between small"><span>' + (e.isBoss ? '<b class="bad">BOSS</b> ' : '') + UI.elemTag(e.element) + ' ' + esc(e.name) + '</span><span class="num sub">' + U.fmt(e.hp) + ' / ' + U.fmt(e.maxHp) + '</span></div>' +
        '<div class="bar' + (e.isBoss ? ' boss' : ' hp low') + '"><i style="width:' + (r * 100).toFixed(1) + '%"></i></div><div class="sts" style="display:flex;gap:2px;margin-top:2px">' + UI.statusChips(e) + '</div></div>';
    }).join('') || '<div class="dim small">' + (R.transition > 0 ? '次の敵へ移動中…' : '—') + '</div>';
    en.innerHTML = h;
    var s = R.session, mins = Math.max(1, (Date.now() - s.started) / 60000);
    UI.$('#bs-session').innerHTML = '<div class="reward-list">' +
      '<div>撃破数<b>' + U.fmt(s.kills) + '</b></div><div>ボス撃破<b>' + s.bosses + '</b></div>' +
      '<div>獲得経験値<b>' + U.fmt(s.exp) + '</b></div><div>獲得ゴールド<b>' + U.fmt(s.gold) + '</b></div>' +
      '<div>獲得魂晶<b>' + U.fmt(s.crystals) + '</b></div><div>装備（入手/売却）<b>' + s.items + ' / ' + s.sold + '</b></div>' +
      '<div>撃破ペース<b>' + (s.kills / mins).toFixed(1) + '体/分</b></div><div>通算撃破<b>' + U.fmt(st.stats.kills) + '</b></div></div>';
    var lg = UI.$('#bs-log');
    var key = b.log.length + ':' + (b.log.length ? b.log[b.log.length - 1].t : 0);
    if (force || key !== lastLogSeq) {
      lastLogSeq = key;
      var atBottom = lg.scrollTop + lg.clientHeight >= lg.scrollHeight - 10;
      lg.innerHTML = b.log.map(function (l) { return '<div class="' + l.cls + '">' + esc(l.text) + '</div>'; }).join('');
      if (atBottom || force) lg.scrollTop = lg.scrollHeight;
    }
  };

  UI.action('floorStep', function (el) {
    var t = UI.st().tower;
    UI.ui.floorTarget = U.clamp((UI.ui.floorTarget || t.floor) + (+el.dataset.v), 1, t.maxFloor);
    UI.$('#floor-target').textContent = UI.ui.floorTarget;
  });
  UI.action('gotoFloor', function () {
    if (AL.Game.runner.mode === 'dungeon') { UI.toast('ダンジョン挑戦中は移動できません', 'bad'); return; }
    var f = UI.ui.floorTarget || UI.st().tower.floor;
    AL.Game.runner.gotoFloor(f);
    if (f < UI.st().tower.maxFloor) AL.Game.runner.setAutoAdvance(false);
    UI.toast('第' + f + '層へ移動しました' + (f < UI.st().tower.maxFloor ? '（周回モード）' : ''));
    UI.render();
  });

  // ===== 放置報酬 =====
  UI.action('idleOpen', function () { UI.showIdle(); });
  UI.showIdle = function () {
    var r = AL.Game.pendingIdle;
    if (!r || UI.topModal('idle')) return;
    UI.modal({
      id: 'idle', title: '放置報酬', persistent: true,
      html: '<div class="center"><div class="sub">おかえりなさい。不在の間も仲間たちは戦い続けていました。</div>' +
        '<div class="idle-big mt">' + U.fmtTime(r.sec) + '</div>' +
        (r.capped ? '<div class="tiny bad">上限' + U.fmtTime(r.used) + 'までの報酬です（転生強化「時の揺り籠」で延長）</div>' : '') +
        '<div class="tiny sub">第' + r.floor + '層・効率' + U.pct(r.eff, 0) + '・推定撃破数 ' + U.fmt(r.kills) + '体</div></div>' +
        '<div class="reward-list mt"><div>経験値<b>' + U.fmt(r.exp) + '</b></div><div>ゴールド<b>' + U.fmt(r.gold) + '</b></div>' +
        '<div>強化石<b>' + r.stones + '</b></div><div>魂晶<b>' + r.crystals + '</b></div><div>装備<b>' + r.items + '個</b></div></div>',
      buttons: [{ label: '受け取る', cls: 'gold', onClick: function () {
        var res = AL.Game.claimIdle();
        if (res) UI.toast('放置報酬を受け取りました' + (res.items ? '（装備 ' + res.kept + '個入手・' + res.sold + '個自動売却）' : ''), 'good');
        UI.renderCurrency(); UI.updateBadges(); UI.refresh();
      } }]
    });
  };

  // ===== ダンジョン結果 =====
  UI.showDungeonResult = function (res) {
    var items = res.items.map(function (it) { return UI.itemRow(it, { act: 'itemDetail' }); }).join('');
    UI.modal({
      title: res.win ? '攻略成功！' : '挑戦終了',
      html: '<div class="center"><div class="sub">' + esc(res.name) + '　難易度' + res.tier + '</div>' +
        (res.bossCount != null ? '<div class="idle-big">' + res.bossCount + '体撃破</div>' : '<div class="idle-big" style="color:' + (res.win ? 'var(--good)' : 'var(--bad)') + '">' + (res.win ? 'CLEAR' : (res.why === 'abandon' ? '撤退' : (res.why === 'timeout' ? '時間切れ' : '全滅'))) + '</div>') +
        (res.firstClear ? '<div class="gold">初回クリア！</div>' : '') + (res.record ? '<div class="gold">自己ベスト更新！</div>' : '') +
        '<div class="tiny sub">所要時間 ' + U.fmtTime(res.time) + '（ゲーム内時間）</div></div>' +
        '<div class="reward-list mt"><div>ゴールド<b>' + U.fmt(res.gold) + '</b></div><div>経験値<b>' + U.fmt(res.exp) + '</b></div>' +
        '<div>魂晶<b>' + res.crystals + '</b></div><div>強化石<b>' + res.stones + '</b></div></div>' +
        (items ? '<h3 class="mt">獲得装備</h3><div class="list">' + items + '</div>' : ''),
      buttons: [{ label: 'OK', cls: 'primary' }]
    });
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>/* js/ui/heroes.js */
/* ABYSSAL LEGENDS - 仲間画面・パーティー編成画面 */
(function (G) {
  'use strict';
  var AL = G.AL = G.AL || {};
  var D = AL.DATA, U = AL.U, C = AL.CONFIG, UI = AL.UI;
  var esc = U.esc;
  var ui = UI.ui;
  ui.heroFilter = ui.heroFilter || { role: '', element: '', sort: 'power' };

  // ===== 仲間一覧 =====
  UI.register({
    id: 'heroes', name: '仲間', icon: '仲', nav: 'main',
    render: function (el) {
      var st = UI.st(), f = ui.heroFilter;
      var ids = AL.Heroes.sortedIds(st, f.sort, { role: f.role, element: f.element });
      el.innerHTML = '<div class="screen-title">仲間 <span class="tag">' + Object.keys(st.heroes).length + ' / ' + D.HERO_LIST.length + '人</span></div>' +
        '<div class="panel"><div class="chips"><button class="chip' + (!f.role ? ' on' : '') + '" data-act="heroFilter" data-k="role" data-v="">全役割</button>' +
        D.ROLE_ORDER.map(function (r) { return '<button class="chip' + (f.role === r ? ' on' : '') + '" data-act="heroFilter" data-k="role" data-v="' + r + '">' + D.ROLES[r].name + '</button>'; }).join('') + '</div>' +
        '<div class="chips mt"><button class="chip' + (!f.element ? ' on' : '') + '" data-act="heroFilter" data-k="element" data-v="">全属性</button>' +
        D.ELEMENT_ORDER.map(function (e) { return '<button class="chip' + (f.element === e ? ' on' : '') + '" data-act="heroFilter" data-k="element" data-v="' + e + '" style="' + (f.element === e ? 'background:' + D.ELEMENTS[e].color + ';color:#000' : '') + '">' + D.ELEMENTS[e].name + '</button>'; }).join('') + '</div>' +
        '<div class="row mt"><span class="small sub">並び順</span><div class="seg">' + [['power', '戦力'], ['rarity', 'レア'], ['level', 'Lv']].map(function (s) {
          return '<button class="' + (f.sort === s[0] ? 'on' : '') + '" data-act="heroFilter" data-k="sort" data-v="' + s[0] + '">' + s[1] + '</button>'; }).join('') + '</div>' +
        '<span class="grow"></span><span class="tiny sub">欠片 ' + U.fmt(st.currency.shards) + '</span></div></div>' +
        '<div class="grid-cards">' + (ids.map(function (id) { return UI.heroCard(id); }).join('') || '<div class="dim">該当する仲間がいません</div>') + '</div>' +
        '<div class="tiny dim mt">同じ仲間を重複して獲得すると限界突破（最大' + C.HERO.MAX_LB + '・1回ごとに能力+' + (C.HERO.LB_STAT * 100) + '%・レベル上限+' + C.HERO.LB_LEVEL_CAP + '）。上限後の重複は英雄の欠片に変換されます。</div>';
    }
  });
  UI.listen(['loadout', 'gacha', 'stateReplaced'], ['heroes', 'party']);
  UI.action('heroFilter', function (el) { ui.heroFilter[el.dataset.k] = el.dataset.v; UI.render(); });

  // ===== 仲間の詳細 =====
  function heroDetailHtml(id) {
    var st = UI.st(), hd = D.HEROES[id], h = st.heroes[id];
    if (!h) return '<div class="dim">未所持です</div>';
    var inParty = st.party.indexOf(id) >= 0;
    var syn = inParty ? AL.Stats.synergyBonusFor(id, AL.Stats.synergies(st.party)) : {};
    var s = AL.Stats.hero(st, id, { synergy: syn });
    var cap = AL.Stats.levelCap(st, id);
    var c1 = AL.Heroes.costFor(st, id, 1), c10 = AL.Heroes.costFor(st, id, 10), cmax = AL.Heroes.costFor(st, id, 10000);
    var sk = D.SKILLS[hd.skill];
    // 所持経験値で上げられる最大レベル数
    var afford = 0, acc = 0, lv = h.lv;
    while (lv < cap && afford < 10000) { acc += AL.Heroes.expToNext(lv); if (acc > st.currency.exp) break; lv++; afford++; }
    var eqMap = AL.Stats.itemMap(st);
    var slotHtml = D.SLOTS.map(function (sl) {
      var it = eqMap[h.equip[sl]];
      return '<div class="slot' + (it ? ' filled' : '') + '" data-act="gotoEquip" data-id="' + id + '" data-slot="' + sl + '">' + (it ? UI.itemImg(it) : '') +
        '<div style="min-width:0"><div class="sl">' + D.SLOT_NAMES[sl] + '</div><div class="nm ellipsis" style="color:' + (it ? UI.rarityColor(it.rarity) : 'var(--dim)') + '">' + (it ? esc(AL.Inv.name(it)) + (it.enh ? ' +' + it.enh : '') : '未装備') + '</div></div></div>';
    }).join('');
    var setsHtml = s.sets.map(function (si) {
      var set = D.SETS[si.id];
      return '<div class="small"><b style="color:' + set.color + '">' + esc(set.name) + '</b> ' + si.count + '/6：' + Object.keys(set.bonuses).map(function (n) {
        return '<span class="' + (si.count >= +n ? 'good' : 'dim') + '">(' + n + ')' + esc(set.bonuses[n].desc) + '</span>'; }).join(' ') + '</div>';
    }).join('');
    var lbCost = AL.Heroes.shardLbCost(id);
    return '<div class="row" style="align-items:flex-start;gap:12px">' + UI.heroImg(id, 112, 'hero-big') +
      '<div class="grow"><div style="font-weight:900;font-size:17px">' + esc(hd.name) + '</div>' +
      '<div class="mt-s">' + UI.stars(hd.rarity) + ' ' + UI.elemTag(hd.element) + ' ' + UI.roleTag(hd.role) + '</div>' +
      '<div class="small mt">Lv <b>' + h.lv + '</b> / ' + cap + '　限界突破 ' + UI.lbPips(h.lb) + '</div>' +
      '<div class="small">戦力 <b class="gold">' + U.fmt(s.power) + '</b>' + (inParty ? ' <span class="tiny good">（相性込み）</span>' : '') + '</div>' +
      '<div class="tiny sub mt">' + esc(hd.desc) + '</div></div></div>' +
      '<div class="panel mt"><h3>能力値</h3><div class="stat-table">' +
      [['HP', U.fmt(s.hp)], ['攻撃力', U.fmt(s.atk)], ['防御力', U.fmt(s.def)], ['魔法防御', U.fmt(s.res)], ['攻撃速度', s.spd.toFixed(2)], ['会心率', U.pct(s.crit)],
        ['会心ダメージ', U.pct(C.BATTLE.CRIT_BASE_DMG + s.critDmg, 0)], ['スキル威力', '+' + U.pct(s.skillPow)], ['回復量', '+' + U.pct(s.healPow)], ['待機短縮', U.pct(s.cdr)]].map(function (r) { return '<div><span class="sub">' + r[0] + '</span><b>' + r[1] + '</b></div>'; }).join('') +
      '</div>' + (setsHtml ? '<div class="mt">' + setsHtml + '</div>' : '') + '</div>' +
      '<div class="panel"><h3>スキル「' + esc(sk.name) + '」<span class="tiny sub">待機 ' + sk.cd + '秒</span></h3><div class="small">' + esc(sk.desc) + '</div>' +
      '<div class="tiny sub mt">通常攻撃「' + esc(hd.basic.name) + '」：' + (hd.basic.type === 'mag' ? '魔法' : '物理') + 'ダメージ（攻撃力の' + Math.round(hd.basic.p * 100) + '%）' + (hd.basic.ranged ? '・遠距離' : '') + '</div></div>' +
      '<div class="panel"><h3>レベルアップ <span class="tiny sub">所持EXP ' + U.fmt(st.currency.exp) + '</span></h3>' +
      (h.lv >= cap ? '<div class="notice">レベル上限です。限界突破または転生強化「限界解放」で上限が上がります。</div>' : '') +
      '<div class="btn-group"><button class="btn primary" data-act="heroLv" data-id="' + id + '" data-n="1"' + (c1.levels && st.currency.exp >= c1.exp ? '' : ' disabled') + '>+1<span class="cost">' + U.fmt(c1.exp) + '</span></button>' +
      '<button class="btn primary" data-act="heroLv" data-id="' + id + '" data-n="10"' + (c10.levels && st.currency.exp >= AL.Heroes.expToNext(h.lv) ? '' : ' disabled') + '>+10<span class="cost">' + U.fmt(c10.exp) + '</span></button>' +
      '<button class="btn gold" data-act="heroLv" data-id="' + id + '" data-n="10000"' + (afford > 0 ? '' : ' disabled') + '>最大(+' + afford + ')</button></div>' +
      '<div class="tiny dim mt">設定「自動レベルアップ」がONの場合、編成中の仲間は経験値が貯まると自動で成長します。</div></div>' +
      '<div class="panel"><h3>限界突破 <span class="tiny sub">欠片 ' + U.fmt(st.currency.shards) + '</span></h3>' +
      (h.lb >= C.HERO.MAX_LB ? '<div class="small good">限界突破は最大です</div>' :
        '<button class="btn" data-act="heroLb" data-id="' + id + '"' + (st.currency.shards >= lbCost ? '' : ' disabled') + '>欠片' + lbCost + '個で限界突破</button>') + '</div>' +
      '<div class="panel"><div class="row between"><h3 style="margin:0">装備</h3><button class="btn sm" data-act="autoEquipHero" data-id="' + id + '">最適装備</button></div><div class="slots mt">' + slotHtml + '</div></div>' +
      '<div class="panel"><h3>編成</h3><div class="btn-group">' + [0, 1, 2, 3, 4].map(function (i) {
        var cur = st.party[i];
        return '<button class="btn sm' + (cur === id ? ' primary' : '') + '" data-act="heroToSlot" data-id="' + id + '" data-slot="' + i + '">' + (i < C.HERO.FRONT_SLOTS ? '前衛' : '後衛') + (i + 1) + (cur && cur !== id ? '<span class="cost">(' + esc(U.shortName(D.HEROES[cur].name)) + ')</span>' : '') + '</button>';
      }).join('') + (inParty ? '<button class="btn sm danger" data-act="heroOut" data-id="' + id + '">外す</button>' : '') + '</div></div>';
  }
  UI.heroDetail = function (id) {
    if (!UI.st().heroes[id]) { UI.codexHero(id); return; }
    var m = UI.topModal('hero');
    if (m) { m.el.querySelector('.modal-body').innerHTML = heroDetailHtml(id); m.heroId = id; return; }
    var mm = UI.modal({ id: 'hero', title: '仲間の詳細', html: heroDetailHtml(id), wide: true });
    UI.topModal('hero').heroId = id;
    void mm;
  };
  function refreshHeroModal() {
    var m = UI.topModal('hero');
    if (m && m.heroId) { var b = m.el.querySelector('.modal-body'), sc = b.scrollTop; b.innerHTML = heroDetailHtml(m.heroId); b.scrollTop = sc; }
  }
  AL.Events.on('loadout', function () { if (UI.topModal('hero')) setTimeout(refreshHeroModal, 0); });

  UI.action('heroDetail', function (el) { UI.heroDetail(el.dataset.id); });
  UI.action('heroLv', function (el) {
    var n = AL.Heroes.levelUp(UI.st(), el.dataset.id, +el.dataset.n);
    if (n) UI.toast('レベルが' + n + '上がった！', 'good'); else UI.toast('経験値が足りません', 'bad');
    refreshHeroModal(); UI.renderCurrency(); UI.refresh();
  });
  UI.action('heroLb', function (el) {
    var r = AL.Heroes.limitBreakWithShards(UI.st(), el.dataset.id);
    UI.toast(r.ok ? '限界突破！（' + r.lb + '/' + C.HERO.MAX_LB + '）' : r.msg, r.ok ? 'good' : 'bad');
    refreshHeroModal(); UI.renderCurrency(); UI.refresh();
  });
  UI.action('heroToSlot', function (el) {
    AL.Heroes.setSlot(UI.st(), +el.dataset.slot, el.dataset.id);
    UI.toast('編成を変更しました'); refreshHeroModal(); UI.refresh();
  });
  UI.action('heroOut', function (el) {
    var st = UI.st(), i = st.party.indexOf(el.dataset.id);
    if (!AL.Heroes.removeSlot(st, i)) UI.toast('パーティーには最低1人必要です', 'bad');
    refreshHeroModal(); UI.refresh();
  });
  UI.action('autoEquipHero', function (el) {
    var n = AL.Inv.autoEquip(UI.st(), el.dataset.id);
    UI.toast(n ? n + '部位の装備を更新しました' : 'より良い装備はありません', n ? 'good' : '');
    refreshHeroModal(); UI.refresh();
  });
  UI.action('gotoEquip', function (el) {
    ui.equipHero = el.dataset.id; ui.equipSlot = el.dataset.slot || ''; ui.invPage = 1;
    UI.closeModal('hero'); UI.show('equip');
  });

  // ===== パーティー編成 =====
  UI.register({
    id: 'party', name: '編成', icon: '陣', nav: 'main',
    render: function (el) {
      var st = UI.st(), sel = ui.partySel == null ? -1 : ui.partySel;
      var syn = AL.Stats.synergies(st.party);
      var activeIds = syn.map(function (s) { return s.id; });
      var slots = st.party.map(function (id, i) {
        return '<div class="pslot' + (id ? ' filled' : '') + (sel === i ? ' sel' : '') + '" data-act="partySel" data-slot="' + i + '"><div class="pos">' + (i < C.HERO.FRONT_SLOTS ? '前衛' : '後衛') + (i + 1) + '</div>' +
          (id ? UI.heroImg(id, 48) + '<div class="nm">' + esc(U.shortName(D.HEROES[id].name)) + '</div><div class="tiny">' + UI.elemTag(D.HEROES[id].element) + ' Lv' + st.heroes[id].lv + '</div>' : '<div class="dim" style="padding-top:28px">空き</div>') + '</div>';
      }).join('');
      var list = AL.Heroes.sortedIds(st, 'power').map(function (id) { return UI.heroCard(id, { act: 'partyPick' }); }).join('');
      el.innerHTML = '<div class="screen-title">パーティー編成 <span class="tag">総戦力 ' + U.fmt(AL.Stats.partyPower(st)) + '</span></div>' +
        '<div class="panel"><div class="pslots">' + slots + '</div>' +
        '<div class="tiny sub mt">' + (sel >= 0 ? '<b class="gold">' + (sel + 1) + '番の枠を選択中</b>：下の一覧から配置する仲間をタップ（編成中の仲間は入れ替え）' : '枠をタップして選択 → 仲間をタップで配置。前衛（1〜2番）は敵に狙われやすくなります。') + '</div>' +
        '<div class="btn-group mt"><button class="btn primary" data-act="autoParty">おまかせ編成</button>' + (sel >= 0 && st.party[sel] ? '<button class="btn danger" data-act="partyRemove" data-slot="' + sel + '">この枠を外す</button>' : '') + '</div>' +
        '<div class="tiny dim mt">編成の変更は戦闘中でも即座に反映されます（HPの割合は維持）。</div></div>' +
        '<div class="panel"><h3>相性ボーナス</h3>' + D.SYNERGIES.map(function (s) {
          var on = activeIds.indexOf(s.id) >= 0;
          return '<div class="syn' + (on ? ' on' : '') + '"><b>' + (on ? '✔ ' : '') + esc(s.name) + '</b>　<span class="small sub">' + esc(s.desc) + '</span></div>';
        }).join('') + '</div>' +
        '<div class="panel"><h3>属性相性</h3><div class="elem-chart">' + ['fire', 'wind', 'earth', 'water'].map(function (e) { return UI.elemTag(e); }).join(' → ') + ' → ' + UI.elemTag('fire') +
        '<span class="sub small">（矢印の先に有利：与ダメージ×' + C.BATTLE.ELEMENT_ADV + '、逆は×' + C.BATTLE.ELEMENT_DIS + '）</span></div><div class="elem-chart mt">' + UI.elemTag('light') + ' ⇔ ' + UI.elemTag('dark') + '<span class="sub small">（互いに有利）</span></div></div>' +
        '<div class="screen-title" style="font-size:15px">所持している仲間</div><div class="grid-cards">' + list + '</div>';
    }
  });
  UI.action('partySel', function (el) {
    var i = +el.dataset.slot;
    ui.partySel = ui.partySel === i ? -1 : i;
    UI.render();
  });
  UI.action('partyPick', function (el) {
    var st = UI.st(), id = el.dataset.id;
    var sel = ui.partySel == null ? -1 : ui.partySel;
    if (sel < 0) {
      var empty = st.party.indexOf(null);
      if (st.party.indexOf(id) >= 0) { UI.heroDetail(id); return; }
      if (empty < 0) { UI.toast('先に入れ替える枠をタップしてください'); return; }
      sel = empty;
    }
    AL.Heroes.setSlot(st, sel, id);
    ui.partySel = -1;
    UI.toast(D.HEROES[id].name + 'を配置しました', 'good');
    UI.render();
  });
  UI.action('partyRemove', function (el) {
    if (!AL.Heroes.removeSlot(UI.st(), +el.dataset.slot)) UI.toast('パーティーには最低1人必要です', 'bad');
    ui.partySel = -1; UI.render();
  });
  UI.action('autoParty', function () { AL.Heroes.autoParty(UI.st()); ui.partySel = -1; UI.toast('おまかせ編成しました', 'good'); UI.render(); });
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>/* js/ui/equip.js */
/* ABYSSAL LEGENDS - 装備画面（装着・比較・強化・ロック・売却・一括整理） */
(function (G) {
  'use strict';
  var AL = G.AL = G.AL || {};
  var D = AL.DATA, U = AL.U, C = AL.CONFIG, UI = AL.UI;
  var esc = U.esc;
  var ui = UI.ui;
  ui.invFilter = ui.invFilter || { minR: 0, set: false, sort: 'rarity', show: 'all' };
  var PAGE = 40;

  function curHero(st) {
    if (!ui.equipHero || !st.heroes[ui.equipHero]) ui.equipHero = st.party.filter(Boolean)[0] || Object.keys(st.heroes)[0];
    return ui.equipHero;
  }

  UI.register({
    id: 'equip', name: '装備', icon: '装', nav: 'main',
    render: function (el) {
      var st = UI.st(), hid = curHero(st), hd = D.HEROES[hid], h = st.heroes[hid];
      var eqMap = AL.Inv.equippedSet(st), items = AL.Stats.itemMap(st);
      var syn = st.party.indexOf(hid) >= 0 ? AL.Stats.synergyBonusFor(hid, AL.Stats.synergies(st.party)) : {};
      var s = AL.Stats.hero(st, hid, { synergy: syn });
      var f = ui.invFilter, slot = ui.equipSlot || '';
      // 仲間の選択
      var others = Object.keys(st.heroes).filter(function (id) { return st.party.indexOf(id) < 0; });
      var heroSel = '<div class="chips">' + st.party.filter(Boolean).map(function (id) {
        return '<button class="chip' + (id === hid ? ' on' : '') + '" data-act="equipHero" data-id="' + id + '">' + esc(U.shortName(D.HEROES[id].name)) + '</button>'; }).join('') +
        (others.length ? '<select data-change="equipHeroSel" style="min-height:36px"><option value="">その他の仲間…</option>' + others.map(function (id) {
          return '<option value="' + id + '"' + (id === hid ? ' selected' : '') + '>' + esc(D.HEROES[id].name) + '</option>'; }).join('') + '</select>' : '') + '</div>';
      var slots = D.SLOTS.map(function (sl) {
        var it = items[h.equip[sl]];
        return '<div class="slot' + (it ? ' filled' : '') + (slot === sl ? ' active' : '') + '" data-act="equipSlot" data-slot="' + sl + '">' + (it ? UI.itemImg(it) : '') +
          '<div style="min-width:0"><div class="sl">' + D.SLOT_NAMES[sl] + '</div><div class="nm ellipsis" style="color:' + (it ? UI.rarityColor(it.rarity) : 'var(--dim)') + '">' + (it ? esc(AL.Inv.name(it)) + (it.enh ? ' +' + it.enh : '') : '未装備') + '</div></div></div>';
      }).join('');
      var sets = s.sets.map(function (si) {
        var set = D.SETS[si.id];
        return '<div class="tiny"><b style="color:' + set.color + '">' + esc(set.name) + '</b> ' + si.count + '/6 ' + Object.keys(set.bonuses).map(function (n) {
          return '<span class="' + (si.count >= +n ? 'good' : 'dim') + '">(' + n + ')' + esc(set.bonuses[n].desc) + '</span>'; }).join(' ') + '</div>';
      }).join('');
      // 所持品
      var list = st.items.filter(function (it) {
        var b = D.EQUIP_BASES[it.base];
        if (slot && b.slot !== slot) return false;
        if (it.rarity < f.minR) return false;
        if (f.set && !it.set) return false;
        if (f.show === 'free' && eqMap[it.uid]) return false;
        if (f.show === 'locked' && !it.locked) return false;
        return true;
      });
      list = f.sort === 'score' ? list.slice().sort(function (a, b) { return AL.Stats.itemScore(b, hd.role) - AL.Stats.itemScore(a, hd.role); }) : AL.Inv.sortItems(list, f.sort);
      var page = ui.invPage || 1, shown = list.slice(0, page * PAGE);
      el.innerHTML = '<div class="screen-title">装備 <span class="tag">所持 ' + st.items.length + ' / ' + C.EQUIP.INVENTORY_CAP + '</span></div>' +
        (st.items.length >= C.EQUIP.INVENTORY_CAP * 0.9 ? '<div class="notice danger">所持数が上限に近づいています。上限を超えた装備は自動で売却されます。</div>' : '') +
        '<div class="panel">' + heroSel +
        '<div class="row mt">' + UI.heroImg(hid, 48) + '<div class="grow"><b>' + esc(hd.name) + '</b> <span class="tiny">' + UI.roleTag(hd.role) + '</span><div class="tiny sub">戦力 <b class="gold">' + U.fmt(s.power) + '</b>　攻 ' + U.fmt(s.atk) + '　HP ' + U.fmt(s.hp) + '　防 ' + U.fmt(s.def) + '　魔防 ' + U.fmt(s.res) +
        '　速 ' + s.spd.toFixed(2) + '　会心 ' + U.pct(s.crit) + '</div></div></div>' +
        '<div class="slots mt">' + slots + '</div>' + (sets ? '<div class="mt">' + sets + '</div>' : '') +
        '<div class="btn-group mt"><button class="btn sm primary" data-act="autoEquipHero" data-id="' + hid + '">最適装備</button><button class="btn sm" data-act="unequipAll">全て外す</button>' +
        '<button class="btn sm" data-act="autoEquipParty">編成全員を最適装備</button></div></div>' +
        '<div class="panel"><div class="chips"><button class="chip' + (!slot ? ' on' : '') + '" data-act="equipSlot" data-slot="">全部位</button>' +
        D.SLOTS.map(function (sl) { return '<button class="chip' + (slot === sl ? ' on' : '') + '" data-act="equipSlot" data-slot="' + sl + '">' + D.SLOT_NAMES[sl] + '</button>'; }).join('') + '</div>' +
        '<div class="row wrap mt"><select data-change="invMinR">' + D.EQUIP_RARITY.map(function (r) { return '<option value="' + r.id + '"' + (f.minR === r.id ? ' selected' : '') + '>' + (r.id ? r.name + '以上' : '全レアリティ') + '</option>'; }).join('') + '</select>' +
        '<select data-change="invSort">' + [['rarity', 'レア順'], ['score', 'おすすめ順'], ['ilvl', '装備Lv順'], ['slot', '部位順'], ['newest', '新しい順']].map(function (o) { return '<option value="' + o[0] + '"' + (f.sort === o[0] ? ' selected' : '') + '>' + o[1] + '</option>'; }).join('') + '</select>' +
        '<select data-change="invShow">' + [['all', 'すべて'], ['free', '未装備のみ'], ['locked', 'ロック中のみ']].map(function (o) { return '<option value="' + o[0] + '"' + (f.show === o[0] ? ' selected' : '') + '>' + o[1] + '</option>'; }).join('') + '</select>' +
        '<button class="chip' + (f.set ? ' on' : '') + '" data-act="invSetOnly">セットのみ</button></div>' +
        '<div class="btn-group mt"><button class="btn sm danger" data-act="bulkSell">一括売却</button><span class="tiny sub" style="align-self:center">自動売却：' + (st.settings.autoSell >= 0 ? D.EQUIP_RARITY[st.settings.autoSell].name + '以下' : 'OFF') + '（設定で変更）</span></div></div>' +
        '<div class="list">' + (shown.map(function (it) { return UI.itemRow(it, { eqMap: eqMap }); }).join('') || '<div class="dim panel">該当する装備がありません</div>') + '</div>' +
        (list.length > shown.length ? '<button class="btn block more-btn" data-act="invMore">さらに表示（残り' + (list.length - shown.length) + '）</button>' : '');
    }
  });
  UI.listen(['inventory', 'loadout', 'stateReplaced'], ['equip']);

  UI.action('equipHero', function (el) { ui.equipHero = el.dataset.id; UI.render(); });
  UI.action('equipHeroSel', function (el) { if (el.value) { ui.equipHero = el.value; UI.render(); } });
  UI.action('equipSlot', function (el) { ui.equipSlot = ui.equipSlot === el.dataset.slot ? '' : el.dataset.slot; ui.invPage = 1; UI.render(); });
  UI.action('invMinR', function (el) { ui.invFilter.minR = +el.value; ui.invPage = 1; UI.render(); });
  UI.action('invSort', function (el) { ui.invFilter.sort = el.value; UI.render(); });
  UI.action('invShow', function (el) { ui.invFilter.show = el.value; ui.invPage = 1; UI.render(); });
  UI.action('invSetOnly', function () { ui.invFilter.set = !ui.invFilter.set; ui.invPage = 1; UI.render(); });
  UI.action('invMore', function () { ui.invPage = (ui.invPage || 1) + 1; UI.render(); });
  UI.action('unequipAll', function () {
    var st = UI.st(), hid = curHero(st);
    D.SLOTS.forEach(function (sl) { st.heroes[hid].equip[sl] = null; });
    AL.Stats.invalidate(); AL.Events.emit('loadout'); AL.Events.emit('inventory');
    UI.toast('装備をすべて外しました');
  });
  UI.action('autoEquipParty', function () {
    var st = UI.st(), n = 0;
    st.party.forEach(function (id) { if (id) n += AL.Inv.autoEquip(st, id); });
    UI.toast(n ? n + '部位を更新しました' : 'より良い装備はありません', n ? 'good' : '');
    UI.render();
  });

  UI.action('bulkSell', function () {
    var st = UI.st();
    var html = '<div class="small">未装備・未ロックの装備をレアリティで指定して売却します。</div><div class="list mt">' +
      [0, 1, 2, 3].map(function (r) {
        var l = AL.Inv.sellableList(st, r, false), g = 0;
        l.forEach(function (it) { g += AL.Inv.sellValue(it); });
        return '<button class="btn block" data-act="bulkSellDo" data-r="' + r + '"' + (l.length ? '' : ' disabled') + '><span style="color:' + D.EQUIP_RARITY[r].color + '">' + D.EQUIP_RARITY[r].name + '以下</span>　' + l.length + '個<span class="cost">+' + U.fmt(g) + 'G</span></button>';
      }).join('') + '</div><div class="tiny dim mt">セット装備は一括売却の対象外です（個別に売却できます）。</div>';
    UI.modal({ id: 'bulk', title: '一括売却', html: html });
  });
  UI.action('bulkSellDo', function (el) {
    var r = +el.dataset.r, st = UI.st();
    var l = AL.Inv.sellableList(st, r, false);
    UI.confirm({ title: '一括売却の確認', html: D.EQUIP_RARITY[r].name + '以下の装備 <b>' + l.length + '個</b> を売却します。よろしいですか？', ok: '売却する', danger: true,
      onOk: function () { var res = AL.Inv.sellBulk(st, r, false); UI.closeModal('bulk'); UI.toast(res.count + '個売却：+' + U.fmt(res.gold) + 'G' + (res.stones ? ' 強化石+' + res.stones : ''), 'good'); UI.renderCurrency(); } });
  });

  // ===== 装備の詳細・比較 =====
  function compareHtml(st, it, hid) {
    var hd = D.HEROES[hid], h = st.heroes[hid];
    var slot = D.EQUIP_BASES[it.base].slot;
    var cur = AL.Stats.itemMap(st)[h.equip[slot]];
    if (cur && cur.uid === it.uid) return '<div class="tiny good">' + esc(hd.name) + 'が装備中</div>';
    var syn = st.party.indexOf(hid) >= 0 ? AL.Stats.synergyBonusFor(hid, AL.Stats.synergies(st.party)) : {};
    var before = AL.Stats.hero(st, hid, { synergy: syn });
    var ov = {}; D.SLOTS.forEach(function (sl) { ov[sl] = AL.Stats.itemMap(st)[h.equip[sl]] || null; });
    ov[slot] = it;
    var after = AL.Stats.hero(st, hid, { synergy: syn, equip: ov });
    function diff(k, pct) {
      var d = after[k] - before[k];
      if (Math.abs(d) < 1e-9) return '<span class="dim">±0</span>';
      var txt = pct ? U.pct(Math.abs(d)) : U.fmt(Math.abs(d));
      return '<span class="' + (d > 0 ? 'diff-up' : 'diff-down') + '">' + (d > 0 ? '▲' : '▼') + txt + '</span>';
    }
    return '<div class="small sub">' + esc(hd.name) + 'に装備した場合' + (cur ? '（現在：<span style="color:' + UI.rarityColor(cur.rarity) + '">' + esc(AL.Inv.name(cur)) + (cur.enh ? '+' + cur.enh : '') + '</span>）' : '（現在：未装備）') + '</div>' +
      '<div class="stat-table mt">' + [['戦力', 'power'], ['HP', 'hp'], ['攻撃力', 'atk'], ['防御力', 'def'], ['魔法防御', 'res']].map(function (r) {
        return '<div><span class="sub">' + r[0] + '</span>' + diff(r[1]) + '</div>'; }).join('') +
      [['会心率', 'crit'], ['会心ダメ', 'critDmg'], ['スキル威力', 'skillPow'], ['回復量', 'healPow']].map(function (r) { return '<div><span class="sub">' + r[0] + '</span>' + diff(r[1], true) + '</div>'; }).join('') +
      '<div><span class="sub">攻撃速度</span>' + (Math.abs(after.spd - before.spd) < 1e-9 ? '<span class="dim">±0</span>' : '<span class="' + (after.spd > before.spd ? 'diff-up' : 'diff-down') + '">' + (after.spd > before.spd ? '▲' : '▼') + Math.abs(after.spd - before.spd).toFixed(2) + '</span>') + '</div></div>';
  }
  function itemDetailHtml(uid) {
    var st = UI.st(), it = AL.Inv.find(st, uid);
    if (!it) return '<div class="dim">この装備はもうありません</div>';
    var b = D.EQUIP_BASES[it.base], R = D.EQUIP_RARITY[it.rarity], stt = AL.Stats.itemStats(it);
    var owner = AL.Inv.equippedBy(st, uid), hid = curHero(st);
    var cost = AL.Inv.enhanceCost(it);
    var setHtml = '';
    if (it.set) {
      var set = D.SETS[it.set];
      var cnt = (AL.Stats.setInfo(st, owner || hid).filter(function (x) { return x.id === it.set; })[0] || { count: 0 }).count;
      setHtml = '<div class="panel" style="border-color:' + set.color + '"><h3 style="color:' + set.color + '">セット：' + esc(set.name) + '</h3>' +
        Object.keys(set.bonuses).map(function (n) { return '<div class="small ' + (cnt >= +n ? 'good' : 'sub') + '">' + n + '部位：' + esc(set.bonuses[n].desc) + '</div>'; }).join('') +
        '<div class="tiny dim">' + esc(D.HEROES[owner || hid].name) + 'の装着数：' + cnt + '/6（異なる部位を揃えると発動）</div></div>';
    }
    return '<div class="row">' + '<img class="px" src="' + AL.Sprites.itemUrl(it.base, it.rarity) + '" width="64" height="64" style="background:#0f0d18;border-radius:10px;border:2px solid ' + R.color + '">' +
      '<div class="grow"><div style="font-weight:900;color:' + R.color + '">' + (it.locked ? '🔒' : '') + esc(AL.Inv.name(it)) + (it.enh ? ' +' + it.enh : '') + '</div>' +
      '<div class="small sub">' + R.name + '・' + D.SLOT_NAMES[b.slot] + '・装備Lv ' + it.ilvl + '・強化 ' + it.enh + '/' + R.maxEnh + '</div>' +
      (owner ? '<div class="tiny good">' + esc(D.HEROES[owner].name) + 'が装備中</div>' : '') + '</div></div>' +
      '<div class="panel mt"><div class="kv"><span>' + UI.statName(it.main.stat) + '（基礎）</span><b>+' + UI.statVal(it.main.stat, stt[it.main.stat] - it.subs.filter(function (s) { return s.stat === it.main.stat; }).reduce(function (a, s) { return a + s.value; }, 0)) + '</b></div>' +
      it.subs.map(function (sb) { return '<div class="kv"><span class="sub">' + UI.statName(sb.stat) + (sb.rolls > 1 ? ' <span class="tiny gold">強化' + (sb.rolls - 1) + '回</span>' : '') + '</span><span>+' + UI.statVal(sb.stat, sb.value) + '</span></div>'; }).join('') +
      (it.subs.length ? '' : '<div class="tiny dim">追加能力なし</div>') + '</div>' + setHtml +
      '<div class="panel">' + compareHtml(st, it, hid) + '</div>' +
      '<div class="tiny dim">強化：基礎能力+' + (C.EQUIP.ENH_MAIN * 100) + '%／' + C.EQUIP.SUB_UPGRADE_EVERY + '段階ごとに追加能力の1つが上昇。売却額 ' + U.fmt(AL.Inv.sellValue(it)) + 'G</div>' +
      '<div class="btn-group mt">' +
      (owner === hid ? '<button class="btn" data-act="itemUnequip" data-uid="' + uid + '">外す</button>' : '<button class="btn primary" data-act="itemEquip" data-uid="' + uid + '">' + esc(U.shortName(D.HEROES[hid].name)) + 'に装備</button>') +
      (owner && owner !== hid ? '<button class="btn" data-act="itemUnequip" data-uid="' + uid + '">外す</button>' : '') +
      '<button class="btn gold" data-act="itemEnh" data-uid="' + uid + '" data-n="1"' + (it.enh >= R.maxEnh ? ' disabled' : '') + '>強化<span class="cost">' + U.fmt(cost.gold) + 'G・石' + cost.stones + '</span></button>' +
      '<button class="btn gold" data-act="itemEnh" data-uid="' + uid + '" data-n="5"' + (it.enh >= R.maxEnh ? ' disabled' : '') + '>×5</button>' +
      '<button class="btn" data-act="itemLock" data-uid="' + uid + '">' + (it.locked ? 'ロック解除' : 'ロック') + '</button>' +
      '<button class="btn danger" data-act="itemSell" data-uid="' + uid + '"' + (it.locked || owner ? ' disabled' : '') + '>売却</button></div>' +
      (it.locked ? '' : '<div class="tiny dim mt">ロックすると売却・一括売却・転生時の消滅から保護されます。</div>');
  }
  UI.itemDetail = function (uid) {
    var m = UI.topModal('item');
    if (m) { m.uid = uid; m.el.querySelector('.modal-body').innerHTML = itemDetailHtml(uid); return; }
    UI.modal({ id: 'item', title: '装備の詳細', html: itemDetailHtml(uid) });
    UI.topModal('item').uid = uid;
  };
  function refreshItem() { var m = UI.topModal('item'); if (m) m.el.querySelector('.modal-body').innerHTML = itemDetailHtml(m.uid); UI.renderCurrency(); }
  UI.action('itemDetail', function (el) { UI.itemDetail(el.dataset.uid); });
  UI.action('itemEquip', function (el) { var st = UI.st(); AL.Inv.equip(st, curHero(st), el.dataset.uid); UI.toast('装備しました', 'good'); refreshItem(); });
  UI.action('itemUnequip', function (el) {
    var st = UI.st(), uid = el.dataset.uid, owner = AL.Inv.equippedBy(st, uid);
    if (owner) AL.Inv.unequip(st, owner, D.EQUIP_BASES[AL.Inv.find(st, uid).base].slot);
    UI.toast('外しました'); refreshItem();
  });
  UI.action('itemEnh', function (el) {
    var st = UI.st(), n = +el.dataset.n, ok = 0, last = null, ups = [];
    for (var i = 0; i < n; i++) { last = AL.Inv.enhance(st, el.dataset.uid); if (!last.ok) break; ok++; if (last.upgraded) ups.push(D.STATS[last.upgraded].name); }
    if (ok) UI.toast('強化成功 ×' + ok + (ups.length ? '（' + ups.join('・') + '上昇）' : ''), 'good');
    else UI.toast(last.msg, 'bad');
    if (ok) AL.Events.emit('loadout');
    refreshItem();
  });
  UI.action('itemLock', function (el) { var l = AL.Inv.toggleLock(UI.st(), el.dataset.uid); UI.toast(l ? 'ロックしました' : 'ロックを解除しました'); refreshItem(); });
  UI.action('itemSell', function (el) {
    var st = UI.st(), it = AL.Inv.find(st, el.dataset.uid);
    function doSell() { var r = AL.Inv.sell(st, el.dataset.uid); UI.toast(r.ok ? '売却：+' + U.fmt(r.gold) + 'G' : r.msg, r.ok ? 'good' : 'bad'); if (r.ok) UI.closeModal('item'); UI.renderCurrency(); }
    if (it && (it.rarity >= 3 || it.enh > 0 || it.set)) UI.confirm({ title: '売却の確認', html: '<b style="color:' + UI.rarityColor(it.rarity) + '">' + esc(AL.Inv.name(it)) + '</b> を売却します。よろしいですか？', ok: '売却', danger: true, onOk: doSell });
    else doSell();
  });
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>/* js/ui/gacha.js */
/* ABYSSAL LEGENDS - ガチャ画面（バナー・排出率表示・天井・履歴・召喚演出） */
(function (G) {
  'use strict';
  var AL = G.AL = G.AL || {};
  var D = AL.DATA, U = AL.U, C = AL.CONFIG, UI = AL.UI;
  var esc = U.esc;
  var ui = UI.ui;

  UI.register({
    id: 'gacha', name: 'ガチャ', icon: '召', nav: 'main',
    render: function (el) {
      var st = UI.st(), banners = AL.Gacha.banners();
      if (!ui.banner || !banners.some(function (b) { return b.id === ui.banner; })) ui.banner = banners[banners.length - 1].id;
      var b = AL.Gacha.banner(ui.banner);
      var pity = st.gacha.pity[b.type] || 0;
      var feat = b.type === 'pickup' ? b.pickup : ['h03', 'h01', 'h04'];
      var bg = 'linear-gradient(135deg,' + b.color + '55, #0a0812 70%), radial-gradient(circle at 80% 20%, ' + b.color + '66, transparent 60%)';
      el.innerHTML = '<div class="screen-title">ガチャ <span class="tag">魂晶 ' + U.fmt(st.currency.crystals) + '</span></div>' +
        '<div class="tabs">' + banners.map(function (x) { return '<button class="' + (x.id === b.id ? 'on' : '') + '" data-act="bannerSel" data-id="' + x.id + '">' + (x.type === 'pickup' ? 'ピックアップ' : '常設') + '</button>'; }).join('') + '</div>' +
        '<div class="banner-card" style="background:' + bg + '"><h2>' + esc(b.name) + '</h2><div class="bdesc">' + esc(b.desc) + '</div>' +
        '<div class="feat">' + feat.map(function (id) { return UI.heroImg(id, 72); }).join('') + '</div>' +
        (b.type === 'pickup' ? '<div class="bdesc mt">対象：' + b.pickup.map(function (id) { return '<b>' + esc(D.HEROES[id].name) + '</b>'; }).join('、') + '<br><span class="tiny">終了まで ' + U.fmtTime((b.endsAt - Date.now()) / 1000) + '（毎週月曜9時に入れ替え）</span></div>' : '') + '</div>' +
        '<div class="panel mt"><div class="row between"><div class="pity">天井まで あと <b class="gold">' + (C.GACHA.PITY - pity) + '</b> 回<div class="tiny sub">' + (b.type === 'pickup' ? 'ピックアップ' : '常設') + '用カウント：' + pity + ' / ' + C.GACHA.PITY + '</div></div>' +
        '<div class="bar" style="width:40%"><i style="width:' + (pity / C.GACHA.PITY * 100).toFixed(1) + '%"></i></div></div>' +
        '<div class="btn-group mt"><button class="btn primary grow" data-act="pull" data-n="1"' + (st.currency.crystals >= C.GACHA.COST_SINGLE ? '' : ' disabled') + '>1回召喚<span class="cost">魂晶' + C.GACHA.COST_SINGLE + '</span></button>' +
        '<button class="btn gold grow" data-act="pull" data-n="10"' + (st.currency.crystals >= C.GACHA.COST_TEN ? '' : ' disabled') + '>10回召喚<span class="cost">魂晶' + C.GACHA.COST_TEN + '</span></button></div>' +
        '<div class="tiny sub mt">★5 ' + U.pct(C.GACHA.RATES[5]) + '・★4 ' + U.pct(C.GACHA.RATES[4]) + '・★3 ' + U.pct(C.GACHA.RATES[3]) + '。' + C.GACHA.PITY + '回目は★5確定' + (b.type === 'pickup' ? '（ピックアップ対象から）' : '') + '、10回召喚の10回目は★4以上確定。</div>' +
        '<div class="btn-group mt"><button class="btn sm" data-act="gachaRates">排出率・対象一覧</button><button class="btn sm" data-act="gachaHistory">召喚履歴</button></div></div>' +
        '<div class="panel"><h3>魂晶の入手方法</h3><div class="small sub">ボス撃破・実績・ダンジョン（ボスラッシュ／深淵の試練）・放置報酬・ショップ（ゴールドで交換）。課金要素はありません。</div></div>';
    }
  });
  UI.listen(['gacha', 'stateReplaced'], ['gacha']);
  UI.action('bannerSel', function (el) { ui.banner = el.dataset.id; UI.render(); });

  UI.action('gachaRates', function () {
    var b = AL.Gacha.banner(ui.banner), table = AL.Gacha.rateTable(b);
    var html = '<div class="notice info">表示している排出率は、実際の抽選処理が使う表と同一のデータです（' + esc(b.name) + '）。</div>';
    [5, 4, 3].forEach(function (r) {
      var rows = table.filter(function (e) { return e.rarity === r; });
      var sum = rows.reduce(function (a, e) { return a + e.rate; }, 0);
      html += '<h3 class="mt">' + UI.stars(r) + ' 合計 ' + U.pct(sum, 2) + '</h3><table class="rate-table">' + rows.map(function (e) {

    html += '<div class="small sub mt">・' + C.GACHA.PITY + '回目は★5が確定' + (b.type === 'pickup' ? '（ピックアップ★5から等確率）' : '（★5から等確率）') + '。★5が出ると天井カウントは0に戻ります。<br>・天井カウントは「常設」「ピックアップ」の種類ごとに管理し、ピックアップの入れ替え後も引き継がれます。<br>・10回召喚で9回目までに★4以上が出なかった場合、10回目は★4以上の中から上表の比率で抽選します。</div>';

  UI.action('gachaHistory', function () {

  UI.action('pull', function (el) {

    UI.renderCurrency(); UI.render();
  });

  // ===== 召喚演出 =====
  UI.gachaAnim = function (results) {
    var best = Math.max.apply(null, results.map(function (r) { return r.rarity; }));
    var col = best === 5 ? '#ffcc4d' : (best === 4 ? '#c58bff' : '#6aa8ff');
    var ov = document.createElement('div');
    ov.className = 'gacha-overlay';
    ov.innerHTML = '<canvas width="420" height="420"></canvas><div class="tiny sub mt">タップでスキップ</div>';
    document.body.appendChild(ov);
    var cv = ov.querySelector('canvas'), x = cv.getContext('2d'), t0 = performance.now(), done = false, raf;
    var parts = [];
    function draw(now) {
      var t = (now - t0) / 1000;
      x.clearRect(0, 0, 420, 420);
      x.save(); x.translate(210, 210);
      var p = Math.min(1, t / 1.6);
      // 魔法陣
      for (var ring = 0; ring < 3; ring++) {
        x.strokeStyle = AL.Sprites.rgba(ring === 0 ? col : '#8b6cff', 0.3 + 0.5 * p);
        x.lineWidth = 2; x.beginPath(); x.arc(0, 0, 60 + ring * 45, 0, Math.PI * 2 * Math.min(1, p * 1.5 + ring * 0.1)); x.stroke();
      }
      x.rotate(t * (1 + p * 3));
      for (var i = 0; i < 6; i++) {
        x.rotate(Math.PI / 3);
        x.fillStyle = AL.Sprites.rgba(col, 0.6 * p);
        x.fillRect(100, -2, 30, 4);
        x.fillRect(150, -1, 8, 8);
      }
      x.restore();
      if (Math.random() < 0.8) parts.push({ a: Math.random() * 7, r: 200, s: 2 + Math.random() * 3 });
      parts.forEach(function (q) { q.r -= 3 + p * 6; x.fillStyle = col; x.fillRect(210 + Math.cos(q.a) * q.r, 210 + Math.sin(q.a) * q.r, q.s, q.s); });
      parts = parts.filter(function (q) { return q.r > 5; });
      if (t > 1.4) { var g = x.createRadialGradient(210, 210, 0, 210, 210, 200 * (t - 1.4) * 4); g.addColorStop(0, '#fff'); g.addColorStop(1, AL.Sprites.rgba(col, 0)); x.fillStyle = g; x.fillRect(0, 0, 420, 420); }
      if (t < 1.75) raf = requestAnimationFrame(draw); else showResults();
    }
    function showResults() {
      if (done) return; done = true;
      cancelAnimationFrame(raf);
      ov.innerHTML = '<div class="gacha-results' + (results.length === 1 ? ' one' : '') + '">' + results.map(function (r) {
        var hd = D.HEROES[r.id];
        return '<div class="gres r' + r.rarity + '">' + (r.isNew ? '<span class="new">NEW</span>' : '') + UI.heroImg(r.id, 64) + '<div>' + UI.stars(r.rarity) + '</div><div class="nm">' + esc(hd.name) + '</div>' +
          '<div class="lbtag">' + (r.isNew ? '' : (r.shards ? '欠片+' + r.shards : '限界突破 ' + r.lb)) + '</div></div>';
      }).join('') + '</div><button class="btn primary mt" data-close style="min-width:200px">OK</button>';
      var cards = ov.querySelectorAll('.gres');
      Array.prototype.forEach.call(cards, function (c, i) { setTimeout(function () { c.classList.add('show'); }, 90 * i + 50); });
      ov.querySelector('[data-close]').addEventListener('click', function () { ov.remove(); });
    }
    ov.addEventListener('click', function (e) { if (!done) { e.stopPropagation(); showResults(); } });
    raf = requestAnimationFrame(draw);
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>

  UI.action('codexEnemy', function (el) {
