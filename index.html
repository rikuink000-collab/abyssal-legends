<script>/* js/core/systems.js */
/* ABYSSAL LEGENDS - 各種システム：挑戦券・転生・放置報酬・実績・ショップ */
(function (G) {
  'use strict';
  var AL = G.AL = G.AL || {};
  var C = AL.CONFIG, D = AL.DATA, U = AL.U;

  // ================= 挑戦券 =================
  var Dungeon = AL.Dungeon = {};
  Dungeon.regenTickets = function (state, now) {
    now = now || Date.now();
    var period = C.TICKETS.REGEN_MIN * 60000;
    if (now < state.ticketRegenAt) { state.ticketRegenAt = now; return 0; } // 時計の巻き戻し：回復しない
    if (state.currency.tickets >= C.TICKETS.MAX) { state.ticketRegenAt = now; return 0; }
    var n = Math.floor((now - state.ticketRegenAt) / period);
    if (n <= 0) return 0;
    var add = Math.min(n, C.TICKETS.MAX - state.currency.tickets);
    state.currency.tickets += add;
    state.ticketRegenAt = state.currency.tickets >= C.TICKETS.MAX ? now : state.ticketRegenAt + n * period;
    return add;
  };
  Dungeon.nextTicketIn = function (state, now) {
    if (state.currency.tickets >= C.TICKETS.MAX) return 0;
    var period = C.TICKETS.REGEN_MIN * 60000;
    return Math.max(0, (state.ticketRegenAt + period - (now || Date.now())) / 1000);
  };

  // ================= 転生 =================
  var Rebirth = AL.Rebirth = {};
  Rebirth.pointsFor = function (maxFloor) {
    if (maxFloor < C.REBIRTH.MIN_FLOOR) return 0;
    return Math.floor(C.REBIRTH.POINT_BASE * Math.pow(maxFloor / C.REBIRTH.MIN_FLOOR, C.REBIRTH.POINT_EXP));
  };
  Rebirth.canRebirth = function (state) { return state.tower.maxFloor >= C.REBIRTH.MIN_FLOOR; };
  Rebirth.upgradeCost = function (u, lv) { return Math.ceil(u.base * Math.pow(u.growth, lv)); };
  Rebirth.startFloor = function (state) { return 1 + AL.Stats.rebirthEff(state).startFloor; };

  // リセット内容（UIでも同じ定義を表示）
  Rebirth.RESETS = ['現在の階層・最高到達階層（今回の周回）', 'ゴールド・経験値・強化石', '全仲間のレベル（Lv1に戻る）', 'ロックしていない装備（装備中でも消滅）'];
  Rebirth.KEEPS = ['仲間と限界突破・英雄の欠片', 'ロックした装備（強化値・装着状態も維持）', '魂晶・挑戦券', '転生ポイント・転生強化・転生回数',
    'ガチャ履歴・天井カウント', 'ダンジョン記録・実績・図鑑', '通算の最高到達階層・設定'];

  Rebirth.perform = function (state) {
    if (!Rebirth.canRebirth(state)) return { ok: false, msg: '第' + C.REBIRTH.MIN_FLOOR + '層に到達すると転生できます' };
    var pts = Rebirth.pointsFor(state.tower.maxFloor);
    var prevFloor = state.tower.maxFloor;
    state.stats.maxFloorEver = Math.max(state.stats.maxFloorEver, prevFloor);
    state.currency.rebirthPts += pts;
    state.rebirth.totalPts += pts;
    state.rebirth.count++;
    state.stats.rebirths = state.rebirth.count;
    // リセット
    var start = Rebirth.startFloor(state);
    state.tower = { floor: start, wave: 0, maxFloor: start, autoAdvance: true, blockedFloor: 0 };
    state.currency.gold = C.START.gold;
    state.currency.exp = 0;
    state.currency.stones = C.START.stones;
    var keep = {};
    state.items = state.items.filter(function (it) { if (it.locked) { keep[it.uid] = true; return true; } return false; });
    Object.keys(state.heroes).forEach(function (id) {
      var h = state.heroes[id];
      h.lv = 1;
      D.SLOTS.forEach(function (sl) { if (h.equip[sl] && !keep[h.equip[sl]]) h.equip[sl] = null; });
    });
    AL.Stats.invalidate();
    AL.Events.emit('rebirth', { pts: pts, count: state.rebirth.count });
    return { ok: true, pts: pts, prevFloor: prevFloor, start: start, kept: Object.keys(keep).length };
  };

  Rebirth.buy = function (state, id) {
    var u = D.REBIRTH_UPGRADES.filter(function (x) { return x.id === id; })[0];
    if (!u) return { ok: false, msg: '不明な強化です' };
    var lv = state.rebirth.upgrades[id] || 0;
    if (u.max && lv >= u.max) return { ok: false, msg: '最大レベルです' };
    var cost = Rebirth.upgradeCost(u, lv);
    if (state.currency.rebirthPts < cost) return { ok: false, msg: '転生ポイントが足りません' };
    state.currency.rebirthPts -= cost;
    state.rebirth.upgrades[id] = lv + 1;
    AL.Events.emit('loadout');
    return { ok: true, lv: lv + 1 };
  };

  // ================= 放置報酬 =================
  var Idle = AL.Idle = {};
  Idle.maxSeconds = function (state) {
    var eff = AL.Stats.rebirthEff(state);
    return (C.IDLE.BASE_MAX_HOURS + eff.idleHours) * 3600;
  };
  Idle.efficiency = function (state) { return C.IDLE.EFFICIENCY + AL.Stats.rebirthEff(state).idleEff; };

  // 経過時間：最後に確認した最大時刻(maxSeen)以降のみを数える。時計を戻した場合は0。
  Idle.elapsed = function (state, now) {
    var ref = Math.max(state.lastSeen || 0, state.maxSeen || 0);
    var sec = (now - ref) / 1000;
    if (!isFinite(sec) || sec < 0) return { sec: 0, clockBack: sec < -300 };
    return { sec: sec, clockBack: false };
  };

  Idle.compute = function (state, sec) {
    var capSec = Idle.maxSeconds(state);
    var used = Math.min(sec, capSec);
    var floor = state.tower.floor;
    var eff = Idle.efficiency(state);
    var kills = state.idle.kpm * (used / 60) * eff;
    var avg = AL.Progress.killReward(state, { isBoss: false }, floor);
    var reb = AL.Stats.rebirthEff(state);
    var items = Math.min(C.IDLE.MAX_ITEMS, Math.floor(kills * C.REWARD.DROP_CHANCE * (1 + reb.dropMul) * 0.5));
    return {
      sec: sec, used: used, capped: sec > capSec, floor: floor, kills: Math.floor(kills), eff: eff,
      gold: U.safe(avg.gold * kills), exp: U.safe(avg.exp * kills),
      stones: Math.floor(kills * C.REWARD.STONE_CHANCE * 0.5),
      crystals: Math.floor(used / 600 * (1 + reb.crystalMul)),
      items: items
    };
  };

  Idle.claim = function (state, res, runner) {
    state.currency.gold = U.safe(state.currency.gold + res.gold);
    state.currency.exp = U.safe(state.currency.exp + res.exp);
    state.currency.stones += res.stones;
    state.currency.crystals += res.crystals;
    state.stats.goldEarned = U.safe(state.stats.goldEarned + res.gold);
    var kept = 0, sold = 0, best = -1;
    for (var i = 0; i < res.items; i++) {
      var it = AL.Inv.generate({ ilvl: res.floor, rarityBonus: state.rebirth.count * 0.05 });
      var r = runner ? runner.gainItem(it) : AL.Inv.add(state, it);
      if (r.kept) kept++; else sold++;
      best = Math.max(best, it.rarity);
    }
    state.stats.idleClaims++;
    state.idle.lastClaimTs = Date.now();
    var summary = Object.assign({}, res, { kept: kept, sold: sold, best: best });
    state.idle.lastResult = { t: Date.now(), sec: res.used, gold: res.gold, exp: res.exp, items: res.items };
    AL.Events.emit('idleClaim', summary);
    return summary;
  };

  // ================= 実績 =================
  var Ach = AL.Achievements = {};
  Ach.value = function (state, stat) {
    if (stat === 'heroesOwned') return Object.keys(state.heroes).length;
    if (stat === 'fullSets') {
      var n = 0;
      Object.keys(state.heroes).forEach(function (id) {
        AL.Stats.setInfo(state, id).forEach(function (s) { if (s.count >= 6) n++; });
      });
      state.stats.fullSets = Math.max(state.stats.fullSets, n);
      return state.stats.fullSets;
    }
    if (stat === 'maxLB') {
      var m = 0; Object.keys(state.heroes).forEach(function (id) { m = Math.max(m, state.heroes[id].lb); });

  };
  Ach.claim = function (state, id) {
    var a = D.ACHIEVEMENTS.filter(function (x) { return x.id === id; })[0];
    if (!a) return { ok: false, msg: '不明な実績' };
    var s = Ach.status(state, a);
    if (!s.done) return { ok: false, msg: '未達成です' };
    if (s.claimed) return { ok: false, msg: '受取済みです' };
    state.achievements.claimed[id] = true;
    if (a.reward.crystals) state.currency.crystals += a.reward.crystals;
    if (a.reward.stones) state.currency.stones += a.reward.stones;
    if (a.reward.gold) state.currency.gold += a.reward.gold;

  };

  // ================= ショップ =================

  };
  Shop.price = function (state, item) {
    var out = {};
    if (item.cost.gold) out.gold = U.safe(Math.floor(item.cost.gold * AL.Scale.reward(state.tower.maxFloor)));
    if (item.cost.shards) out.shards = item.cost.shards;
    return out;
  };
  Shop.remaining = function (state, item) {
    if (!item.limit) return Infinity;
    return Math.max(0, item.limit - (state.shop.bought[item.id] || 0));
  };
  Shop.buy = function (state, id, now) {
    Shop.refreshDay(state, now);
    var item = D.SHOP.filter(function (x) { return x.id === id; })[0];
    if (!item) return { ok: false, msg: '商品が見つかりません' };
    if (Shop.remaining(state, item) <= 0) return { ok: false, msg: '本日の購入上限です' };
    var p = Shop.price(state, item);
    if (p.gold && state.currency.gold < p.gold) return { ok: false, msg: 'ゴールドが足りません' };
    if (p.shards && state.currency.shards < p.shards) return { ok: false, msg: '英雄の欠片が足りません' };
    var g = item.give, msg = '';
    if (g.randomHero) {
      var cand = D.HERO_LIST.filter(function (h) { return h.rarity === g.randomHero && !state.heroes[h.id]; });
      if (!cand.length) return { ok: false, msg: '★' + g.randomHero + 'の仲間はすべて所持しています' };
    }
    if (p.gold) state.currency.gold -= p.gold;
    if (p.shards) state.currency.shards -= p.shards;
    if (g.stones) { state.currency.stones += g.stones; msg = '強化石を' + g.stones + '個獲得'; }
    if (g.tickets) { state.currency.tickets += g.tickets; msg = '挑戦券を' + g.tickets + '枚獲得'; }
    if (g.crystals) { state.currency.crystals += g.crystals; msg = '魂晶を' + g.crystals + '個獲得'; }
    if (g.expKills) {
      var e = AL.Progress.killReward(state, { isBoss: false }, state.tower.floor).exp * g.expKills;
      state.currency.exp = U.safe(state.currency.exp + e); msg = '経験値を' + U.fmt(e) + '獲得';
    }
    if (g.randomHero) {
      var h = U.pick(D.HERO_LIST.filter(function (x) { return x.rarity === g.randomHero && !state.heroes[x.id]; }));
      AL.Heroes.add(state, h.id); msg = h.name + 'が仲間になった！';
    }
    if (item.limit) state.shop.bought[item.id] = (state.shop.bought[item.id] || 0) + 1;
    return { ok: true, msg: msg };
  };
})(typeof window !== 'undefined' ? window : globalThis);

<script>/* js/core/game.js */
/* ABYSSAL LEGENDS - セーブ管理とゲーム本体（ループ・時間管理） */
(function (G) {
  'use strict';
  var AL = G.AL = G.AL || {};
  var C = AL.CONFIG, U = AL.U;

  // ================= ストレージ（localStorage／使えない環境ではメモリ） =================
  var mem = {};
  AL.Storage = {
    available: (function () {
      try { var k = '__al_test__'; G.localStorage.setItem(k, '1'); G.localStorage.removeItem(k); return true; } catch (e) { return false; }
    })(),
    get: function (k) { try { return this.available ? G.localStorage.getItem(k) : (k in mem ? mem[k] : null); } catch (e) { return null; } },
    set: function (k, v) {
      try { if (this.available) G.localStorage.setItem(k, v); else mem[k] = v; return true; }
      catch (e) { return false; }
    },
    remove: function (k) { try { if (this.available) G.localStorage.removeItem(k); else delete mem[k]; } catch (e) { /* noop */ } }
  };

  // ================= セーブ =================
  var Save = AL.Save = {};
  Save.serialize = function (state) { return JSON.stringify(state); };
  Save.write = function (state, opts) {
    opts = opts || {};
    var now = opts.now || Date.now();
    state.lastSeen = now;
    state.maxSeen = Math.max(state.maxSeen || 0, now);
    var text = Save.serialize(state);
    if (opts.backup) {
      var prev = AL.Storage.get(C.SAVE_KEY);
      if (prev) AL.Storage.set(C.BACKUP_KEY, prev);
    }
    var ok = AL.Storage.set(C.SAVE_KEY, text);
    return { ok: ok, size: text.length };
  };
  // 読み込み：本体が壊れていればバックアップを試し、それも駄目なら新規開始
  Save.read = function (now) {
    var main = AL.Storage.get(C.SAVE_KEY);
    if (main) {
      var r = AL.State.parse(main, now);
      if (r.ok) return { state: r.state, source: 'main', warnings: r.warnings };
      var bak = AL.Storage.get(C.BACKUP_KEY);
      if (bak) {
        var rb = AL.State.parse(bak, now);
        if (rb.ok) return { state: rb.state, source: 'backup', warnings: ['セーブデータが破損していたため、バックアップから復元しました'].concat(r.errors) };
      }
      AL.Storage.set(C.SAVE_KEY + '_corrupt_' + Date.now(), main);
      return { state: AL.State.createDefault(now), source: 'new', warnings: ['セーブデータが読み込めなかったため新しく開始しました（元データは別名で退避済み）'].concat(r.errors) };
    }
    return { state: AL.State.createDefault(now), source: 'new', warnings: [] };
  };
  Save.exportText = function (state) {
    var data = JSON.parse(Save.serialize(state));
    return JSON.stringify({ format: C.EXPORT_FORMAT, version: C.SAVE_VERSION, game: C.GAME_VERSION, savedAt: new Date().toISOString(),
      checksum: U.hash(JSON.stringify(data)), data: data }, null, 1);
  };
  Save.wipe = function () { AL.Storage.remove(C.SAVE_KEY); AL.Storage.remove(C.BACKUP_KEY); };

  // ================= ゲーム本体 =================
  var Game = AL.Game = {
    state: null, runner: null, lastReal: 0, autosaveAt: 0, secAcc: 0, kpmAcc: 0, pendingIdle: null, loadWarnings: [], paused: false
  };

  Game.init = function (opts) {
    opts = opts || {};
    var now = opts.now || Date.now();
    var loaded = opts.state ? { state: opts.state, warnings: [], source: 'given' } : Save.read(now);
    Game.state = loaded.state;
    Game.loadWarnings = loaded.warnings || [];
    U.notation = Game.state.settings.notation;
    // 中断されたダンジョンの挑戦券を返却
    if (Game.state.runInProgress) {
      var d = AL.Progress.dungeon(Game.state.runInProgress);
      if (d) Game.state.currency.tickets += d.ticket;
      Game.state.runInProgress = null;
      Game.loadWarnings.push('前回中断したダンジョンの挑戦券を返却しました');
    }
    AL.Shop.refreshDay(Game.state, now);
    AL.Dungeon.regenTickets(Game.state, now);
    Game.runner = new AL.Runner(Game.state);
    Game.runner.start();
    Game.checkOffline(now);
    Game.lastReal = now;
    Game.autosaveAt = now + C.AUTOSAVE_SEC * 1000;
    if (!Game._wired) {
      Game._wired = true;
      AL.Events.on('loadout', function () { if (Game.runner) Game.runner.rebuildAllies(true); });
    }
    return Game;
  };

  // 復帰時の経過時間チェック → 放置報酬を保留
  Game.checkOffline = function (now) {
    var el = AL.Idle.elapsed(Game.state, now);
    if (el.clockBack) Game.loadWarnings.push('端末の時刻が前回より過去に戻っています。放置報酬は前回の最終時刻以降の分のみ計算されます。');
    if (el.sec >= C.IDLE.MIN_SECONDS) {
      // 未受取分があれば経過時間を合算（上限時間は compute 側で適用）
      var sec = el.sec + (Game.pendingIdle ? Game.pendingIdle.sec : 0);
      var res = AL.Idle.compute(Game.state, sec);
      Game.pendingIdle = res;
      AL.Events.emit('idlePending', res);
    }
    Game.state.lastSeen = now;
    Game.state.maxSeen = Math.max(Game.state.maxSeen || 0, now);
  };

  Game.claimIdle = function () {
    if (!Game.pendingIdle) return null;
    var r = AL.Idle.claim(Game.state, Game.pendingIdle, Game.runner);
    Game.pendingIdle = null;
    Game.save();
    return r;
  };

  Game.speed = function () { return Game.state.settings.speed || 1; };

  // 実時間で進める。長時間の中断（タブ非表示・スリープ）は放置報酬として処理
  Game.frame = function (now) {
    now = now || Date.now();
    var realDt = (now - Game.lastReal) / 1000;
    Game.lastReal = now;
    if (!isFinite(realDt) || realDt < 0) realDt = 0;
    if (realDt > C.BATTLE.CATCHUP_MAX_SEC) {
      // 端末時刻(lastSeen)を基準に放置報酬へ
      Game.checkOffline(now);
      realDt = 0;
    }
    if (Game.paused) return;
    Game.runner.update(Math.min(realDt, C.BATTLE.CATCHUP_MAX_SEC) * Game.speed());
    Game.secAcc += realDt;
    if (Game.secAcc >= 1) Game.perSecond(now, Game.secAcc);
    if (now >= Game.autosaveAt) { Game.save(); }
  };

  Game.perSecond = function (now, dt) {
    var st = Game.state;
    Game.secAcc = 0;
    st.playTime += dt;
    st.lastSeen = now;
    st.maxSeen = Math.max(st.maxSeen || 0, now);
    AL.Dungeon.regenTickets(st, now);
    AL.Shop.refreshDay(st, now);
    if (st.settings.autoLevel) AL.Heroes.autoLevelParty(st);
    Game.kpmAcc += dt;
    if (Game.kpmAcc >= 10) { Game.kpmAcc = 0; Game.runner.measureKpm(); }
    AL.Events.emit('second');
  };

  Game.save = function (opts) {
    if (!Game.state) return { ok: false };
    Game.autosaveAt = Date.now() + C.AUTOSAVE_SEC * 1000;
    var r = Save.write(Game.state, opts);
    AL.Events.emit('saved', r);
    return r;
  };

  // 状態を差し替え（読み込み・初期化）
  Game.replaceState = function (state) {
    Game.state = state;
    U.notation = state.settings.notation;
    Game.pendingIdle = null;
    AL.Stats.invalidate();
    Game.runner = new AL.Runner(state);
    Game.runner.start();
    Game.lastReal = Date.now();
    Game.save();
    AL.Events.emit('stateReplaced');
  };

  Game.importText = function (text) {
    var r = AL.State.parse(text, Date.now());
    if (!r.ok) return r;
    // 読み込んだデータの時刻は現在に合わせる（読み込みで放置報酬を発生させない）
    r.state.lastSeen = Date.now();
    r.state.maxSeen = Math.max(r.state.maxSeen, r.state.lastSeen);
    Game.save({ backup: true });
    Game.replaceState(r.state);
    return r;
  };

  Game.resetAll = function () {
    Save.wipe();
    Game.replaceState(AL.State.createDefault(Date.now()));
  };

  Game.rebirth = function () {
    var r = AL.Rebirth.perform(Game.state);
    if (r.ok) {
      if (Game.runner.mode === 'dungeon') Game.runner.abandonDungeon();
      Game.runner = new AL.Runner(Game.state);
      Game.runner.start();
      Game.save({ backup: true });
      AL.Events.emit('stateReplaced');
    }
    return r;
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>

    var moving = runner.transition > 0;
    Scene.scroll += dt * (moving ? 80 * spd() : 3);
    var k = Scene.k;
    var sx = 0, sy = 0;
    if (t < Scene.shakeT) { sx = (Math.random() - 0.5) * Scene.shake; sy = (Math.random() - 0.5) * Scene.shake; } else Scene.shake = 0;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.imageSmoothingEnabled = false;
    ctx.clearRect(0, 0, Scene.canvas.width, Scene.canvas.height);
    ctx.setTransform(k, 0, 0, k, sx * k, sy * k);
    drawLayer(ctx, bg.far, Scene.scroll * 0.1, bg.w);
    drawLayer(ctx, bg.mid, Scene.scroll * 0.4, bg.w);
    drawLayer(ctx, bg.near, Scene.scroll, bg.w);
    // 霧と漂う光
    ctx.fillStyle = biome.fog; ctx.fillRect(0, 96, W, 40);
    if (Math.random() < 0.15 * quality()) Scene.motes.push({ x: Math.random() * W, y: 110 + Math.random() * 70, t0: t, life: 3 + Math.random() * 3, vx: (Math.random() - 0.5) * 4 - (moving ? 20 : 0) });
    Scene.motes = Scene.motes.filter(function (m) { return t - m.t0 < m.life; });
    Scene.motes.forEach(function (m) {
      var p = (t - m.t0) / m.life;
      ctx.fillStyle = S.rgba(biome.accent, 0.6 * Math.sin(p * Math.PI));
      ctx.fillRect(m.x + m.vx * (t - m.t0), m.y - p * 30, 1, 1);
    });
    // ボス戦の雰囲気
    var boss = battle.enemies.filter(function (e) { return e.isBoss && e.alive; })[0];
    if (boss) {
      var pulse = 0.18 + 0.08 * Math.sin(t * 3);
      var vg = ctx.createRadialGradient(W / 2, H / 2, 60, W / 2, H / 2, 200);
      vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(120,0,30,' + pulse + ')');
      ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
    }
    // ユニット描画（奥→手前）
    var units = [];
    battle.allies.forEach(function (u) { units.push(u); });
    if (!moving || battle.status === 'fight') battle.enemies.forEach(function (u) { units.push(u); });
    units.forEach(function (u) { vstate(u, battle, t); });
    units.sort(function (a, b) { return Scene.vs[a.uid].y - Scene.vs[b.uid].y; });
    units.forEach(function (u) { drawUnit(ctx, u, Scene.vs[u.uid], t, moving); });
    // 弾
    Scene.projs = Scene.projs.filter(function (p) {
      var q = (t - p.t0) / p.dur;
      if (q >= 1) { burst(p.x1, p.y1, p.color, 5, 30, 0.3); return false; }
      var x = U.lerp(p.x0, p.x1, q), y = U.lerp(p.y0, p.y1, q) - Math.sin(q * Math.PI) * 6;
      ctx.fillStyle = S.rgba(p.color, 0.35); ctx.beginPath(); ctx.arc(x, y, p.size + 2, 0, 7); ctx.fill();
      ctx.fillStyle = p.color; ctx.fillRect(Math.round(x - p.size / 2), Math.round(y - p.size / 2), p.size, p.size);
      ctx.fillStyle = '#fff'; ctx.fillRect(Math.round(x - 0.5), Math.round(y - 0.5), 1, 1);
      return true;
    });
    // 粒子
    Scene.fx = Scene.fx.filter(function (f) {
      var a = t - f.t0;
      if (a > f.life) return false;
      var x = f.x + f.vx * a, y = f.y + f.vy * a + 0.5 * f.grav * a * a;
      ctx.globalAlpha = 1 - a / f.life;
      ctx.fillStyle = f.color; ctx.fillRect(Math.round(x), Math.round(y), f.size, f.size);
      return true;
    });
    ctx.globalAlpha = 1;
    // 画面フラッシュ
    if (Scene.flash) {
      var fq = (t - Scene.flash.t0) / Scene.flash.dur;
      if (fq >= 1) Scene.flash = null;
      else { ctx.fillStyle = S.rgba(Scene.flash.color, 0.28 * (1 - fq)); ctx.fillRect(0, 0, W, H); }
    }
    // 数値
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    Scene.texts = Scene.texts.filter(function (tx) {
      var q = (t - tx.t0) / tx.dur;
      if (q >= 1) return false;
      var y = tx.y + tx.vy * q * (1 - q * 0.5);
      var sc = q < 0.12 ? 1 + (0.12 - q) * 3 : 1;
      ctx.globalAlpha = q > 0.7 ? (1 - q) / 0.3 : 1;
      ctx.font = 'bold ' + (tx.size * sc).toFixed(1) + 'px ' + FONT;
      ctx.lineWidth = 2.2; ctx.strokeStyle = tx.stroke; ctx.strokeText(tx.text, tx.x, y);
      ctx.fillStyle = tx.color; ctx.fillText(tx.text, tx.x, y);
      return true;
    });
    ctx.globalAlpha = 1;
    // ボスHPバー
    if (boss) drawBossBar(ctx, boss, t);
    // 移動中の表示
    if (moving && !Scene.banner && runner.mode === 'tower' && AL.Game.state.tower.wave === 0 && battle.status !== 'fight') {
      ctx.font = 'bold 9px ' + FONT; ctx.fillStyle = 'rgba(255,255,255,0.8)'; ctx.lineWidth = 2; ctx.strokeStyle = '#000';
      var msg = '第' + AL.Game.state.tower.floor + '層へ…';
      ctx.strokeText(msg, W / 2, 40); ctx.fillText(msg, W / 2, 40);
    }
    // バナー
    if (Scene.banner) {
      var bq = (t - Scene.banner.t0) / Scene.banner.dur;
      if (bq >= 1) Scene.banner = null;
      else {
        var al = bq < 0.1 ? bq / 0.1 : (bq > 0.8 ? (1 - bq) / 0.2 : 1);
        ctx.globalAlpha = al;
        ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(0, 62, W, Scene.banner.text ? 40 : 22);
        if (Scene.banner.text) {
          ctx.font = 'bold 20px ' + FONT; ctx.fillStyle = Scene.banner.color; ctx.lineWidth = 3; ctx.strokeStyle = '#000';
          var bx = W / 2 + (bq < 0.1 ? (0.1 - bq) * 400 : 0);
          ctx.strokeText(Scene.banner.text, bx, 77); ctx.fillText(Scene.banner.text, bx, 77);
          ctx.font = 'bold 8px ' + FONT; ctx.fillStyle = '#fff'; ctx.fillText(Scene.banner.sub, W / 2, 95);
        } else {
          ctx.font = 'bold 8px ' + FONT; ctx.fillStyle = Scene.banner.color; ctx.fillText(Scene.banner.sub, W / 2, 73);
        }
        ctx.globalAlpha = 1;
      }
    }
    // 掃除
    var live = {};
    battle.allies.concat(battle.enemies).forEach(function (u) { live[u.uid] = true; });
    Object.keys(Scene.vs).forEach(function (id) { if (!live[id]) delete Scene.vs[id]; });
  };

  function drawBossBar(ctx, b, t) {
    var x = 60, y = 8, w = 200, h = 6;
    ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(x - 2, y - 2, w + 4, h + 12);
    ctx.fillStyle = '#3a0a14'; ctx.fillRect(x, y + 8, w, h);
    var r = b.hp / b.maxHp;
    var gr = ctx.createLinearGradient(x, 0, x + w, 0); gr.addColorStop(0, '#ff2a4a'); gr.addColorStop(1, '#ff9a3a');
    ctx.fillStyle = gr; ctx.fillRect(x, y + 8, Math.max(0, w * r), h);
    var sh = 0; b.statuses.forEach(function (s) { if (s.id === 'shield') sh += s.value; });
    if (sh > 0) { ctx.fillStyle = 'rgba(160,220,255,0.7)'; ctx.fillRect(x, y + 8, Math.min(w, w * sh / b.maxHp), 2); }
    ctx.font = 'bold 7px ' + FONT; ctx.textAlign = 'left'; ctx.fillStyle = '#ffd0d8'; ctx.fillText(b.name, x, y + 2);
    ctx.textAlign = 'right'; ctx.fillStyle = '#fff'; ctx.fillText(U.fmt(b.hp) + ' / ' + U.fmt(b.maxHp), x + w, y + 2);
    if (AL.Game.runner.battle.timeLimit) {
      var left = Math.max(0, AL.Game.runner.battle.timeLimit - AL.Game.runner.battle.waveTime);
      ctx.textAlign = 'center'; ctx.fillStyle = left < 15 ? '#ff6a6a' : '#cfd2ff'; ctx.fillText('残り ' + Math.ceil(left) + '秒', W / 2, y + 22);
    }
    ctx.textAlign = 'center';
  }

  function drawUnit(ctx, u, v, t, moving) {
    var isBoss = u.isBoss, size = Math.round((isBoss ? 64 : 32) * SC);
    var img = u.sprite && u.sprite.kind === 'hero' ? S.hero(u.sprite.id) : S.enemy(u.sprite || { shape: 'slime', pal: ['#888', '#444', '#f00'] });
    var flip = u.side === 'enemy';
    var ox = 0, oy = 0, alpha = 1;
    // 動作アニメーション
    if (v.anim) {
      var q = (t - v.anim.t0) / v.anim.dur;
      if (q >= 1) v.anim = null;
      else if (v.anim.type === 'lunge') ox = Math.sin(q * Math.PI) * v.anim.dx;
      else if (v.anim.type === 'recoil') ox = Math.sin(q * Math.PI) * v.anim.dx;
    }
    // 待機の呼吸・移動時の歩行
    var bob = 0;
    if (u.alive) {
      if (moving && u.side === 'ally') { bob = Math.abs(Math.sin(t * 12 + v.phase)) * -2; ox += Math.sin(t * 6 + v.phase) * 1.5; }
      else bob = Math.sin(t * 2.5 + v.phase) * 0.8;
    }
    // 被弾
    var hitAge = t - v.hitT;
    if (hitAge < 0.18) ox += (u.side === 'ally' ? -1 : 1) * (1 - hitAge / 0.18) * 3;
    // 出現・撃破
    var spawnAge = t - v.spawnT;
    if (u.side === 'enemy' && spawnAge < 0.35) { alpha = spawnAge / 0.35; ox += (1 - alpha) * 30; }
    if (!u.alive) {
      var da = v.deadT >= 0 ? t - v.deadT : 1;
      if (u.side === 'enemy') { if (da > 0.6) return; alpha = 1 - da / 0.6; oy += da * 10; }
      else alpha = 0.35;
    }
    v.ox = ox;
    var x = Math.round(v.x - size / 2 + ox), y = Math.round(v.y - size + oy + bob);
    // 影
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.beginPath(); ctx.ellipse(v.x + ox, v.y - 1, size * 0.32, size * 0.08, 0, 0, 7); ctx.fill();
    // スキル発動の魔法陣
    var castAge = t - v.castT;
    if (castAge < 0.6 && u.alive) {
      var col = elemColor(u.element);
      ctx.strokeStyle = S.rgba(col, 0.9 * (1 - castAge / 0.6)); ctx.lineWidth = 1;
      ctx.beginPath(); ctx.ellipse(v.x + ox, v.y - 2, size * 0.45 + castAge * 20, size * 0.12 + castAge * 5, 0, 0, 7); ctx.stroke();
      ctx.fillStyle = S.rgba(col, 0.25 * (1 - castAge / 0.6)); ctx.fillRect(x, y, size, size);
    }
    // ボスのオーラ
    if (isBoss && u.alive && Math.random() < 0.5 * quality()) {
      Scene.fx.push({ x: v.x + (Math.random() - 0.5) * 50, y: v.y - Math.random() * 10, vx: 0, vy: -25 - Math.random() * 20, life: 0.8, t0: t, color: (u.sprite && u.sprite.pal && u.sprite.pal[2]) || '#ff2a4a', size: 1, grav: 0 });
    }
    ctx.globalAlpha = alpha;
    if (flip) { ctx.save(); ctx.translate(x + size, y); ctx.scale(-1, 1); ctx.drawImage(img, 0, 0, size, size); ctx.restore(); }
    else ctx.drawImage(img, x, y, size, size);
    // 被弾の白フラッシュ
    if (hitAge < 0.1 && u.alive) {
      ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 0.6 * (1 - hitAge / 0.1);
      if (flip) { ctx.save(); ctx.translate(x + size, y); ctx.scale(-1, 1); ctx.drawImage(img, 0, 0, size, size); ctx.restore(); }
      else ctx.drawImage(img, x, y, size, size);
      ctx.globalCompositeOperation = 'source-over';
    }
    // 凍結・気絶の表示
    if (u.alive) {
      var cc = null;
      for (var i = 0; i < u.statuses.length; i++) { var s = u.statuses[i].id; if (s === 'freeze' || s === 'stun') cc = s; }
      if (cc === 'freeze') { ctx.globalAlpha = 0.35; ctx.fillStyle = '#9be7ff'; ctx.fillRect(x + 4, y + 4, size - 8, size - 4); }
      if (cc === 'stun') { ctx.globalAlpha = 1; ctx.fillStyle = '#ffe066'; for (var s2 = 0; s2 < 3; s2++) { var a = t * 4 + s2 * 2.1; ctx.fillRect(Math.round(v.x + Math.cos(a) * 7), Math.round(y + 2 + Math.sin(a) * 2), 2, 2); } }
      if (u.statuses.some(function (st) { return st.id === 'shield' && st.value > 0; })) {
        ctx.globalAlpha = 0.25 + 0.1 * Math.sin(t * 5); ctx.strokeStyle = '#9fd8ff'; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.ellipse(v.x + ox, y + size * 0.55, size * 0.42, size * 0.55, 0, 0, 7); ctx.stroke();
      }
    }
    ctx.globalAlpha = 1;
    // HPバー（ボスは上部に表示）
    if (u.alive && !isBoss) {
      var bw = 28, bx = Math.round(v.x - bw / 2 + ox), by = y - 3;
      ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(bx - 1, by - 1, bw + 2, 4);
      var r = u.hp / u.maxHp;
      ctx.fillStyle = u.side === 'ally' ? (r > 0.5 ? '#5fe08a' : (r > 0.25 ? '#ffd84a' : '#ff5a5a')) : '#ff5a6a';
      ctx.fillRect(bx, by, Math.max(0, Math.round(bw * r)), 2);
      var shv = 0; u.statuses.forEach(function (s) { if (s.id === 'shield') shv += s.value; });
      if (shv > 0) { ctx.fillStyle = '#bfe8ff'; ctx.fillRect(bx, by + 2, Math.min(bw, Math.round(bw * shv / u.maxHp)), 1); }
      // スキル待機
      if (u.side === 'ally' && u.skill) {
        var cdr = 1 - Math.min(1, u.cd / (u.skill.cd * (1 - u.cdr)));
        ctx.fillStyle = cdr >= 1 ? '#7ad8ff' : '#2a5a7a'; ctx.fillRect(bx, by + 3, Math.round(bw * cdr), 1);
      }
      // 状態アイコン
      var icons = u.statuses.filter(function (s) { return D.STATUSES[s.id] && s.id !== 'shield'; }).slice(0, 5);
      icons.forEach(function (s, i2) {
        var sd = D.STATUSES[s.id];
        ctx.fillStyle = sd.color; ctx.fillRect(bx + i2 * 5, by - 5, 4, 3);
        if (sd.debuff) { ctx.fillStyle = '#000'; ctx.fillRect(bx + i2 * 5 + 1, by - 4, 2, 1); }
      });
    }
    // スキル名
    if (castAge < 1.0 && v.castName) {
      ctx.globalAlpha = castAge > 0.7 ? (1 - castAge) / 0.3 : 1;
      ctx.font = 'bold 6.5px ' + FONT; ctx.textAlign = 'center';
      ctx.lineWidth = 2; ctx.strokeStyle = '#000'; ctx.strokeText(v.castName, v.x, y - 9);
      ctx.fillStyle = u.side === 'ally' ? '#9fe8ff' : '#ff9a8a'; ctx.fillText(v.castName, v.x, y - 9);
      ctx.globalAlpha = 1;
    }
  }
